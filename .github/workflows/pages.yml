# Deploy docs/ to GitHub Pages (Settings → Pages → Source = "GitHub Actions", switched 10 Nov 2026).
# 10 Nov 2026: GitHub's Pages backend kept timing out (deployment_queued → syncing_files > 10 min, the hard maximum).
# So this also runs every 30 min: it checks the live site's deployed-tree.txt and deploys only if the live site is not the newest docs/.
name: Deploy Pages (docs)
on:
  push:
    branches: [main]
    paths: ['docs/**']
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs
          sparse-checkout-cone-mode: true
      - id: check
        run: |
          TREE=$(git rev-parse HEAD:docs)
          LIVE=$(curl -fsS "https://bankypp.github.io/ac-mdcu/deployed-tree.txt?t=$(date +%s)" || true)
          echo "docs tree $TREE · live $LIVE"
          if [ "$TREE" = "$LIVE" ] && [ "${{ github.event_name }}" = "schedule" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; else echo "$TREE" > docs/deployed-tree.txt; fi
      - if: steps.check.outputs.skip != '1'
        uses: actions/configure-pages@v5
      - if: steps.check.outputs.skip != '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - if: steps.check.outputs.skip != '1'
        id: deployment
        uses: actions/deploy-pages@v4
