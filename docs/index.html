<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คลังข้อสอบเก่า MDCU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EBEFEA; --sheet:#FFFFFF; --ink:#1B2425; --muted:#5A6665; --rule:#D5DCD6;
  --form:#C2386A; --form-soft:#F6DCE6; --graphite:#2A2E31; --on-graphite:#FFFFFF;
  --right:#1D7A50; --right-soft:#DDF1E6; --wrong:#B2412A; --wrong-soft:#F8E1DA;
  --hl:#FFF0A0; --warn:#9A6400; --warn-soft:#FFF1D2;
  --num:'Chakra Petch', 'IBM Plex Sans Thai', system-ui, sans-serif;
  --body:'IBM Plex Sans Thai', 'Noto Sans Thai', 'Leelawadee UI', system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121717; --sheet:#1A2121; --ink:#E4EBE9; --muted:#97A4A2; --rule:#2C3636;
    --form:#E9759F; --form-soft:#3A2230; --graphite:#E4EBE9; --on-graphite:#121717;
    --right:#4FC48D; --right-soft:#16342A; --wrong:#F2805F; --wrong-soft:#3B211B;
    --hl:#5A4E16; --warn:#F0BE5A; --warn-soft:#382D14;
  }
}
:root[data-theme="dark"]{
  --paper:#121717; --sheet:#1A2121; --ink:#E4EBE9; --muted:#97A4A2; --rule:#2C3636;
  --form:#E9759F; --form-soft:#3A2230; --graphite:#E4EBE9; --on-graphite:#121717;
  --right:#4FC48D; --right-soft:#16342A; --wrong:#F2805F; --wrong-soft:#3B211B;
  --hl:#5A4E16; --warn:#F0BE5A; --warn-soft:#382D14;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
img{max-width:100%;height:auto;display:block}
:focus-visible{outline:2.5px solid var(--form);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1.5px solid var(--form)}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font-family:var(--num);font-weight:700;font-size:17px;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-family:var(--body);font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
.sheet-btn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--form);background:transparent;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:14px;font-weight:500}
.sheet-btn .count{font-family:var(--num);font-weight:600}
.mini-bub{display:inline-flex;gap:3px}
.mini-bub i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--form)}
.mini-bub i:nth-child(2){background:var(--graphite);border-color:var(--graphite)}
.progress{height:3px;background:var(--rule)}
.progress span{display:block;height:100%;background:var(--form);width:0;transition:width .3s}

main{max-width:760px;margin:0 auto;padding:20px 16px 120px}

/* question head */
.qhead{display:flex;align-items:flex-end;gap:14px;margin-bottom:14px}
.qnum{font-family:var(--num);font-weight:700;font-size:44px;line-height:.9;color:var(--form)}
.fields{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:4px}
.field{border:1.5px solid var(--form);border-radius:3px;padding:1px 8px;font-family:var(--num);font-weight:600;font-size:14px;letter-spacing:.03em}
.field b{font-weight:500;color:var(--muted);margin-right:5px;font-size:11px}
.stem{font-size:18px;line-height:1.7;margin:0 0 6px}
.gray{color:var(--muted);font-size:14.5px;line-height:1.6;margin:6px 0 0;padding-left:12px;border-left:2px solid var(--rule)}
.stem-img{margin:14px 0 4px;border:1px solid var(--rule);border-radius:4px;background:#fff;max-width:520px}
.stem-img img{display:block;width:100%;height:auto}
.stem-img img+img{border-top:1px solid var(--rule)}
.kimg{display:grid;gap:10px}
.kimg img{display:block;width:100%;max-width:640px;height:auto;border:1px solid var(--rule);border-radius:4px;background:#fff}
.img-missing{margin:14px 0 4px;padding:10px 12px;border:1px dashed var(--rule);border-radius:4px;font-size:13px;color:var(--muted)}
.img-note{font-size:12.5px;line-height:1.5;color:#5A6665;padding:6px 10px;background:#F4F6F3;border-top:1px solid var(--rule)}

/* options = OMR bubbles */
.opts{list-style:none;margin:22px 0 0;padding:0;border-top:1px solid var(--rule)}
.opt{display:flex;align-items:flex-start;gap:14px;padding:12px 6px;border-bottom:1px solid var(--rule);cursor:pointer;border-radius:4px;transition:background .15s}
.opt:hover{background:var(--form-soft)}
.opt[aria-disabled="true"]{cursor:default}
.opt[aria-disabled="true"]:hover{background:transparent}
.bub{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--form);display:grid;place-items:center;font-family:var(--num);font-weight:600;font-size:15px;color:var(--form);position:relative;transition:background .18s,color .18s,border-color .18s}
.opt .txt{padding-top:4px;flex:1}
.opt.sel .bub{background:var(--graphite);border-color:var(--graphite);color:var(--on-graphite);animation:fill .22s ease-out}
@keyframes fill{from{transform:scale(.82)}to{transform:scale(1)}}
.opt.correct{background:var(--right-soft)}
.opt.correct .bub{border-color:var(--right);color:var(--right);box-shadow:0 0 0 3px var(--right-soft),0 0 0 5px var(--right)}
.opt.correct.sel .bub{background:var(--right);color:#fff}
.opt.wrongpick{background:var(--wrong-soft)}
.opt.wrongpick .bub{background:var(--wrong);border-color:var(--wrong);color:#fff}
.opt.wrongpick .txt{text-decoration:line-through;text-decoration-color:var(--wrong)}
.opt.dim .txt{color:var(--muted)}

.actions{display:flex;gap:10px;margin-top:20px;align-items:center}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:6px;padding:10px 16px;cursor:pointer;font-weight:500;font-size:16px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{border-color:var(--rule)}
.spacer{flex:1}
.hint{font-size:13px;color:var(--muted)}

/* explanation */
.exp{margin-top:28px;background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--ink);border-radius:2px 2px 6px 6px;padding:20px 18px 8px;animation:reveal .35s ease-out}
@keyframes reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.verdict{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;margin-bottom:6px}
.verdict .v{font-family:var(--num);font-weight:700;font-size:24px}
.verdict .v.ok{color:var(--right)} .verdict .v.no{color:var(--wrong)}
.verdict .ans{font-size:15.5px}
.tagline{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.guide{flex-basis:100%;font-size:13px;line-height:1.55;padding:7px 10px;border-radius:4px;background:#EEF3FB;border:1px solid #C9D6EE;color:#26406B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .guide{background:#1B2638;border-color:#2E4266;color:#BFD0EE}}
.tag{font-size:13px;border-radius:4px;padding:2px 8px;border:1px solid var(--rule);color:var(--muted)}
.tag.rep{border-color:var(--form);color:var(--form);font-family:var(--num);font-weight:600;font-size:14px}
.tag.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.sec{padding:14px 0;border-top:1px dashed var(--rule)}
.sec:first-of-type{border-top:0}
.sec h3{font-family:var(--body);font-size:14px;font-weight:600;color:var(--form);margin:0 0 6px;letter-spacing:.01em}
.sec p{margin:0}
.sec ul{margin:0;padding-left:20px}
.sec li{margin:3px 0}
.wrong-list{list-style:none;padding:0!important}
.wrong-list li{display:flex;gap:10px;margin:8px 0!important}
.wrong-list .l{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--num);font-size:12.5px;font-weight:600;color:var(--muted);margin-top:2px}
.notes{background:linear-gradient(transparent 0, transparent 0);}
.notes .box{background:var(--sheet);border-left:4px solid var(--hl);padding:2px 0 2px 12px}
.notes b{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.notes figure{margin:12px 0 4px;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:#fff;max-width:560px}
.notes figcaption{font-size:12px;color:#666;padding:4px 8px;background:#f4f4f4}
.opinion .box{background:var(--warn-soft);border-radius:4px;padding:10px 12px}
.trap .box{border-left:4px solid var(--wrong);padding-left:12px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:760px;margin:0 auto;display:flex;gap:10px;padding:10px 16px;align-items:center}
.nav .pos{font-family:var(--num);font-weight:600;font-size:15px;color:var(--muted);flex:1;text-align:center}

/* answer sheet overlay */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,14,14,.45);display:none}
.overlay.open{display:block}
.panel{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:slide .25s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
.panel-h{padding:10px 16px 8px;border-bottom:1.5px solid var(--form)}
.panel-h .row{display:flex;align-items:center;gap:10px}
.panel-h h2{font-family:var(--num);font-size:20px;margin:0;flex:1}
.x{border:0;background:transparent;font-size:26px;line-height:1;cursor:pointer;padding:4px 8px;color:var(--muted)}
.stats{display:flex;gap:18px;margin:6px 0 2px}
.stat .n{font-family:var(--num);font-weight:700;font-size:22px;line-height:1}
.stat .k{font-size:12.5px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;padding-bottom:6px;margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 28px),transparent)}
.chips.scroll .chip{flex:none;white-space:nowrap}
.chip{border:1.5px solid var(--rule);background:transparent;border-radius:999px;padding:2px 10px;font-size:13px;line-height:1.5;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.rows{overflow:auto;flex:1;padding:6px 8px 16px}
.srow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:7px 8px;border-radius:4px;cursor:pointer;text-align:left}
.srow:hover{background:var(--form-soft)}
.srow.cur{background:var(--form-soft)}
.srow .n{font-family:var(--num);font-weight:600;width:40px;flex:none;text-align:right;color:var(--form)}
.srow .bs{display:flex;gap:7px}
.srow .b{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--form);font-family:var(--num);font-size:9.5px;display:grid;place-items:center;color:var(--form);opacity:.75}
.srow .b.f{background:var(--graphite);border-color:var(--graphite);color:var(--on-graphite);opacity:1}
.srow .b.f.ok{background:var(--right);border-color:var(--right);color:#fff}
.srow .b.f.no{background:var(--wrong);border-color:var(--wrong);color:#fff}
.srow .b.k{box-shadow:0 0 0 2px var(--right)}
.srow .meta{font-size:12px;color:var(--muted);margin-left:auto;font-family:var(--num)}
.panel-f{padding:6px 16px;border-top:1px solid var(--rule);display:flex;gap:10px;align-items:center}
.empty{padding:30px 16px;color:var(--muted);text-align:center}
.panel-f{flex-wrap:wrap;gap:4px}
.redo{margin-left:auto}
.optnote{display:block;margin-top:8px;font-size:.92em;color:var(--muted)}
.link{background:none;border:0;color:var(--wrong);text-decoration:underline;cursor:pointer;font-size:13px;padding:3px 4px}

@media (max-width:520px){
  body{font-size:16px}
  .qnum{font-size:38px}
  .stem{font-size:17px}
  .exp{padding:16px 14px 6px;margin-left:-4px;margin-right:-4px}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* ---- website additions (home / rounds / notes / AI / account) ---- */
[hidden]{display:none!important}
/* stop mobile browsers from auto-enlarging some text blocks (iOS/Android text autosizing) */
html{-webkit-text-size-adjust:100%;-moz-text-size-adjust:100%;text-size-adjust:100%}
.home-btn{border:0;background:transparent;font-size:24px;line-height:1;padding:2px 6px 4px;cursor:pointer;color:var(--form);flex:none}
.acct{flex:none;width:36px;height:36px;border:1.5px solid var(--rule);background:transparent;border-radius:50%;padding:0;font-size:16px;line-height:1;cursor:pointer;display:grid;place-items:center}
.brand.long{white-space:normal;line-height:1.2;font-size:16px}
@media (max-width:380px){.brand.long{font-size:15px}}
.acct.on{border-color:var(--right);color:var(--right)}
.h1{font-family:var(--num);font-weight:700;font-size:28px;line-height:1.2;margin:6px 0 2px}
.h2{font-family:var(--num);font-weight:700;font-size:22px;line-height:1.25;margin:4px 0 2px}
.sub{color:var(--muted);font-size:14.5px;margin:0 0 16px}
.wcard{display:flex;gap:14px;align-items:center;padding:14px;border:1.5px solid var(--rule);border-radius:8px;background:var(--sheet);text-decoration:none;color:var(--ink);margin-bottom:10px}
.wcard:hover{border-color:var(--form)}
.wcard .wb{font-family:var(--num);font-weight:700;color:var(--form);border:2px solid var(--form);border-radius:50%;width:54px;height:54px;display:grid;place-items:center;flex:none;font-size:15px}
.wcard .wb{text-align:center;line-height:1.05;font-size:14px;padding:0 4px}
.wcard b{font-family:var(--num);font-size:17px}
.rd{display:block;color:var(--muted);font-size:13.5px;line-height:1.5;font-weight:400}
.whead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.whead a{font-size:13.5px;color:var(--muted);margin-left:auto}
.tabs{display:flex;border-bottom:1.5px solid var(--rule);margin:10px 0 14px}
.tab{flex:1;border:0;background:transparent;padding:10px 0;font-family:var(--num);font-weight:600;font-size:15.5px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px;cursor:pointer}
.tab[aria-selected="true"]{color:var(--form);border-color:var(--form)}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;font-size:13px;cursor:pointer;line-height:1.35;color:var(--muted)}
.seg button b{font-family:var(--num);display:block;font-size:15.5px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button[aria-pressed="true"] b{color:var(--paper)}
.phase-hint{font-size:13.5px;color:var(--muted);margin:8px 2px 0;line-height:1.55}
.statline{font-size:13.5px;color:var(--muted);margin:12px 2px 0}
.statline b{font-family:var(--num);color:var(--ink)}
.rounds{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media (max-width:359px){.rounds{grid-template-columns:1fr}}
.round{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:12px 12px 12px;cursor:pointer;min-height:104px;position:relative}
.round:hover{border-color:var(--form)}
.round .rn{font-family:var(--num);font-weight:700;color:var(--form);font-size:13px;letter-spacing:.04em}
.round b{font-family:var(--num);font-size:16.5px;line-height:1.25}
.round[aria-disabled="true"]{opacity:.5;cursor:default}
.round[aria-disabled="true"]:hover{border-color:var(--rule)}
.round .soon,.round .badge{position:absolute;top:10px;right:10px;font-size:11.5px;border-radius:999px;padding:0 8px;line-height:1.6}
.round .soon{border:1px solid var(--rule);color:var(--muted)}
.round .badge{font-family:var(--num);font-weight:600;background:var(--form);color:#fff}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;margin-top:14px}
.card h3{font-family:var(--num);font-size:16px;margin:0 0 4px;color:var(--form)}
.card .rd{margin-bottom:10px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool{border:1.5px solid var(--rule);background:transparent;border-radius:6px;padding:8px 10px;text-align:left;cursor:pointer;font-size:14px;line-height:1.4;color:var(--ink)}
.tool:hover{border-color:var(--form)}
.tool .n{font-family:var(--num);font-weight:700;float:right;margin-left:6px;color:var(--form)}
.tool.wide{grid-column:1/-1}
.resume{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--form);background:var(--form-soft);border-radius:8px;padding:10px 12px;margin-top:14px;cursor:pointer;font-size:14.5px;color:var(--ink)}
.resume b{font-family:var(--num)}
.resume .go{margin-left:auto;font-family:var(--num);font-weight:700;color:var(--form)}
.flag{margin-left:auto;align-self:flex-start;border:1.5px solid var(--rule);background:transparent;border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer;color:var(--muted);white-space:nowrap}
.flag[aria-pressed="true"]{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.sessbar{font-size:13px;color:var(--muted);margin-bottom:8px;font-family:var(--num);font-weight:600;letter-spacing:.02em}
.note{margin-top:4px}
.ntabs{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.ntabs button{border:1.5px solid var(--rule);background:transparent;border-radius:999px;padding:2px 12px;font-size:13px;cursor:pointer;min-height:30px;color:var(--ink)}
.ntabs button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.ntabs button.has::after{content:" •";color:var(--form)}
.nsaved{margin-left:auto;font-size:12px;color:var(--muted)}
.ntext,.field-in{width:100%;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet);color:var(--ink);padding:8px 10px;font:inherit;font-size:15.5px;line-height:1.6}
.ntext{min-height:96px;resize:vertical;display:block}
.ntext:focus,.field-in:focus{outline:none;border-color:var(--form)}
.inkbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.inkbar button{border:1.5px solid var(--rule);background:transparent;border-radius:6px;padding:3px 9px;font-size:13px;cursor:pointer;min-height:32px;color:var(--ink)}
.inkbar button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.inkbar [data-c][aria-pressed="true"]{background:transparent;color:inherit;border-color:var(--form);box-shadow:inset 0 0 0 1.5px var(--form)}
.inkbar .dot{width:14px;height:14px;border-radius:50%;display:inline-block;vertical-align:-2px}
.inkbar .sep{flex:1}
canvas.ink{display:block;width:100%;height:220px;touch-action:none;border:1.5px solid var(--rule);border-radius:6px;background:var(--sheet) repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);cursor:crosshair}
details.pre{margin-top:18px;border:1px dashed var(--rule);border-radius:6px;padding:8px 10px}
details.pre>summary{cursor:pointer;font-size:14.5px;color:var(--form);font-weight:600;list-style:none}
details.pre>summary::-webkit-details-marker{display:none}
details.pre>summary::before{content:"▸ ";}
details.pre[open]>summary::before{content:"▾ ";}
details.pre[open]>summary{margin-bottom:8px}
.mine{background:var(--form-soft);border-radius:6px;padding:10px 10px 12px;margin:0 -4px}
.mine h3{margin-bottom:2px}

    "Indirect inguinal hernia ผ่าน deep inguinal ring (lateral ต่อ inferior epigastric vessels) ลงตาม inguinal canal อาจลงถุงอัณฑะหรือ labium majus — ตำแหน่งอยู่ที่ขาหนีบ ไม่ใช่ผนังหน้าท้องเหนือขาหนีบ; จะถูกถ้าก้อนอยู่ที่ขาหนีบและเคลื่อนไปตาม inguinal canal",
    "Umbilical hernia อยู่ที่<b>สะดือ</b> (midline ผ่าน umbilical ring) — ไม่ใช่ขอบ lateral ของ rectus; จะถูกถ้าก้อนโป่งที่สะดือ พบในทารก หญิงหลังตั้งครรภ์ cirrhosis มี ascites"],
  trap:"เห็นประวัติผ่าตัดเก่าแล้วตอบ incisional ทันที — ต้องดูว่าก้อนอยู่ตรงแผลหรือไม่; และ Spigelian hernia ไม่ได้อยู่ใน rectus sheath แต่อยู่ที่<b>ขอบ lateral</b> ของ rectus",
  summary:["Spigelian hernia: defect ใน Spigelian fascia (aponeurosis ของ transversus abdominis + internal oblique) ระหว่าง linea semilunaris กับขอบ lateral ของ rectus abdominis","ตำแหน่งที่พบบ่อย = Spigelian hernia belt ใต้สะดือ ระดับใต้ arcuate line; พบน้อย (ราว 1–2% ของ abdominal wall hernia) มักพบอายุ 40–70 ปี","เป็น interparietal hernia อยู่ใต้ external oblique aponeurosis → คลำยาก อาการปวดเฉพาะที่ไม่ชัด; วินิจฉัยด้วย ultrasound (dynamic ขณะเบ่ง) หรือ CT","defect เล็ก ขอบ fascia แข็ง → เสี่ยง incarceration และ strangulation สูง → ควรผ่าตัดซ่อมทุกราย (open หรือ laparoscopic ใช้ mesh)","แยกตามตำแหน่ง: epigastric = linea alba เหนือสะดือ; umbilical = สะดือ; Spigelian = ขอบ lateral rectus; inguinal = เหนือ inguinal ligament; femoral = ใต้ inguinal ligament; incisional = ตรงแผลผ่าตัดเดิม","Lateral ventral hernia อื่น: lumbar hernia (superior = Grynfeltt, inferior = Petit triangle)","ดูข้อ 3, 37, 64, 65, 66 (hernia)"],
  notes:"ลายมือในไฟล์เฉลย: ขีดเส้นใต้ \"lateral rectus abdominis\" แล้วเขียน <b>\"= semilunar line of Spiegel\"</b>; ที่ช้อย b วงคำตอบ แล้วเขียน <b>\"หลุดผ่าน Spigelian fascia ↘ = transversus abdominis + internal oblique aponeurosis\"</b>; แปะรูปตำแหน่ง hernia บนผนังหน้าท้อง (epigastric, umbilical, Spigelian, inguinal, femoral) และวาดแผลผ่าคลอดแนวขวางบนรูป เขียนกำกับว่า <b>\"ผ่าตรงนี้ไป = Hx ไม่เข้า\"</b> (คือตำแหน่งแผลไม่ตรงกับก้อน จึงไม่ใช่ incisional)",
  mnemonic:"<b>Spigelian = Side of rectus</b> (S คู่: Spiegel–Side) — ขอบข้างของ rectus ใต้สะดือ",
  guide:"European Hernia Society classification of primary and incisional abdominal wall hernias (Muysoms et al., Hernia 2009); Sabiston Textbook of Surgery 21st ed. (2022) — Hernias",
  opinion:"เห็นด้วยกับคีย์ B มั่นใจสูง — ต้นฉบับเขียนกำกวม (low midline scar เป็น transverse line) จึงระบุให้ชัดว่าแผลเป็นแนวขวางและก้อนอยู่ห่างจากแผล",
  variants:["ก้อนโป่งที่ขอบ lateral ของ rectus ใต้สะดือ คลำไม่ชัด US พบ defect ใต้ external oblique aponeurosis → ถาม layer ที่ defect อยู่ (Spigelian aponeurosis)","ผู้ป่วยหลังผ่าตัดแผล midline มีก้อนโป่งตรงแผลตอนเบ่ง → incisional hernia","ถามตำแหน่ง Spigelian hernia ที่พบบ่อย → ใต้ arcuate line ใน Spigelian hernia belt"]}),

A({page:1, page2:1, orig:"2", kimg:KI("2_1","2_2"),
  stem:"A patient had a fish bone stuck in the throat, which was removed by EGD. While it was being pulled out, the patient had severe throat pain. After going home, the pain did not improve with analgesics, and the neck became painful, swollen, red, and warm. At the hospital, the temperature is 38°C and ultrasound shows subcutaneous emphysema. What is the diagnosis?",
  gray:"2. ก้างปลาติดคอจึงเอาออกด้วย EGD ตอนดึงออกมาคนไข้เจ็บคอมากหลังกลับบ้านกินยาแก้ปวดแล้ว ไม่หาย แล้วบริเวณคอปวด บวม แดง ร้อน มารพ. BT 38, U/S subcutaneus emphysema, what is dx — a. Pharyngo-esophageal perforation b. Esophageal abscess c. Zenker diverticulum rupture",
  opts:["Pharyngoesophageal perforation","Esophageal abscess","Zenker diverticulum rupture","Mallory-Weiss tear","Ludwig angina"],
  ans:0, key:"A Pharyngo-esophageal perforation"+KS,
  interp:"มีเหตุชักนำชัด (foreign body + เครื่องมือ endoscope ตอนดึงออก) ตามด้วยเจ็บคอรุนแรง ไข้ คอบวมแดงร้อน และ<b>มีลมใต้ผิวหนัง</b> → ลมรั่วออกจาก lumen ของคอหอยหรือหลอดอาหารส่วนคอ",
  why:"<b>Instrumentation</b> เป็นสาเหตุหลักของ esophageal perforation (สไลด์: ~75%) และมักเกิดที่ตำแหน่งแคบตามกายวิภาค โดยเฉพาะ <b>cricopharyngeus / Killian triangle</b> ที่รอยต่อ pharynx–esophagus; ก้างปลาและการดึงสิ่งแปลกปลอมออกเพิ่มความเสี่ยง; cervical perforation มาด้วย neck pain, dysphagia/odynophagia, neck stiffness, <b>subcutaneous emphysema</b>, ไข้ และเข้าสู่ sepsis ได้เร็วถ้าไม่รักษา — ไม่จำเป็นต้องเกิด abscess ก่อนจึงจะมีไข้ (ลายมือรุ่นพี่)",
  wrong:["Esophageal abscess (จริง ๆ คือ deep neck/retropharyngeal abscess) เป็น<b>ภาวะแทรกซ้อนตามมา</b>ของ perforation ไม่ใช่ diagnosis หลักที่อธิบาย subcutaneous emphysema ได้; จะถูกถ้าโจทย์บอกว่ามี fluid collection มีขอบ rim enhancement ใน CT หลังทะลุไปหลายวัน",
    "Zenker diverticulum rupture ต้องมีประวัติ Zenker มาก่อน (ผู้สูงอายุ กลืนลำบาก สำรอกอาหารที่ไม่ย่อย กลิ่นปาก มีเสียงก๊อกในคอ) — โจทย์ไม่มี; จะถูกถ้าผู้ป่วยรู้ว่าเป็น Zenker แล้วทะลุระหว่างส่องกล้อง",
    "Mallory-Weiss tear = mucosal tear ที่ gastroesophageal junction จากการอาเจียนหรือขย้อนแรง มาด้วย hematemesis ไม่ทะลุผ่านผนังทั้งหมด จึงไม่มี emphysema; จะถูกถ้าโจทย์ให้ประวัติอาเจียนหลายครั้งแล้วตามด้วยอาเจียนเป็นเลือด",
    "Ludwig angina = cellulitis ของ submandibular space สองข้าง ส่วนใหญ่มาจากฟันกรามล่าง พื้นปากแข็ง ลิ้นถูกดันขึ้น ทางเดินหายใจอุดกั้น — ไม่มีประวัติ instrumentation; จะถูกถ้าโจทย์ให้ฟันผุกรามล่าง ใต้คางบวมแข็งสองข้าง น้ำลายไหล"],
  trap:"คิดว่าต้องเป็น abscess ก่อนจึงมีไข้ — perforation เองทำให้ mediastinitis หรือ neck infection และ sepsis ได้เลย; <b>subcutaneous emphysema หลัง instrumentation = perforation จนกว่าจะพิสูจน์ได้ว่าไม่ใช่</b>",
  summary:["สาเหตุ esophageal perforation: iatrogenic (instrumentation ราว 75% ตามสไลด์) > Boerhaave (barotrauma จากอาเจียน) > foreign body, trauma, caustic, tumor; mortality โดยรวมราว 20%","ตำแหน่ง: cervical (Killian triangle เหนือ cricopharyngeus) มักจาก instrumentation พยากรณ์ดีที่สุด; thoracic (Boerhaave มักที่ distal left posterolateral) รุนแรงที่สุด","อาการ: pain, dysphagia, fever → sepsis; cervical → neck pain, stiffness, subcutaneous emphysema; thoracic → chest pain, mediastinal emphysema, pleural effusion (Mackler triad ใน Boerhaave: vomiting, chest pain, subcutaneous emphysema)","วินิจฉัย: CT neck/chest with oral water-soluble contrast หรือ contrast esophagram (water-soluble ก่อน ถ้าไม่เห็นรั่วจึงใช้ barium)","รักษา: NPO, IV fluid, broad-spectrum antibiotics ± antifungal, PPI, nutrition; cervical perforation ส่วนใหญ่ใช้ drainage ทาง cervical incision ± primary repair; รั่วเล็กแบบ contained และไม่มี sepsis → nonoperative; endoscopic clip หรือ stent ในบางราย","ป้องกัน: foreign body ในคอหอยหรือหลอดอาหารใช้ endoscope ใส่ overtube หรือ protector hood เวลาดึงของแหลมคมออก","ดูข้อ 5, 11, 71 (UGI)"],
  notes:"ลายมือที่ช้อย a (วงคำตอบ): <b>\"ไม่ต้องถึง abscess ก็มีไข้, sepsis ได้\"</b>; แปะสไลด์ <b>I. Esophageal perforation</b>: overall mortality ~20%; intraluminal causes — <b>instrumentation injuries represent 75%</b> of esophageal perforations and most commonly occur at anatomical narrowings (ไฮไลต์), foreign bodies (perforation ทันทีหรือ indolent course แล้วเกิด late abscess ใน mediastinum หรือ empyema), caustic substances, cancer, barotrauma (Boerhaave); extraluminal causes — penetrating, blunt, operative injury; <b>signs and symptoms</b> include dysphagia, pain, and fever and quickly progress to sepsis if left undiagnosed or untreated (ไฮไลต์); <b>cervical perforations may present with neck stiffness and subcutaneous emphysema</b>; intrathoracic → chest pain, subcutaneous emphysema, dyspnea, pleural effusion; intra-abdominal → peritonitis (สไลด์ส่วนหลังอยู่ข้างข้อ 3 ในหน้าเดียวกัน)",
  mnemonic:"",
  guide:"Esophageal emergencies: WSES guidelines (Chirica et al., World J Emerg Surg 2019); Removal of foreign bodies in the upper GI tract: ESGE Guideline (Birk et al., 2016); Sabiston 21st ed. (2022)",
  opinion:"",
  variants:["ชายวัย 50 ดื่มสุราหนัก อาเจียนหลายครั้งแล้วเจ็บหน้าอกรุนแรง คลำได้ crepitus ที่คอ → Boerhaave syndrome; ถาม investigation → CT หรือ water-soluble contrast esophagram","หลัง EGD dilatation มีไข้ เจ็บคอ crepitus ที่คอ → ถามการรักษาเบื้องต้น → NPO, broad-spectrum antibiotics, CT with oral contrast, cervical drainage","ถามตำแหน่งที่หลอดอาหารทะลุจาก instrumentation บ่อยที่สุด → cervical esophagus บริเวณ cricopharyngeus"]}),

A({page:1, page2:1, orig:"3", kimg:KI("3"),
  stem:"During repair of a femoral hernia, the surgeon must take care not to injure an important structure. In which direction does this structure lie relative to the femoral canal?",
  gray:"3. Femoral hernia ระวังโดน important structure, structure นี้อยู่ด้านไหน: answer : lateral — A. Lateral B. Medial C. Anterior D. Posterior E. Superficial",
  opts:["Lateral","Medial","Anterior","Posterior","Superficial"],
  ans:0, key:"A Lateral"+KS,
  interp:"ถามขอบเขตของ femoral canal — structure สำคัญที่ต้องระวังระหว่างซ่อม (เย็บปิด canal หรือวาง plug) คือ <b>femoral vein</b>",
  why:"Femoral canal = compartment ใน<b>สุด</b>ของ femoral sheath; ขอบเขต: anterior = inguinal ligament, posterior = pectineal (Cooper) ligament และ pectineus, medial = lacunar ligament, <b>lateral = femoral vein</b> → เวลาเย็บ inguinal ligament กับ Cooper ligament (McVay) หรือวาง mesh plug ต้องระวังไม่ให้เข็มหรือ plug กด/แทง femoral vein ทางด้าน lateral (เย็บแคบเกินจะตีบ vein → DVT)",
  wrong:["Medial ต่อ canal คือ lacunar ligament — เป็นขอบที่ศัลยแพทย์ตัด (incise) เพื่อขยาย neck ของ femoral hernia ที่รัด; ข้อระวังคือถ้ามี aberrant obturator artery (corona mortis) วิ่งข้าม; จะถูกถ้าถามว่าตัดขอบไหนเพื่อ release incarcerated femoral hernia",
    "Anterior คือ inguinal ligament — เป็นขอบที่ใช้เย็บ ไม่ใช่ structure อันตราย; จะถูกถ้าถามขอบหน้าของ femoral canal",
    "Posterior คือ pectineal (Cooper) ligament และ pectineus fascia — ใช้เป็น anchor ในการเย็บ McVay; จะถูกถ้าถามขอบหลังหรือ ligament ที่ใช้ซ่อม femoral hernia",
    "Superficial คือ cribriform fascia, saphenous opening และ subcutaneous tissue — sac ของ femoral hernia โผล่ผ่าน saphenous opening ขึ้นมาใต้ผิว; จะถูกถ้าถามว่าก้อน femoral hernia โผล่ทางไหน"],
  trap:"ช้อย Medial ล่อเพราะ femoral hernia อยู่ medial — แต่คำถามคือ <b>structure ที่ต้องระวังอยู่ทางไหนเทียบกับ hernia</b> → vein อยู่ <b>lateral</b>; อย่าสับสนกับ corona mortis ที่อยู่ด้าน medial-posterior บน Cooper ligament",
  summary:["Femoral sheath จาก lateral → medial: femoral artery, femoral vein, femoral canal (มี lymphatics และ Cloquet node); femoral nerve อยู่นอก sheath ด้าน lateral สุด","ขอบ femoral ring: anterior inguinal ligament, posterior Cooper ligament, medial lacunar ligament, lateral femoral vein","Femoral hernia: ก้อนใต้ inguinal ligament lateral และ inferior ต่อ pubic tubercle; พบในหญิงมากกว่าชาย แต่ hernia ที่พบบ่อยที่สุดในหญิงยังคงเป็น indirect inguinal","เสี่ยง incarceration และ strangulation สูงที่สุดในกลุ่ม groin hernia เพราะ ring แคบขอบแข็ง → ผ่าตัดทุกราย; HerniaSurge 2018 แนะนำ laparoscopic (TEP หรือ TAPP) หรือ preperitoneal mesh เมื่อทำได้ และผ่าด่วนถ้า incarcerated","Open approaches: low (infrainguinal, Lockwood), high (transinguinal, Lotheissen), McEvedy; McVay repair = เย็บ conjoint tendon กับ Cooper ligament ร่วม relaxing incision ต้องมี transition stitch ระวัง femoral vein","Laparoscopic view: triangle of doom (ระหว่าง vas deferens กับ testicular vessels มี external iliac artery และ vein) ห้ามใส่ tack; triangle of pain (lateral ต่อ testicular vessels ใต้ iliopubic tract มี lateral femoral cutaneous n., femoral branch of genitofemoral n., anterior femoral cutaneous n.) ห้ามใส่ tack","ดูข้อ 1, 37, 64, 65, 66 (hernia)"],
  notes:"ไฟล์โจทย์เขียนท้ายคำถามไว้แล้วว่า <b>\"answer : lateral\"</b>; ไฟล์เฉลยวง A; แปะรูป inguinal region จาก laparoscopic view (right inguinal region): epigastric vessels, inguinal ligament, vas deferens, spermatic vessels — triangle ระหว่าง vas deferens และ spermatic vessels = <b>triangle of doom</b> (เขียนว่า EIA, EIV); ด้าน lateral = <b>triangle of pain</b> (เขียนกำกับ anterior femoral cutaneous n., lateral femoral cutaneous n., femoral br. of genitofemoral n.); เขียนชี้ iliopubic tract, testicular vs., vas def; รูปมีป้าย D (direct), I (indirect), F (femoral) — ด้านขวาของหน้าเป็นสไลด์ esophageal perforation ต่อจากข้อ 2",
  mnemonic:"<b>NAVEL</b> (lateral → medial): Nerve, Artery, Vein, Empty space, Lymphatics — canal = Empty space อยู่ medial ต่อ Vein → vein อยู่ lateral ต่อ canal",
  guide:"HerniaSurge Group. International guidelines for groin hernia management (Hernia 2018); Gray's Anatomy 42nd ed. (2020)",
  opinion:"",
  variants:["ถาม structure ที่เป็นขอบ medial ของ femoral ring และถูกตัดเพื่อ release hernia ที่รัด → lacunar ligament","หญิงสูงอายุมีก้อนใต้ inguinal ligament กดเจ็บ อาเจียน → incarcerated femoral hernia → emergency repair","ระหว่าง TEP ห้ามยิง tack ที่ triangle of doom เพราะมีอะไร → external iliac artery และ vein"]}),

A({page:1, page2:1, orig:"4", kimg:KI("4"),
  stem:"In organ transplantation, which of the following drugs is NOT used for immunosuppression?",
  gray:"4.จะทำ graft ยาตัวไหนไม่ใช้ใน immunosuppression — a. Azathiopine b. Tacrolimus c. Cyclosporine d. Mycophenolate e. Levismasole",
  opts:["Azathioprine","Tacrolimus","Cyclosporine","Mycophenolate mofetil","Levamisole"],
  ans:4, key:"E Levamisole"+KS,
  interp:"ถามว่ายาไหนไม่ใช่ยากดภูมิคุ้มกันที่ใช้ใน transplant (สะกดต้นฉบับผิด: Azathiopine → Azathioprine, Levismasole → Levamisole)",
  why:"<b>Levamisole</b> เป็น<b>ยาถ่ายพยาธิ</b> (anthelmintic) ที่มีฤทธิ์ <b>immunomodulator/immunostimulant</b> — ไม่ใช่ยากดภูมิ; เคยใช้ร่วม 5-FU เป็น adjuvant chemotherapy ของ colon cancer stage III (ปัจจุบันเลิกใช้ ใช้ fluoropyrimidine + oxaliplatin แทน); ยาอีก 4 ตัวเป็นยา maintenance immunosuppression มาตรฐาน",
  wrong:["Azathioprine เป็น antimetabolite → เปลี่ยนเป็น 6-mercaptopurine ยับยั้ง purine synthesis ลด T และ B cell proliferation ใช้เป็น maintenance (ปัจจุบันมักใช้ MMF แทน) — ตอบผิดเพราะเป็นยากดภูมิจริง; ระวัง TPMT deficiency และห้ามใช้ร่วม allopurinol โดยไม่ลดขนาด",
    "Tacrolimus เป็น calcineurin inhibitor (จับ FKBP12) → ลด IL-2 transcription เป็นแกนหลักของ triple therapy — เป็นยากดภูมิจริง; ADR nephrotoxicity, neurotoxicity tremor, post-transplant diabetes",
    "Cyclosporine เป็น calcineurin inhibitor (จับ cyclophilin) — เป็นยากดภูมิจริง; ADR nephrotoxicity, hyperkalemia, hypomagnesemia, hypertension, hirsutism, gingival hyperplasia",
    "Mycophenolate mofetil ยับยั้ง IMPDH → ลด de novo purine synthesis ซึ่ง lymphocyte พึ่งพาเป็นหลัก — เป็น antimetabolite มาตรฐานของ triple therapy; ADR diarrhea, nausea, leukopenia, teratogenic"],
  trap:"ชื่อ Levamisole คล้ายยาเคมีบำบัดหรือยากดภูมิ และเคยอยู่ใน regimen มะเร็ง — แต่จริง ๆ เป็นยา<b>กระตุ้น</b>ภูมิ ไม่ใช่กดภูมิ",
  summary:["Induction: depleting antibody = rabbit ATG (thymoglobulin; ADR cytokine release syndrome ให้ paracetamol, antihistamine, steroid ก่อน; leukopenia, thrombocytopenia), alemtuzumab (anti-CD52); non-depleting = basiliximab (anti-CD25 IL-2 receptor) ไม่ใช้รักษา acute rejection","Maintenance triple therapy = corticosteroid + calcineurin inhibitor (tacrolimus มากกว่า cyclosporine) + antimetabolite (MMF มากกว่า azathioprine)","CNI: tacrolimus จับ FKBP12, cyclosporine จับ cyclophilin → ยับยั้ง calcineurin → NFAT ไม่เข้า nucleus → IL-2 ลด; nephrotoxic ทั้งคู่; cyclosporine เด่น hirsutism และ gingival hyperplasia; tacrolimus เด่น neurotoxicity และ diabetes","mTOR inhibitor: sirolimus, everolimus (จับ FKBP12 แต่ยับยั้ง mTOR) → แผลหายช้า lymphocele hyperlipidemia proteinuria pneumonitis; belatacept = CTLA4-Ig บล็อก CD80/86–CD28 costimulation ห้ามใช้ใน EBV seronegative เพราะเสี่ยง PTLD","Acute cellular rejection: first line = pulse methylprednisolone ถ้าดื้อ steroid → ATG; antibody-mediated rejection: plasmapheresis, IVIG, rituximab (anti-CD20), bortezomib (proteasome inhibitor), eculizumab (anti-C5 ต้องฉีด meningococcal vaccine อย่างน้อย 2 สัปดาห์ก่อน)","Levamisole = anthelmintic และ immunomodulator ไม่ใช่ยากดภูมิ; เคยใช้กับ 5-FU ใน adjuvant colon cancer stage III ก่อนยุค oxaliplatin","ดูข้อ 23, 24, 31, 73 (transplant)"],
  notes:"ลายมือ: วงคำว่า \"ไม่ใช่\" ในโจทย์; ที่ช้อย e เขียน <b>\"ยาถ่ายพยาธิ\"</b> และแปะ screenshot \"What is the adjuvant treatment of stage III colon cancer? — 5-FU and leucovorin (or <b>levamisole</b>) chemotherapy (if there is nodal metastasis postoperatively)\"<br>สรุปยากดภูมิด้านขวา: \"แล้วใช้ยาอะไรบ้าง? → ปกติจะแบ่งเป็น 2 เฟส คือ induction + maintenance\"; Ex: <b>triple-drug therapy = prednisolone + calcineurin inh. + antimetabolite</b><br><b>1. induction</b> — depleting Ab: <b>thymoglobulin</b> → Ab to T cell, B cell, integrin, adhesion mlc; ADR: cytokine release syndrome → ป้องกันโดยให้ para, diphenhydramine ก่อน; fever, chill, arthralgia, Plt↓, WBC↓ — non-depleting Ab: <b>basiliximab (Simulect)</b> = anti CD25 ของ IL-2 receptor (วาดรูป receptor CD25/CD122/CD132) → block IL-2-induced T cell activation → ↓ risk infection, malig. แต่ไม่ได้ทำ lymphocyte depletion ∴ ไม่ใช้ treat acute rejection<br><b>2. maintenance</b> — corticosteroid: 1st line for acute rejection; azathioprine → mercaptopurine → ↓ purine synthesis (de novo + salvage), ↓ T cell activity, ↓ Ab production, ปัจจุบันใช้ MMF แทนมากขึ้น; mycophenolate mofetil → inhibit IMPDH → ↓ de novo purine syn, ADR diarrhea, nausea, dyspepsia, bloating; sirolimus → จับ FKBP → mTOR; cyclosporine → จับ cyclophilin → calcineurin, ADR nephrotoxic, hyperK, hypoMg, hirsutism, gingival hyperplasia; tacrolimus → จับ FKBP; belatacept → แย่ง CD28 จับ CD80, CD86 → ★ PTLD ถ้า EBV negative<br>มุมขวา: พวกนี้ใช้ solid organ ถ้าพบ humoral (antibody-mediated) rejection: rituximab → anti-CD20; bortezomib → proteasome inh. (ใช้ใน multiple myeloma); eculizumab → C5 → ต้องฉีด meningococcal vax ≥2 wk ก่อน start ยา",
  mnemonic:"<b>Levamisole = Leave the immune system ON</b> (กระตุ้น ไม่ใช่กด) และเป็นยาถ่ายพยาธิ",
  guide:"KDIGO Clinical Practice Guideline for the Care of Kidney Transplant Recipients (2009); Sabiston 21st ed. (2022) — Transplantation immunobiology and immunosuppression",
  opinion:"",
  variants:["ผู้ป่วยหลังปลูกถ่ายไตได้ cyclosporine มีเหงือกโตและขนดก → ADR ของ cyclosporine; ถ้าเปลี่ยนเป็นยาตัวใด → tacrolimus","ถามกลไก MMF → inhibit IMPDH ลด de novo purine synthesis","ยาที่ห้ามใช้ใน EBV-seronegative recipient เพราะเสี่ยง PTLD → belatacept"]}),

A({page:2, page2:2, orig:"5", kimg:KI("5"),
  stem:"A patient presents with upper GI bleeding and epigastric pain that occurs at night. What is the most likely diagnosis?",
  gray:"5. Upper GI bleed with epigastric pain at night time — a. Dieulafoy b. Adenocarcinoma c. Duodenal ulcer with bleeding",
  opts:["Dieulafoy lesion","Adenocarcinoma","Bleeding duodenal ulcer","Mallory-Weiss tear","Esophageal varices"],
  ans:2, key:"C Duodenal ulcer with bleeding"+KS,
  interp:"UGIB + ปวดใต้ลิ้นปี่<b>ตอนกลางคืน</b> → นึกถึง peptic ulcer ชนิด duodenal ulcer",
  why:"Duodenal ulcer ปวดเมื่อท้องว่าง <b>2–3 ชม. หลังอาหารและตอนกลางคืน</b> (ปวดจนตื่นราวเที่ยงคืนถึงตีสอง ช่วงที่ acid หลั่งสูงตาม circadian และไม่มีอาหาร buffer) ดีขึ้นเมื่อกินอาหารหรือยาลดกรด; PUD เป็นสาเหตุที่พบบ่อยที่สุดของ UGIB; posterior duodenal bulb ulcer กัดกร่อน <b>gastroduodenal artery</b> ทำให้เลือดออกมาก",
  wrong:["Dieulafoy lesion = submucosal artery ขนาดใหญ่ผิดปกติ (aberrant vessel) ทะลุ mucosa ที่มีรอยแผลเล็กมาก มักอยู่ lesser curvature ภายใน 6 cm จาก GEJ — เลือดออกมากเป็นพัก ๆ แบบ<b>ไม่ปวด</b>; จะถูกถ้าโจทย์ให้ massive painless recurrent UGIB และ EGD เห็นหลอดเลือดพุ่งจาก mucosa ที่ไม่มี ulcer",
    "Adenocarcinoma (gastric) มักอายุมาก น้ำหนักลด อิ่มเร็ว ซีดเรื้อรัง occult bleeding ปวดไม่สัมพันธ์กับช่วงกลางคืน; จะถูกถ้ามี alarm features: อายุ ≥60, weight loss, palpable mass, Virchow node",
    "Mallory-Weiss tear มีประวัติอาเจียนหรือขย้อนหลายครั้ง (เช่นหลังดื่มสุรา) ก่อนอาเจียนเป็นเลือด ส่วนใหญ่หยุดเอง; จะถูกถ้าโจทย์ให้ retching นำมาก่อน hematemesis",
    "Esophageal varices มี portal hypertension หรือ cirrhosis (jaundice, ascites, spider nevi, splenomegaly) เลือดออกมากแบบไม่ปวด; จะถูกถ้าโจทย์ให้ stigmata ของโรคตับเรื้อรัง"],
  trap:"Dieulafoy และ varices เลือดออกได้มากแต่<b>ไม่ปวด</b> — อาการปวดตอนกลางคืนเป็นตัวชี้ไปทาง DU; GU ปวดเมื่อกินอาหาร",
  summary:["DU: ปวดเมื่อท้องว่าง 2–3 ชม. หลังอาหารและตอนกลางคืน กินแล้วดีขึ้น; GU: ปวดหลังกินอาหาร น้ำหนักลด ต้อง biopsy ทุกครั้งเพื่อแยกมะเร็ง","สาเหตุหลักของ PUD: H. pylori และ NSAIDs; สาเหตุ UGIB ที่พบบ่อยที่สุด = PUD","ตำแหน่งเลือดออก: posterior duodenal bulb → gastroduodenal artery; lesser curvature gastric ulcer → left gastric artery","การดูแล UGIB: resuscitation, restrictive transfusion (Hb เป้าหมาย 7 g/dL หรือ 8 ถ้ามีโรคหัวใจ), Glasgow-Blatchford score (≤1 จัดเป็น very low risk), IV PPI, EGD ภายใน 24 ชม. หลัง resuscitation","Forrest classification: Ia spurting, Ib oozing, IIa visible vessel, IIb adherent clot → endoscopic therapy (ใช้ 2 วิธีร่วม หรือ thermal/clip) แล้วให้ high-dose PPI 72 ชม.; IIc flat spot, III clean base → PPI กินและให้กลับบ้านเร็ว","ถ้า endoscopic hemostasis ล้มเหลว → transcatheter arterial embolization หรือผ่าตัด (DU: duodenotomy + ligation GDA แบบ 3-point)","ดูข้อ 11, 71 (UGIB)"],
  notes:"ลายมือ: ที่ช้อย a เขียน <b>\"Dieulafoy → aberrant vss.\"</b>; วง c และเขียน <b>\"มั่วเดา เพราะน่าจะเจ็บกลางคืน\"</b> (ใต้ข้อเป็นสไลด์ Acute cholangitis ของข้อ 6)",
  mnemonic:"<b>Duodenal = Decreased with food</b> (กินแล้วดีขึ้น ปวดตอนท้องว่างและกลางคืน); Gastric = Greater with meals",
  guide:"ACG Clinical Guideline: Upper Gastrointestinal and Ulcer Bleeding (Laine et al., 2021); ESGE Guideline: Endoscopic diagnosis and management of nonvariceal UGI hemorrhage (2021)",
  opinion:"เห็นด้วยกับคีย์ C — รุ่นพี่เขียนว่าเดา แต่ใช้เหตุผลถูก (nocturnal pain เป็นลักษณะของ DU)",
  variants:["ชายอายุ 40 กิน NSAID ปวดใต้ลิ้นปี่ตอนกลางคืน ถ่ายดำ EGD พบ ulcer posterior duodenal bulb มี visible vessel → หลอดเลือดที่เกี่ยวข้อง → gastroduodenal artery; จัด Forrest IIa","massive painless hematemesis ซ้ำ ๆ EGD เห็นหลอดเลือดพุ่งที่ proximal lesser curvature ไม่มี ulcer → Dieulafoy lesion","ผู้ป่วยอาเจียนหลายครั้งหลังดื่มสุราแล้วอาเจียนเป็นเลือดสด → Mallory-Weiss tear"]}),

A({page:2, page2:2, orig:"6", kimg:KI("6"),
  stem:"What is the most common pathogen causing acute cholangitis?",
  gray:"6. Pathogen of acute cholangitis — a. Escharichia Coli",
  opts:["Escherichia coli","Klebsiella pneumoniae","Enterococcus faecalis","Bacteroides fragilis","Pseudomonas aeruginosa"],
  ans:0, key:"A Escherichia coli"+KS,
  interp:"ถามเชื้อก่อโรคที่พบบ่อยที่สุดใน acute cholangitis (ต้นฉบับมีช้อยเดียว — แต่งตัวลวงเป็นเชื้ออื่นที่พบในท่อน้ำดี)",
  why:"Cholangitis = <b>biliary obstruction + bacterial overgrowth</b>; ถ้ามีนิ่ว พบ bactibilia ได้ถึง ~90%; เชื้อส่วนใหญ่มาจากลำไส้ขึ้นมาทาง ampulla (ascending) — <b>E. coli พบบ่อยที่สุด</b> (TG18 ราว 30–45% ของ bile culture) รองลงมาคือ Klebsiella, Enterobacter, Enterococcus",
  wrong:["Klebsiella pneumoniae เป็น gram-negative enteric ที่พบบ่อยอันดับสอง (และเด่นใน pyogenic liver abscess ในเอเชีย) — ไม่ใช่อันดับหนึ่ง; จะถูกถ้าถามเชื้อที่พบบ่อยที่สุดของ pyogenic liver abscess ในเอเชีย",
    "Enterococcus faecalis เป็น gram-positive ที่พบมากขึ้นใน healthcare-associated cholangitis หลัง ERCP, มี stent หรือ biliary-enteric anastomosis และไม่ครอบคลุมด้วย cephalosporin — จะถูกถ้าถามเชื้อที่ต้องเพิ่ม vancomycin หรือ ampicillin ในผู้ป่วยที่มี stent",
    "Bacteroides fragilis เป็น anaerobe พบในผู้สูงอายุ ผู้มี biliary-enteric anastomosis — ไม่ใช่เชื้อหลัก; จะถูกถ้าถามเชื้อที่ต้องเพิ่ม metronidazole ในผู้ป่วยหลัง hepaticojejunostomy",
    "Pseudomonas aeruginosa พบใน healthcare-associated infection มี stent หรือเคยได้ antibiotics มาก่อน — ไม่ใช่เชื้อหลักใน community-acquired; จะถูกถ้าถามเชื้อที่ต้องครอบคลุมใน cholangitis ที่ติดเชื้อในโรงพยาบาล"],
  trap:"Klebsiella เด่นในบริบทเอเชีย (liver abscess) จึงชวนตอบ — แต่ใน cholangitis อันดับหนึ่งยังเป็น E. coli",
  summary:["Acute cholangitis = obstruction (นิ่ว CBD มากที่สุด, stricture, malignancy, stent อุด) + bacterial infection","Charcot triad: fever, RUQ pain, jaundice; Reynolds pentad เพิ่ม shock และ altered mental status","TG18 diagnosis: A systemic inflammation (fever, lab อักเสบ) + B cholestasis (jaundice, LFT ผิดปกติ) + C imaging (biliary dilatation หรือเห็นสาเหตุ)","TG18 severity: Grade III = organ dysfunction; Grade II = 2 ข้อขึ้นไปจาก WBC &gt;12,000 หรือ &lt;4,000, fever ≥39°C, age ≥75, T-bil ≥5 mg/dL, hypoalbuminemia; Grade I = ไม่เข้าเกณฑ์ข้างต้น","เชื้อ: E. coli &gt; Klebsiella &gt; Enterobacter, Enterococcus; anaerobes ในผู้สูงอายุหรือมี biliary-enteric anastomosis; Pseudomonas และ Enterococcus ใน healthcare-associated","รักษา: antibiotics + biliary drainage (ERCP เป็นวิธีแรก; PTBD ถ้า ERCP ไม่ได้); Grade II early drainage, Grade III urgent drainage หลัง resuscitation; ให้ antibiotics 4–7 วันหลัง source control","ดูข้อ 13, 28, 30, 43, 58 (biliary/pancreas)"],
  notes:"วงช้อย a; แปะสไลด์ <b>Acute Cholangitis</b>: \"Any obstructing phenomenon, from biliary stones to neoplasms, can cause ascending bacterial infection of biliary tree, resulting in cholangitis. As cholecystitis, cholangitis requires obstruction and bacterial overgrowth. With obstruction from a stone, bactibilia can be identified in up to 90% of patients. The most common pathogens include <i>Klebsiella, E. coli, Enterobacter, Pseudomonas</i>, and <i>Citrobacter</i> spp.\" (ด้านขวาเป็นภาพ sestamibi scan ของข้อ 7)",
  mnemonic:"",
  guide:"Tokyo Guidelines 2018 (TG18): diagnostic criteria and severity grading of acute cholangitis (Kiriyama et al.) และ antimicrobial therapy (Gomi et al.)",
  opinion:"",
  variants:["ผู้ป่วย cholangitis มี hypotension ต้องให้ norepinephrine → TG18 grade III → urgent biliary drainage หลัง resuscitation","ผู้ป่วยมี biliary stent มาด้วย cholangitis → empirical antibiotics ต้องครอบคลุม Pseudomonas และ Enterococcus","ถามวิธี drainage แรกใน cholangitis จากนิ่ว CBD → ERCP with sphincterotomy หรือ stent"]}),

A({page:2, page2:2, orig:"7", kimg:KI("7"),
  stem:"Which of the following is the parathyroid scan used before parathyroid surgery?",
  gray:"7. Parathyroid scan — a. Sestamibi b. Pet CT c. CT contrast",
  opts:["Tc-99m sestamibi scan","FDG PET/CT","Contrast-enhanced CT","I-131 whole-body scan","Gallium-67 scan"],
  ans:0, key:"A Sestamibi"+KS,
  interp:"ถาม nuclear imaging มาตรฐานที่ใช้หาตำแหน่งต่อม parathyroid ที่ทำงานเกิน",
  why:"<b>Tc-99m sestamibi</b> ถูกจับและค้างใน mitochondria ของ oxyphil cell ซึ่งมีมากใน parathyroid adenoma; ทำแบบ <b>dual-phase</b> — tracer ออกจาก thyroid เร็วแต่ค้างใน parathyroid ที่ทำงานเกินบนภาพ delayed (ราว 2 ชม.); ทำร่วม <b>SPECT/CT</b> เพื่อดูทั้ง function และ anatomy; ใช้ <b>localize</b> หลังวินิจฉัย primary hyperparathyroidism ทางชีวเคมีแล้ว เพื่อวางแผน focused parathyroidectomy",
  wrong:["FDG PET/CT ดู glucose metabolism ใช้ staging มะเร็ง — ไม่ใช่ parathyroid scan มาตรฐาน; tracer PET ที่ใช้กับ parathyroid คือ 18F-fluorocholine; จะถูกถ้าถามการ staging มะเร็งที่ FDG-avid",
    "Contrast-enhanced CT ธรรมดาเห็นแค่ anatomy; ชนิดที่ใช้หา parathyroid คือ 4D-CT (หลาย phase) เมื่อ sestamibi และ US ไม่พบ หรือผ่าตัดซ้ำ; จะถูกถ้าโจทย์ถามภาพที่ใช้เมื่อ sestamibi negative",
    "I-131 whole-body scan ใช้กับ differentiated thyroid cancer หลัง total thyroidectomy (หา remnant หรือ metastasis) — parathyroid ไม่จับ iodine; จะถูกถ้าถาม surveillance ของ papillary หรือ follicular thyroid cancer",
    "Gallium-67 scan ดู inflammation, infection หรือ lymphoma (ปัจจุบันใช้น้อย) — ไม่จับ parathyroid; จะถูกถ้าถาม imaging ของ fever of unknown origin ในยุคเก่า"],
  trap:"imaging ไม่ใช่การวินิจฉัย hyperparathyroidism — วินิจฉัยด้วย Ca และ PTH; sestamibi ใช้หาตำแหน่งเท่านั้น และไวต่ำใน multigland disease",
  summary:["Primary hyperparathyroidism: Ca สูง + PTH สูงหรือไม่ถูกกด; สาเหตุ single adenoma ~80–85%, multigland hyperplasia ~10–15%, carcinoma &lt;1%","Localization ก่อนผ่าตัด: neck ultrasound + Tc-99m sestamibi (SPECT/CT) เป็น first line; ถ้าไม่พบหรือไม่ตรงกัน → 4D-CT หรือ 18F-fluorocholine PET/CT","Sestamibi: dual-phase, ค้างใน adenoma ที่มี mitochondria มาก; ข้อจำกัด: multigland disease (เห็นแค่ต่อมเดียวที่ทำงานมากที่สุด → misleading), thyroid nodule ร่วมทำ false positive","ข้อบ่งชี้ผ่าตัดใน asymptomatic PHPT (Fifth International Workshop 2022): อายุ &lt;50, Ca &gt;1 mg/dL เหนือ upper limit, osteoporosis หรือ vertebral fracture, eGFR &lt;60, nephrolithiasis หรือ hypercalciuria; symptomatic ทุกราย","Focused parathyroidectomy ใช้ intraoperative PTH: ลดลง &gt;50% จากค่าสูงสุดใน 10 นาทีหลังตัด (Miami criterion) = สำเร็จ","Hungry bone syndrome หลังผ่าตัด → hypocalcemia, hypophosphatemia, hypomagnesemia","ดูข้อ 8, 18, 20, 40 (thyroid)"],
  notes:"ลายมือ: ข้างหัวข้อเขียน <b>\"SPECT/CT\" เพราะอยากดูจุดที่ function↑ + อยากดูโครงสร้างด้วย</b>; ที่ช้อย a (วง): <b>\"= radio isotope ที่ใช้ดู parathyroid\"</b> และเขียนสีแดงว่า <b>\"คำตอบนี้แหละ\"</b>; pros: เห็นชัด ☺; cons: tracer จับต่อมที่ทำงานมาก ถ้ามีหลายต่อม → เจอแค่ต่อมเดียว → <b>misleading</b> จึงส่งเพื่อการ localize ใน primary HPT (มีต่อมเดียว); แปะภาพ sestamibi scan และ SPECT/CT ด้านขวา",
  mnemonic:"<b>MIBI = Mitochondria-rich adenoma Is Bright on delayed Imaging</b>",
  guide:"AAES Guidelines for Definitive Management of Primary Hyperparathyroidism (Wilhelm et al., JAMA Surg 2016); Fifth International Workshop on asymptomatic primary hyperparathyroidism (2022)",
  opinion:"",
  variants:["ผู้ป่วย Ca 11.8 mg/dL PTH สูง sestamibi ไม่พบตำแหน่ง → ขั้นต่อไป → 4D-CT หรือ fluorocholine PET/CT หรือ bilateral neck exploration","ระหว่าง focused parathyroidectomy วัด intraoperative PTH ลดลงเท่าไรจึงถือว่าสำเร็จ → มากกว่า 50% ใน 10 นาที","ผู้ป่วย MEN1 มี hyperparathyroidism → multigland hyperplasia → subtotal (3½ gland) หรือ total parathyroidectomy + autotransplant"]}),

A({page:2, page2:2, orig:"8", kimg:KI("8"),
  stem:"A patient is diagnosed with papillary thyroid carcinoma with a 4.5-cm tumor. What is the appropriate surgical management?",
  gray:"8. Papillary thyroid carcinoma mx — a. Subtotal thyroidectomy b. Total thyroidectomy c. Lobectomy",
  opts:["Subtotal thyroidectomy","Total thyroidectomy","Lobectomy","Radioactive iodine alone","Active surveillance"],
  ans:1, key:"B Total thyroidectomy"+KS,
  flag:"⚠ เติม \"4.5-cm tumor\" — ต้นฉบับไม่บอกขนาด ถ้าก้อน 1–4 cm low-risk ตอบ lobectomy ได้ด้วย",
  interp:"PTC ขนาด &gt;4 cm → ขอบเขตการผ่าตัดตาม ATA",
  why:"ATA 2015 (Recommendation 35): PTC <b>&gt;4 cm</b>, หรือมี gross extrathyroidal extension (cT4), หรือ clinical N1, หรือ M1 → <b>near-total หรือ total thyroidectomy</b> + ตัดก้อนที่เห็นทั้งหมด; total thyroidectomy ยังทำให้ให้ RAI และติดตามด้วย thyroglobulin ได้",
  wrong:["Subtotal thyroidectomy เหลือเนื้อต่อมไว้ ไม่ใช่การผ่าตัดเชิง oncology ของ thyroid cancer และทำให้ RAI และ Tg surveillance ไม่ได้ผล — เคยใช้ใน Graves หรือ multinodular goiter สมัยก่อน; ไม่มีสถานการณ์ใดใน PTC ที่เลือก subtotal",
    "Lobectomy เพียงพอสำหรับ PTC <b>&lt;1 cm</b> (micropapillary) ที่ไม่มี ETE และ cN0 และเลือกได้ใน <b>1–4 cm</b> low-risk (ไม่มี ETE, cN0, ไม่มีประวัติฉายรังสีที่คอ หรือประวัติครอบครัว) — ก้อน 4.5 cm เกินเกณฑ์; จะถูกถ้าโจทย์ให้ PTC 0.8 cm หรือ 2 cm ไม่มี LN",
    "Radioactive iodine เป็น adjuvant <b>หลัง</b> total thyroidectomy ใน intermediate–high risk — ให้เดี่ยว ๆ ไม่ได้เพราะเนื้อ thyroid ปกติแย่งจับ iodine และไม่ได้ตัดก้อน; จะถูกถ้าถามการรักษาเสริมหลังผ่าตัดในผู้มี gross ETE หรือ distant metastasis",
    "Active surveillance เป็นทางเลือกใน <b>very low-risk papillary microcarcinoma &lt;1 cm</b> ไม่มี ETE ไม่ชิด trachea หรือ recurrent laryngeal nerve ไม่มี LN — ก้อน 4.5 cm ไม่เข้าเกณฑ์; จะถูกถ้าโจทย์ให้ microcarcinoma 0.6 cm อยู่กลางกลีบในผู้สูงอายุ"],
  trap:"ต้นฉบับไม่บอกขนาด — PTC ไม่ได้ต้อง total ทุกราย; ขนาดและ risk feature เป็นตัวกำหนดว่า lobectomy หรือ total",
  summary:["ATA 2015 extent of surgery: &lt;1 cm, no ETE, cN0 → lobectomy (หรือ active surveillance ใน very low risk); 1–4 cm, no ETE, cN0 → lobectomy หรือ total ก็ได้; &gt;4 cm หรือ gross ETE หรือ cN1 หรือ M1 → total thyroidectomy","Central neck dissection: therapeutic เมื่อ clinically involved central nodes; prophylactic พิจารณาใน T3–T4 หรือ cN1b; lateral neck dissection เมื่อ lateral node พิสูจน์ด้วย FNA","Bethesda ของ FNA thyroid nodule: I non-diagnostic → repeat FNA; II benign → follow up; III AUS → repeat FNA หรือ molecular หรือ lobectomy; IV follicular neoplasm → lobectomy หรือ molecular; V suspicious → lobectomy หรือ total; VI malignant → surgery ตามขนาด","Benign nodule ที่โตต่อเนื่อง, cyst สะสมซ้ำ หรือมีอาการกด → lobectomy","หลังผ่าตัด: ประเมิน ATA risk of recurrence (low, intermediate, high) → RAI สำหรับ high risk และเลือกได้ใน intermediate; TSH suppression ตาม risk; ติดตามด้วย Tg, anti-Tg และ neck US","ภาวะแทรกซ้อน total thyroidectomy: hypoparathyroidism (hypocalcemia), recurrent laryngeal nerve injury, neck hematoma ที่อาจกดทางเดินหายใจ","ดูข้อ 18, 20, 40 (thyroid)"],
  notes:"วงช้อย b; ใต้ช้อย c (Lobectomy) เขียนสีแดง <b>\"lobectomy ถ้าเป็น micropapillary\"</b>; แปะ <b>flowchart thyroid nodule</b>: History/PE, serum TSH, thyroid sonography → FNA → Non-diagnostic: repeat FNA; Benign (cyst/colloid): follow up — cyst re-accumulate ×3, continued growth, compressive symptoms → ± repeat FNA → lobectomy; AUS/FLUS: repeat FNA, lobectomy*; FN/SFN: lobectomy, TT*; Suspicious for malignancy: lobectomy & frozen section, TT*; Malignancy: TT",
  mnemonic:"<b>1–4 rule</b>: &lt;1 cm = lobe (หรือเฝ้าดู), 1–4 cm = เลือกได้, &gt;4 cm = Total",
  guide:"2015 ATA Management Guidelines for Adult Patients with Thyroid Nodules and Differentiated Thyroid Cancer (Haugen et al., Thyroid 2016); The Bethesda System for Reporting Thyroid Cytopathology 3rd ed. (2023)",
  opinion:"เห็นด้วยกับคีย์ B เมื่อเติมขนาด 4.5 cm — ต้นฉบับไม่ให้ขนาด ถ้าเป็นก้อน 1–4 cm low risk ทั้ง total และ lobectomy ถูกตาม ATA 2015 และถ้า &lt;1 cm คำตอบคือ lobectomy (ตรงกับที่รุ่นพี่เขียนไว้)",
  variants:["PTC 0.8 cm ไม่มี ETE ไม่มี LN → lobectomy หรือ active surveillance","PTC 2 cm มี lateral neck node ยืนยันด้วย FNA → total thyroidectomy + lateral neck dissection","FNA Bethesda IV ก้อน 3 cm → diagnostic lobectomy"]}),

A({page:2, page2:2, orig:"9", kimg:KI("9"),
  stem:"An ulcer located at the proximal third of the lesser curvature of the stomach erodes into a blood vessel. Which vessel is most likely involved?",
  gray:"9. Ulcer at ⅓ of lesser curvature of stomach โดนเส้นเลือดอะไร — a. right gastric artery b. left gastric artery c. right gastroepiploic artery d. left gastroepiploic artery e. short gastric artery",
  opts:["Right gastric artery","Left gastric artery","Right gastroepiploic artery","Left gastroepiploic artery","Short gastric artery"],
  ans:1, key:NK,
  flag:"⚠ ต้นฉบับเขียนแค่ \"⅓ of lesser curvature\" ไม่ระบุว่า proximal หรือ distal — เติม \"proximal third\" (รุ่นพี่ก็ไม่ได้วง เพราะไม่รู้ว่าฝั่งไหน)",
  interp:"ถามกายวิภาคหลอดเลือดกระเพาะ: lesser curvature เลี้ยงด้วย left และ right gastric artery — ส่วนบน (proximal) = left gastric",
  why:"<b>Left gastric artery</b> (แขนงของ celiac trunk) วิ่งขึ้นไปที่ cardia ให้ esophageal branch แล้ววกลงตาม <b>lesser curvature ส่วนบน</b>; right gastric artery (จาก proper/common hepatic) เลี้ยง lesser curvature ส่วนล่างใกล้ pylorus แล้วต่อกัน → ulcer ที่ proximal third ของ lesser curvature จึงกัดกร่อน left gastric artery",
  wrong:["Right gastric artery เลี้ยง <b>distal</b> lesser curvature ใกล้ pylorus — จะถูกถ้าโจทย์ระบุว่า ulcer อยู่ distal third หรือ prepyloric ด้าน lesser curve",
    "Right gastroepiploic artery (จาก gastroduodenal artery) วิ่งตาม <b>greater curvature</b> ส่วนล่าง — จะถูกถ้า ulcer อยู่ distal greater curvature",
    "Left gastroepiploic artery (จาก splenic artery) วิ่งตาม greater curvature ส่วนบน — จะถูกถ้า ulcer อยู่ proximal greater curvature",
    "Short gastric arteries (จาก splenic artery) เลี้ยง fundus ด้าน greater curvature — จะถูกถ้า ulcer อยู่ fundus; เป็นหลอดเลือดที่ถูกตัดใน Nissen fundoplication หรือ splenectomy"],
  trap:"สลับซ้าย–ขวา: <b>left = บน (proximal)</b>, right = ล่าง (distal) ทั้งบน lesser และ greater curvature; posterior duodenal ulcer → gastroduodenal artery ไม่ใช่ gastric artery",
  summary:["Lesser curvature: left gastric a. (celiac trunk) ส่วนบน + right gastric a. (proper หรือ common hepatic) ส่วนล่าง ต่อกันเป็น arcade","Greater curvature: left gastroepiploic a. (splenic) ส่วนบน + right gastroepiploic a. (gastroduodenal) ส่วนล่าง; fundus = short gastric a. (splenic)","Left gastric vein (coronary vein) เป็น portosystemic collateral ไปสู่ esophageal varices","Modified Johnson classification of gastric ulcer: I lesser curvature ที่ incisura (พบบ่อยที่สุด กรดปกติหรือต่ำ); II gastric + duodenal ulcer; III prepyloric; IV high lesser curvature ใกล้ GEJ; V NSAID ที่ใดก็ได้ — type II และ III กรดสูงคล้าย DU","Bleeding gastric ulcer ที่ endoscopic hemostasis ไม่สำเร็จ → angioembolization หรือผ่าตัด (excise ulcer หรือ oversew + biopsy เพื่อแยกมะเร็ง)","Posterior duodenal bulb ulcer → gastroduodenal artery (เลือดออกมาก); anterior DU → perforation","ดูข้อ 5, 11, 59 (กระเพาะ, UGIB, left gastric vein)"],
  notes:"<b>ไฟล์เฉลยไม่ได้วงคำตอบ</b> — รุ่นพี่วงคำว่า \"⅓\" และเขียนว่า <b>\"ไม่รู้ว่าฝั่งไหน T-T\"</b>; ที่ช้อย a เขียน <b>\"right gastric artery – ล่าง\"</b>, ช้อย b <b>\"left gastric artery – บน\"</b>; วาดรูปกระเพาะพร้อมหลอดเลือด: Lt. และ Rt. gastric a. ตาม lesser curvature, Lt. และ Rt. gastroepiploic a. ตาม greater curvature, short gastric a. ที่ fundus",
  mnemonic:"<b>Left is Lofty</b> — left gastric และ left gastroepiploic อยู่ส่วนบนของกระเพาะ",
  guide:"Gray's Anatomy 42nd ed. (2020); Sabiston 21st ed. (2022) — Stomach",
  opinion:"ไม่มีคีย์ในไฟล์ — ตอบ left gastric artery เมื่อระบุ proximal third; ถ้าต้นฉบับจริงหมายถึง distal third คำตอบจะเป็น right gastric artery (ความมั่นใจในกายวิภาคสูง แต่ความกำกวมของต้นฉบับทำให้ต้องเติมข้อมูล)",
  variants:["ulcer ที่ distal third ของ lesser curvature ใกล้ pylorus → right gastric artery","posterior duodenal bulb ulcer เลือดออกมาก → gastroduodenal artery","esophageal varices ได้เลือดจากหลอดเลือดดำใด → left gastric (coronary) vein"]}),

A({page:2, page2:2, orig:"9 (ข้อที่สอง)", kimg:KI("10"),
  stem:"During laparoscopic cholecystectomy in a patient with pre-existing intra-abdominal adhesions, there is massive bleeding. The vital signs change and the blood pressure drops. What should be done to stop the bleeding?",
  gray:"9. ทำ laparoscopic LC เเล้วเลือดออกเยอะ vital sign เปลี่ยน BP drop, คนไข้มี adhesion ในท้องอยู่เดิม ต้องทำยังไงเพื่อหยุดเลือด — A. Convert to open surgery to stop bleed B. ส่องกล้องต่อไปใช้ clip หนีบที่เลือดออกไว้",
  opts:["Convert to open surgery to control bleeding","Continue laparoscopically and clip the bleeding vessel","Insert an additional port and continue laparoscopically","Increase pneumoperitoneum pressure to tamponade bleeding","Abort the operation and transfer to ICU for resuscitation"],
  ans:0, key:"A Convert to open surgery to stop bleed"+KS,
  interp:"เลือดออกมากระหว่าง LC จน<b>hemodynamic unstable</b> ใน field ที่มี adhesion — ต้องเลือกวิธีควบคุมเลือดที่ปลอดภัยที่สุด",
  why:"<b>Uncontrolled bleeding</b> เป็นข้อบ่งชี้ของ conversion to open; เมื่อ BP ตก ให้กดห้ามเลือดชั่วคราวด้วย grasper หรือ gauze แจ้ง anesthesiologist resuscitate และเตรียมเลือด แล้ว<b>เปิดหน้าท้อง</b>เพื่อควบคุมจุดเลือดออกด้วยตาเปล่าและมือ (Pringle maneuver ถ้าเลือดมาจาก hepatic artery หรือ liver bed) — การ clip หรือจี้แบบมองไม่เห็นชัดใน field ที่เต็มไปด้วยเลือดและ adhesion เสี่ยงทำ bile duct หรือ hepatic artery injury",
  wrong:["Clip แบบไม่เห็นชัดระหว่างเลือดออกมากเสี่ยง clip โดน CBD หรือ right hepatic artery; จะถูกถ้าเลือดออกน้อย เห็นจุดชัด (เช่น cystic artery หลุด clip) และผู้ป่วย stable",
    "เพิ่ม port ช่วย retract หรือ suction ได้ในเลือดออกเล็กน้อยที่ stable แต่ไม่พอเมื่อ BP ตก และการเสียเวลาทำให้ shock ลึกขึ้น; จะถูกถ้าโจทย์บอกว่าเลือดออกจาก liver bed เล็กน้อยและ vital signs ปกติ",
    "เพิ่ม pneumoperitoneum pressure ลด venous return ทำให้ hypotension แย่ลง เพิ่มเสี่ยง CO2 embolism ผ่าน venous injury และไม่หยุดเลือดแดง; ไม่มีสถานการณ์ที่เหมาะ (การลด pressure ชั่วคราวช่วยเห็น venous bleeding ได้)",
    "หยุดผ่าตัดแล้วย้าย ICU ทั้งที่ยังมีเลือดออกต่อ = ไม่ได้ควบคุม source → เสียชีวิต; damage control ต้องหยุดเลือดก่อน (packing) จึงจะย้าย ICU; จะถูกถ้าห้ามเลือดได้แล้วแต่ผู้ป่วยมี lethal triad และต้อง pack แล้วกลับมาผ่าซ้ำ"],
  trap:"การ convert <b>ไม่ใช่ความล้มเหลว</b> แต่เป็นการตัดสินใจที่ปลอดภัย; อย่าพยายามจบทางกล้องเมื่อผู้ป่วย unstable",
  summary:["ข้อบ่งชี้ convert LC เป็น open: extensive inflammation, dense adhesions, anatomy ไม่ชัด, bile duct injury, retained CBD stones ที่จัดการทางกล้องไม่ได้, uncontrolled bleeding","Absolute contraindications ของ LC: ศัลยแพทย์ทำไม่ได้, ผู้ป่วยทน general anesthesia ไม่ได้, uncontrollable coagulopathy, generalized peritonitis (บางตำรา), suspected gallbladder cancer (บางตำรา)","Safe cholecystectomy: Critical View of Safety (เห็น 2 structures เข้า GB, hepatocystic triangle เคลียร์, แยก lower GB ออกจาก liver bed หนึ่งในสาม) ก่อน clip; ถ้าทำไม่ได้ → bail-out: subtotal cholecystectomy, cholecystostomy หรือ convert","ห้ามเลือดระหว่าง LC: กดด้วย grasper หรือ gauze, suction, แจ้งทีมดมยา; venous ooze ลดลงเมื่อยกหัวสูงและกด; arterial bleeding ที่ไม่เห็นชัด → convert","Pneumoperitoneum 12–15 mmHg ลด venous return และเพิ่ม SVR; ใน shock ให้ desufflate ไม่ใช่เพิ่มความดัน","Conversion rate ของ LC ราว 5–10% สูงขึ้นในชาย อายุมาก acute cholecystitis และเคยผ่าตัดช่องท้องมาก่อน","ดูข้อ 6, 15, 43 (biliary, laparoscopy)"],
  notes:"ข้อนี้เป็น <b>ข้อเลข 9 ตัวที่สอง</b> ในไฟล์ (ต้นฉบับใช้เลข 9 ซ้ำ); ลายมือ: วงช้อย A เขียน <b>\"สมเหตุสมผลที่สุด ☺\"</b> และไฮไลต์ \"open surgery to stop bleed\"; แปะ screenshot <b>StatPearls (Open Cholecystectomy)</b>: \"What are the reasons for conversion from laparoscopic to open surgery? — <b>Extensive inflammation, adhesions, anatomical variances, bile duct injury, retained bile duct stones, and uncontrolled bleeding</b> are all indications to convert to an open procedure.\"; แปะสไลด์ <b>ABSOLUTE CONTRAINDICATIONS FOR LAPAROSCOPIC CHOLECYSTECTOMY</b> — Surgeon: inability to perform lap cholecystectomy; Patient: poor candidate for general anesthesia, uncontrollable coagulopathy, generalized peritonitis, suspected gallbladder cancer (มีลายมือเล็ก ๆ กำกับข้างข้อ poor candidate for GA อ่านไม่ชัด)",
  mnemonic:"",
  guide:"Safe Cholecystectomy Multi-society Practice Guideline on Prevention of Bile Duct Injury (Brunt et al., SAGES 2020); StatPearls: Open Cholecystectomy",
  opinion:"",
  variants:["ระหว่าง LC เห็นน้ำดีรั่วจาก CBD ที่ถูกตัดขาด ศัลยแพทย์ไม่ชำนาญ reconstruction → ใส่ drain แล้วส่งต่อ hepatobiliary surgeon (หรือ convert เพื่อประเมิน)","LC ใน severe acute cholecystitis ไม่สามารถทำ critical view of safety ได้ → bail-out: subtotal cholecystectomy","ระหว่าง laparoscopy BP ตกกะทันหัน ETCO2 ตก มี mill-wheel murmur → CO2 embolism → desufflate, left lateral decubitus, head down"]}),

A({page:3, page2:3, orig:"10", kimg:KI("11"),
  stem:"A 60-year-old woman has had GERD symptoms for 3 years, treated medically. This time, she presents with anemic symptoms and epigastric pain. Per rectal examination shows a large amount of melena. What is the provisional diagnosis?",
  gray:"10. 60yr woman, History of GERD symptoms for 3 years treat medically, รอบนี้ presented with anemic symptoms, epigastric pain PR: melena เยอะมาก, provisional dx — a. Gastric CA c/ bleeding b. Bleeding Duodenal ulcer",
  opts:["Gastric cancer with bleeding","Bleeding duodenal ulcer","Esophageal varices","Erosive esophagitis","Mallory-Weiss tear"],
  ans:0, key:"A Gastric CA c/ bleeding"+KS,
  flag:"⚠ ต้นฉบับข้อมูลน้อย — bleeding duodenal ulcer ก็เป็นไปได้; ตอบตามคีย์โดยอาศัย alarm features",
  interp:"ผู้หญิงอายุ 60 มีอาการ dyspepsia เรื้อรัง <b>รักษาด้วยยามานานแต่ไม่หาย</b> ครั้งนี้มี anemia + UGIB → มี alarm features หลายข้อ",
  why:"Alarm features in dyspepsia ที่ผู้ป่วยมี: <b>อายุ ≥60</b>, <b>anemia</b>, <b>GI bleeding</b>, และ <b>unsatisfactory response to empiric therapy</b> (กินยามา 3 ปีไม่หาย) — ทั้งหมดชี้ว่าต้องคิดถึง <b>gastric cancer</b> และต้อง EGD + biopsy; อาการ \"GERD\" ที่เรื้อรังไม่ตอบสนองต่อยาอาจเป็น dyspepsia จากมะเร็งที่ถูกบดบังด้วย PPI",
  wrong:["Bleeding duodenal ulcer เป็นสาเหตุ UGIB ที่พบบ่อยที่สุดในภาพรวม และตอบได้ในโจทย์ต้นฉบับนี้ แต่ไม่อธิบาย dyspepsia เรื้อรังที่ดื้อต่อยาในคนอายุ 60; จะถูกถ้าโจทย์ให้คนอายุน้อย ปวดสัมพันธ์มื้ออาหารหรือตอนกลางคืน กิน NSAID และไม่มี alarm feature อื่น",
    "Esophageal varices ต้องมี portal hypertension หรือ cirrhosis (jaundice, ascites, splenomegaly) และมักเป็น hematemesis ปริมาณมาก ไม่ปวด — โจทย์ไม่มี; จะถูกถ้าโจทย์ให้ stigmata ของโรคตับเรื้อรัง",
    "Erosive esophagitis สัมพันธ์กับ GERD แต่เลือดออกมักน้อย occult หรือ hematemesis เล็กน้อย ไม่ค่อยทำ melena ปริมาณมาก; จะถูกถ้าโจทย์ให้ heartburn ไม่ได้กินยา ซีดเล็กน้อยจาก chronic occult blood loss",
    "Mallory-Weiss tear ต้องมีประวัติอาเจียนหรือขย้อนรุนแรงนำมาก่อน hematemesis — โจทย์ไม่มี; จะถูกถ้าโจทย์ให้อาเจียนหลายครั้งหลังดื่มสุรา"],
  trap:"เห็น UGIB แล้วตอบ PUD อัตโนมัติ — ต้องสังเกต <b>อายุ + อาการเรื้อรังดื้อยา + ซีด</b> ซึ่งเป็น alarm features ของมะเร็ง",
  summary:["Alarm features in dyspepsia: อายุ ≥60, unintended weight loss, dysphagia หรือ odynophagia, anemia, GI bleeding, palpable mass หรือ lymphadenopathy, อาการใหม่ที่แย่ลงเรื่อย ๆ, persistent vomiting, family history of upper GI cancer, unsatisfactory response to empiric therapy","ACG/CAG 2017: dyspepsia อายุ ≥60 → EGD; อายุ &lt;60 → test-and-treat H. pylori ก่อน แล้วค่อยพิจารณา PPI","GERD หรือ dyspepsia ที่รักษาด้วยยา 4–8 สัปดาห์แล้วไม่ดีขึ้น → ควร EGD","Gastric cancer: H. pylori เป็น risk factor หลัก; อาการ weight loss, early satiety, epigastric pain, anemia, UGIB; ตรวจร่างกาย Virchow node, Sister Mary Joseph nodule, Blumer shelf, Krukenberg tumor","Bleeding DU vs gastric CA: DU ปวดท้องว่างและกลางคืน กินแล้วดีขึ้น สัมพันธ์ NSAID และ H. pylori; gastric CA อายุมาก อาการเรื้อรัง น้ำหนักลด ดื้อต่อยา","Gastric ulcer ทุกรายต้อง biopsy ขอบแผลและ EGD ซ้ำจนหายเพื่อแยกมะเร็ง","ดูข้อ 5, 71 (UGIB)"],
  notes:"ลายมือ: ขีดเส้นใต้ \"3 years treat medically\" แล้วเขียน <b>\"จริง ๆ ก็ควรสงสัยตั้งแต่ treat ทาง med อยู่ 2–4 wk แล้วไม่ดีขึ้นแล้วอะนะ\"</b>; วงช้อย a; แปะตาราง <b>\"สัญญาณเตือน\" — TABLE 3 Alarm features in dyspepsia</b>: age &gt;60 years, unintended weight loss, dysphagia or odynophagia, anemia, gastrointestinal bleeding, palpable mass or lymphadenopathy, symptoms that have a recent onset and progressive nature, persistent vomiting, family history of upper gastrointestinal cancer, unsatisfactory response to empiric therapy or no prior investigation",
  mnemonic:"",
  guide:"ACG and CAG Clinical Guideline: Management of Dyspepsia (Moayyedi et al., 2017); NCCN Gastric Cancer (current version)",
  opinion:"⚠ เห็นด้วยกับคีย์ A ระดับปานกลาง — ต้นฉบับให้ข้อมูลไม่มาก และในความเป็นจริง bleeding DU พบบ่อยกว่า แต่องค์ประกอบ อายุ 60 + อาการเรื้อรังที่ไม่ตอบสนองต่อยา 3 ปี + anemia + GI bleeding เป็น alarm features ครบชุด ซึ่งข้อสอบต้องการให้นึกถึงมะเร็งก่อน; ใช้โจทย์ตามต้นฉบับโดยไม่เติม; ถ้าโจทย์เป็นคนหนุ่ม ปวดสัมพันธ์มื้ออาหารหรือกลางคืน กิน NSAID ไม่มี alarm feature → ตอบ bleeding duodenal ulcer",
  variants:["ชายอายุ 65 อิ่มเร็ว น้ำหนักลด 6 kg ใน 3 เดือน คลำได้ต่อมน้ำเหลือง supraclavicular ซ้าย → gastric cancer; ขั้นต่อไป EGD + biopsy","หญิงอายุ 35 dyspepsia ไม่มี alarm feature → test-and-treat H. pylori","ผู้ป่วย gastric ulcer ที่ lesser curvature biopsy benign → ให้ PPI แล้ว EGD ซ้ำยืนยันว่าหาย"]}),

A({page:3, page2:3, orig:"11", kimg:KI("12"),
  stem:"Which of the following is NOT an indication for bariatric surgery?",
  gray:"11. Not indication for bariatric surgery — a. BMI 36 b. BMI 32 w/ OSA c. Refuse to behavior mod d. Young adult w/ HT",
  opts:["BMI 36 without comorbidity","BMI 32 with obstructive sleep apnea","Refuses to commit to behavior modification","Young adult with hypertension and BMI 40","BMI 42 without comorbidity"],
  ans:2, key:"C Refuse to behavior mod"+KS,
  flag:"⚠ เติม BMI 40 ในช้อย young adult with hypertension (ต้นฉบับไม่บอกว่าอ้วน — รุ่นพี่ก็เขียนว่าควรบอก) และแต่งช้อย E",
  interp:"ถามเกณฑ์ metabolic and bariatric surgery (MBS) ตาม ASMBS/IFSO 2022 และข้อห้าม",
  why:"การผ่าตัด MBS ต้องอาศัยความร่วมมือ<b>ปรับพฤติกรรมตลอดชีวิต</b> (อาหาร ออกกำลังกาย vitamin supplementation นัดติดตาม) — ผู้ที่<b>ปฏิเสธการปรับพฤติกรรม</b>ถือเป็นข้อห้าม (inability or unwillingness to comply) ไม่ใช่ข้อบ่งชี้; ช้อยอื่นเข้าเกณฑ์ ASMBS/IFSO 2022: BMI ≥35 ไม่ว่ามี comorbidity หรือไม่ และ BMI 30–34.9 ที่มี metabolic disease",
  wrong:["BMI 36 ไม่มีโรคร่วม → ASMBS/IFSO 2022 <b>แนะนำ</b> MBS สำหรับ BMI ≥35 โดยไม่ต้องมี comorbidity (เปลี่ยนจาก NIH 1991 ที่ต้อง ≥40 หรือ ≥35 + comorbidity) — จึงเป็นข้อบ่งชี้",
    "BMI 32 กับ OSA → BMI 30–34.9 ที่มี obesity-related หรือ metabolic disease ควร<b>พิจารณา</b> MBS (โดยเฉพาะเมื่อรักษาโดยไม่ผ่าตัดไม่ได้ผล) และในคนเอเชียเกณฑ์ต่ำลง (≥27.5) — จึงเป็นข้อบ่งชี้; จะไม่ใช่ข้อบ่งชี้ถ้า BMI 32 ไม่มีโรคร่วมในคนตะวันตกและยังไม่เคยลองรักษาแบบไม่ผ่าตัด",
    "Young adult ความดันสูง BMI 40 → BMI ≥35 เข้าเกณฑ์อยู่แล้ว และผ่าตัดช่วยลด mortality และภาวะแทรกซ้อนระยะยาว — อายุน้อยไม่ใช่ข้อห้าม; ถ้าไม่มี BMI (ตามต้นฉบับ) จะตัดสินไม่ได้",
    "BMI 42 ไม่มีโรคร่วม → class III obesity เป็นข้อบ่งชี้ชัดเจน"],
  trap:"ยังจำเกณฑ์เก่า NIH 1991 (BMI ≥40 หรือ ≥35 + comorbidity) แล้วคิดว่า BMI 36 ไม่มีโรคร่วมไม่ใช่ข้อบ่งชี้ — เกณฑ์ปัจจุบัน ASMBS/IFSO 2022 ใช้ BMI ≥35 ได้เลย",
  summary:["ASMBS/IFSO 2022: MBS <b>แนะนำ</b>ที่ BMI ≥35 ไม่ว่ามีโรคร่วมหรือไม่; <b>พิจารณา</b>ที่ BMI 30–34.9 ที่มี metabolic disease; ในคนเอเชีย BMI ≥25 ถือว่าอ้วนทางคลินิก และ BMI ≥27.5 ควรได้รับการเสนอ MBS","เด็กและวัยรุ่น: BMI ≥120% ของ 95th percentile ร่วมกับโรคร่วมสำคัญ หรือ ≥140% ของ 95th percentile พิจารณา MBS ได้","BMI WHO: pre-obese 25–29.9, class I 30–34.9, class II 35–39.9, class III ≥40; เกณฑ์เอเชีย: overweight 23–24.9, obese class I 25–29.9, class II ≥30","ข้อห้ามที่พบบ่อย: ไม่สามารถหรือไม่ยินยอมปฏิบัติตามการปรับพฤติกรรมและนัดติดตามตลอดชีวิต, โรคจิตเวชรุนแรงหรือติดสารที่ยังไม่ควบคุม, ความเสี่ยงการดมยาสูงเกินรับได้, กำลังตั้งครรภ์","ผู้ป่วยทุกรายต้องผ่าน multidisciplinary evaluation (nutrition, psychology, medical) ก่อนผ่าตัด","หัตถการหลัก: sleeve gastrectomy (ทำมากที่สุด) และ Roux-en-Y gastric bypass (ดีกว่าใน GERD และ diabetes)","ดูข้อ 15 (การเลือกผู้ป่วยผ่าตัดผ่านกล้อง)"],
  notes:"ลายมือ: เขียนบนสไลด์ว่า <b>\"Ref ใช้ guideline ปี 2022\"</b> แปะสไลด์ <b>2022 ASMBS and IFSO: Indications for Metabolic and Bariatric Surgery</b> (major updates to 1991 NIH guidelines: MBS is recommended for individuals with BMI ≥35 regardless of presence, absence, or severity of co-morbidities; MBS should be considered for individuals with metabolic disease and BMI 30–34.9; BMI thresholds should be adjusted in the Asian population such that a BMI ≥25 suggests clinical obesity, and individuals with BMI ≥27.5 should be offered MBS; long-term results of MBS consistently demonstrate safety and efficacy; appropriately selected children and adolescents should be considered for MBS)<br>ช้อย a: <b>\"→ MBS\"</b>; ช้อย b: <b>\"ถ้า treat ทาง med แล้วไม่ได้ ✓\"</b>; ช้อย c (วง): <b>\"ควรทำแบบ non-Sx ก่อน!\"</b>; ช้อย d: <b>\"↓ mortal & complication\"</b> และ <b>\"จริง ๆ ควรบอกด้วยว่าอ้วน\"</b><br>ตาราง <b>Review BMI (WHO)</b>: pre-obese 25–29.9; obesity class I 30–34.9 → treat อย่างอื่นก่อน แบบ non-Sx ก่อน ถ้าไม่ได้ค่อย MBS; class II 35–39.9 และ class III ≥40 → MBS เลย; <b>ค่าเอเชีย</b>: pre-obese 23–24.9, obesity class I 25–29.9, class II ≥30<br>กล่อง <b>สรุป</b>: MBS ที่ BMI ≥35 (ฝรั่ง), ≥27.5 (เอเชีย) OR ที่ 30–34.9 (ฝรั่ง) ที่ treat med ไม่ได้ OR เด็ก/วัยรุ่นอ้วน",
  mnemonic:"<b>35 ฝรั่ง 27.5 เอเชีย</b> — ต่ำกว่านั้นต้องมี metabolic disease",
  guide:"2022 ASMBS and IFSO: Indications for Metabolic and Bariatric Surgery (Eisenberg et al., Surg Obes Relat Dis 2022)",
  opinion:"เห็นด้วยกับคีย์ C มั่นใจสูง; เติม BMI 40 ในช้อย young adult with hypertension เพราะต้นฉบับไม่บอกระดับความอ้วน ทำให้ตัดสินไม่ได้",
  variants:["ชาวไทย BMI 28 มี type 2 diabetes คุมไม่ได้ด้วยยา → ควรเสนอ MBS ตามเกณฑ์เอเชีย","ผู้ป่วย BMI 45 มี schizophrenia ที่ยังไม่ควบคุมอาการ → ข้อห้ามชั่วคราว ต้องคุมอาการก่อน","ผู้ป่วย GERD รุนแรง BMI 42 → เลือก Roux-en-Y gastric bypass มากกว่า sleeve gastrectomy"]}),

A({page:3, page2:3, orig:"12", kimg:KI("13"),
  stem:"A patient with chronic pancreatitis has abdominal pain that is controlled with oral analgesics. Imaging shows a main pancreatic duct of 3 mm with calcifications. What is the most appropriate management?",
  gray:"12. Pancreas dilate 3 mm and calcification?? — a. Puestow b. Conservative",
  opts:["Puestow procedure","Conservative management","Frey procedure","Whipple procedure","Distal pancreatectomy"],
  ans:1, key:"B Conservative"+KS,
  flag:"⚠ ต้นฉบับมีแค่ \"Pancreas dilate 3 mm and calcification??\" — เติม chronic pancreatitis และปวดคุมได้ด้วยยากิน (รุ่นพี่เดาว่าเป็น chronic pancreatitis)",
  interp:"Chronic calcific pancreatitis ที่ main duct ไม่ขยาย (3 mm) และอาการปวดคุมได้ → ยังไม่มีข้อบ่งชี้ผ่าตัด",
  why:"ข้อบ่งชี้หลักของการผ่าตัดใน chronic pancreatitis คือ <b>intractable pain</b> หรือภาวะแทรกซ้อน (pseudocyst, biliary หรือ duodenal obstruction, สงสัยมะเร็ง); ผู้ป่วยรายนี้ปวดคุมได้ → <b>conservative</b>: หยุดสุราและบุหรี่, analgesic แบบขั้นบันได, pancreatic enzyme replacement ถ้ามี exocrine insufficiency, ดูแล diabetes; นอกจากนี้ duct 3 mm ไม่ขยาย จึงไม่เหมาะกับ drainage procedure (Puestow ต้อง main duct ขยาย ราว ≥5–7 mm)",
  wrong:["Puestow (lateral pancreaticojejunostomy แบบ Partington-Rochelle) เป็น <b>drainage</b> procedure ใช้เมื่อ main duct <b>ขยาย ≥5–7 mm</b> และปวดดื้อต่อการรักษา — duct 3 mm ต่อ jejunum ไม่ได้ผล; จะถูกถ้าโจทย์ให้ chain-of-lakes duct 9 mm และปวดต้องใช้ opioid ทุกวัน",
    "Frey = local resection ของ pancreatic head (coring) + lateral pancreaticojejunostomy ใช้เมื่อมี <b>inflammatory mass ที่ head</b> ร่วมกับ duct ขยาย และปวดดื้อยา; จะถูกถ้าโจทย์ให้ head ขยาย มี stones และ duct ขยาย ปวดดื้อยา",
    "Whipple (pancreaticoduodenectomy) ใช้เมื่อโรคอยู่ที่ head ร่วมกับ biliary หรือ duodenal obstruction หรือ<b>สงสัยมะเร็ง</b>; จะถูกถ้าโจทย์ให้ head mass ที่แยกมะเร็งไม่ได้",
    "Distal pancreatectomy ใช้เมื่อโรคจำกัดที่ body หรือ tail (stricture หรือ disconnected duct ด้าน tail, pseudocyst ที่ tail); จะถูกถ้าโจทย์ให้ stricture ที่ body และ tail อักเสบโดยที่ head ปกติ"],
  trap:"เห็นคำว่า dilate หรือ calcification แล้วตอบ Puestow — ต้องดู<b>ขนาด duct</b> (3 mm ยังไม่ขยายในผู้ใหญ่) และ<b>ความรุนแรงของปวด</b> ก่อนเลือกผ่าตัด",
  summary:["Chronic pancreatitis: สาเหตุหลัก alcohol และ smoking (TIGAR-O); triad pancreatic calcification + steatorrhea + diabetes (พบไม่บ่อยครบทั้งสาม); วินิจฉัยด้วย CT หรือ MRCP (calcification, duct dilatation หรือ stricture, atrophy)","ขนาด main pancreatic duct ปกติ (ผู้ใหญ่): head ราว 3–3.5 mm, body ราว 2.5 mm, tail ราว 1.5–2 mm และกว้างขึ้นตามอายุ","Pain management แบบขั้นบันได: หยุดสุราและบุหรี่ → analgesics (paracetamol, NSAID, tramadol) → endoscopic therapy (ERCP stent, ESWL สำหรับนิ่ว ≥5 mm ใน head) → surgery","ESCAPE trial (2020): ผู้ป่วยปวดและ duct ขยาย ผ่าตัดเร็วลดปวดได้ดีกว่า endoscopy-first","เลือกหัตถการ: duct ขยาย ≥5–7 mm → Puestow (lateral pancreaticojejunostomy); duct ขยาย + head mass → Frey; head mass ไม่มี duct dilatation → Beger (duodenum-preserving head resection) หรือ Whipple; small-duct ปวดดื้อทุกวิธี → total pancreatectomy with islet autotransplantation","Exocrine insufficiency → pancreatic enzyme replacement; endocrine insufficiency → type 3c diabetes; เพิ่มความเสี่ยง pancreatic cancer","ดูข้อ 51, 58 (pancreas)"],
  notes:"ลายมือ: ที่หัวข้อเขียนสีแดง <b>\"น่าจะหมายถึง chronic pancreatitis &gt; IPMN, other malignancies\"</b>; วงช้อย b เขียนสีแดง <b>\"เดาว่าน่าจะอันนี้\"</b>; แปะสไลด์ <b>Gross anatomy</b> ขนาด duct ปกติ (head 3.5 mm อายุ &lt;50, 5 mm อายุ 70–79; body 2.5 mm, 3 mm; tail 1.5 mm, 2 mm) เขียนกำกับ <b>\"เทียบกับขนาดปกติ\"</b>; แตกแขนง: <b>\"duct โต (&gt;5 mm) → drain\"</b> และ <b>\"duct เล็ก → resection → มีหลายวิธี (Puestow's, Frey's, Beger's)\"</b> ใต้ลงมาเขียน <b>\"↳ เดี๋ยวยิ่งไปยุ่งเยอะ ๆ จะมี stricture ขึ้นมาอีก\"</b>",
  mnemonic:"<b>Puestow = Pipe wide</b> (ท่อใหญ่จึงต่อลำไส้ได้); <b>Frey = Fat head + wide duct</b>; <b>Beger = Big head, small duct</b>",
  guide:"HaPanEU: United European Gastroenterology evidence-based guidelines for chronic pancreatitis (Löhr et al., 2017); ESGE Guideline: Endoscopic treatment of chronic pancreatitis (Dumonceau et al., 2019)",
  opinion:"⚠ เห็นด้วยกับคีย์ B เมื่อเติมบริบท chronic pancreatitis ที่ปวดคุมได้ — ต้นฉบับกำกวมมาก; หมายเหตุ: ในโน้ตรุ่นพี่จัด Puestow ไว้ใต้ \"duct เล็ก → resection\" ซึ่งไม่ถูก — Puestow เป็น <b>drainage</b> procedure สำหรับ duct ขยาย ส่วน Frey เป็น hybrid และ Beger เป็น resection",
  variants:["Chronic pancreatitis ปวดดื้อ opioid, MRCP main duct 9 mm chain of lakes → Puestow (lateral pancreaticojejunostomy)","Chronic pancreatitis มี inflammatory mass ที่ head + duct ขยาย ปวดดื้อยา → Frey procedure","Chronic pancreatitis ถ่ายเป็นมัน น้ำหนักลด → pancreatic enzyme replacement therapy"]}),

A({page:3, page2:3, orig:"13", kimg:KI("14"),
  stem:"A woman arrived from the USA by a long-haul flight yesterday and now has edema of the left leg with unilateral calf swelling. What is the investigation of choice in this case?",
  gray:"13. Woman arrived from USA yesterday and have leg edema, what’s the ix in this case — a. Duplex ultrasound b. CTA",
  opts:["Compression duplex ultrasound","CT pulmonary angiography","Contrast venography","MR venography","CT angiography of the lower extremity"],
  ans:0, key:"A Duplex ultrasound"+KS,
  flag:"⚠ เติม \"unilateral calf swelling\" ของขาซ้าย — ต้นฉบับบอกแค่ leg edema (ขาบวมสองข้างหลังเดินทางอาจเป็น dependent edema)",
  interp:"นั่งเครื่องบินนาน (immobility) แล้วขาบวมข้างเดียว → ต้องแยก DVT",
  why:"<b>Compression duplex ultrasound</b> เป็น investigation of choice สำหรับ suspected DVT: ไม่ invasive ไม่มีรังสี ทำข้างเตียงได้ ไวและจำเพาะสูงต่อ proximal (femoropopliteal) DVT; เกณฑ์หลัก = <b>vein กดไม่ยุบ (non-compressible)</b> ร่วมกับเห็น thrombus, ไม่มี flow, vein ขยาย, เสีย respiratory phasic variation",
  wrong:["CT pulmonary angiography ใช้วินิจฉัย <b>pulmonary embolism</b> — จะถูกถ้าโจทย์ให้หอบเหนื่อยเฉียบพลัน เจ็บหน้าอก hypoxemia หลังบินนาน",
    "Contrast venography เคยเป็น gold standard แต่ invasive ใช้สารทึบรังสี เจ็บ และอาจทำให้เกิด thrombosis — ปัจจุบันใช้เมื่อ US สรุปไม่ได้หรือก่อนทำ catheter-directed intervention",
    "MR venography ใช้ประเมิน <b>pelvic หรือ iliac vein</b> และ IVC ที่ US มองไม่เห็นดี หรือในหญิงตั้งครรภ์สงสัย iliac DVT — แพงและไม่ใช่ first line",
    "CT angiography ของขาดู<b>หลอดเลือดแดง</b> (acute limb ischemia หรือ PAD) ไม่ใช่การตรวจหลักของ DVT; CT venography ใช้ดู thrombus เหนือ inguinal ligament (iliac vein, May-Thurner) หรือวางแผนใส่ IVC filter"],
  trap:"ใน algorithm จริงต้องประเมิน <b>Wells score</b> ก่อน — DVT unlikely → D-dimer ก่อน (ถ้าปกติ exclude ได้); DVT likely → duplex US เลย; อย่าส่ง CTA เพราะชื่อ \"angiography\"",
  summary:["Wells score for DVT (+1 ต่อข้อ): active cancer, paralysis หรือใส่เฝือกขา, bedridden &gt;3 วันหรือผ่าตัดใหญ่ใน 12 สัปดาห์, กดเจ็บตามแนว deep vein, ขาบวมทั้งขา, น่องบวม &gt;3 cm เทียบอีกข้าง, pitting edema เฉพาะข้างที่มีอาการ, collateral superficial veins, เคยเป็น DVT; −2 ถ้ามีโรคอื่นที่น่าจะเป็นพอ ๆ กัน → ≥2 = likely","DVT unlikely → D-dimer: ปกติ (&lt;500 ng/mL FEU หรือใช้ age-adjusted = อายุ × 10 ในผู้ที่ &gt;50 ปี) exclude ได้; ผิดปกติ → duplex US","DVT likely → compression duplex US (proximal หรือ whole-leg); ถ้าผลลบแต่ยังสงสัย → D-dimer หรือ US ซ้ำใน 1 สัปดาห์","Duplex findings: non-compressible vein (สำคัญที่สุด), echogenic thrombus, no flow, venous distension, loss of respiratory variation; calf vein sensitivity ต่ำกว่า proximal","Iliac หรือ pelvic DVT, May-Thurner syndrome (left common iliac vein ถูก right common iliac artery กด) → CT venography หรือ MR venography","รักษา proximal DVT: anticoagulation (DOAC เช่น rivaroxaban หรือ apixaban เป็นหลัก) อย่างน้อย 3 เดือน; IVC filter เฉพาะผู้ที่ห้ามใช้ anticoagulant","ดูข้อ 35 (VTE prophylaxis)"],
  notes:"ลายมือ: วงคำว่า \"USA\" และ \"ix\"; ที่ช้อย a (วง) เขียนสีแดง <b>\"R/O VTE esp. femoropopliteal DVT\"</b> แล้วเขียนเกณฑ์ duplex: <b>non compressible</b> (ใน calf vein อาจ sens↓), <b>no flow, thrombus, venous distension, loss of respiratory flow variation</b>; ด้านขวาเขียน <b>\"มี Wells score ≤0 ส่ง D-dimer ก่อน ถ้า ≥500 ค่อย DUS (D-dimer &lt;500 → exclude VTE)\"</b>; ที่ช้อย b CTA เขียน <b>\"ดู thrombus เหนือต่อ inguinal lig ลง iliac v.\"</b> และ <b>\"ดูใน May-Thurner syndrome หรือวางแผนใส่ IVC filter\"</b>; วาดรูปหลอดเลือดดำขา EIV → CFV → DFV, FV → popliteal → ATV, PV, PTV",
  mnemonic:"<b>Compress = Can't compress → Clot</b>",
