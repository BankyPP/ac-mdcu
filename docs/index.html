  summary:["ผลของ pneumoperitoneum: ↓ venous return, ↑ SVR, ↑ MAP ช่วงแรก, ↓ cardiac output ในผู้ที่ volume น้อยหรือหัวใจอ่อนแรง; ↑ peak airway pressure, ↓ FRC; hypercarbia และ respiratory acidosis; ↓ renal blood flow และ urine output","ข้อห้ามของ laparoscopy: hemodynamic instability, ไม่สามารถทน general anesthesia หรือ pneumoperitoneum (severe heart failure, severe COPD), uncorrected coagulopathy; ข้อห้ามสัมพัทธ์: adhesion หนาแน่น, ascites มาก, ตั้งครรภ์ไตรมาสสาม (เทคนิคยาก)","ทางเลือกในผู้ป่วยหัวใจไม่ดีที่จำเป็นต้องผ่าตัด: low-pressure pneumoperitoneum (8–10 mmHg), gasless laparoscopy หรือ open surgery พร้อม invasive monitoring","ESC 2022 non-cardiac surgery: ประเมิน functional capacity และ risk factors; ผู้ป่วย HFrEF ควร optimize GDMT ก่อน elective surgery","Laparoscopy ในหญิงตั้งครรภ์: ทำได้ทุกไตรมาส, ความดัน 10–15 mmHg, left lateral tilt, VTE prophylaxis, fetal heart monitoring ก่อนและหลังผ่าตัด","ผู้เคยผ่าตัดช่องท้อง: open Hasson entry หรือ Palmer point (left upper quadrant ใต้ costal margin)","ดูข้อ 10, 63 (laparoscopy, pregnancy)"],
  notes:"ลายมือ: วงช้อย A ขีดเส้นใต้ \"15%\" และเขียน <b>\"EF 15% แค่นี้ก็ reduce แล้ว ถ้าอัด gas ในท้อง VR↓ → HF\"</b> (ด้านบนเป็นท้ายโน้ตของข้อ 13 เรื่อง May-Thurner และ IVC filter)",
  mnemonic:"",
  guide:"SAGES Guidelines for the Use of Laparoscopy During Pregnancy (2017); 2022 ESC Guidelines on cardiovascular assessment and management of patients undergoing non-cardiac surgery; Sabiston 21st ed. (2022)",
  opinion:"",
  variants:["ระหว่าง laparoscopy ผู้ป่วย BP ตก ETCO2 ลดลงทันที → สงสัย CO2 embolism → หยุด insufflation, desufflate, left lateral decubitus head down","หญิงตั้งครรภ์ 24 สัปดาห์มี acute appendicitis → laparoscopic appendectomy ได้ ใช้ความดัน 10–15 mmHg และ left lateral tilt","ผู้ป่วย severe COPD ทำ laparoscopic surgery ต้องระวังอะไร → hypercarbia จาก CO2 absorption"]}),

A({page:3, page2:3, orig:"15", kimg:KI("16"),
  stem:"After surgery for trauma from an accident, a patient develops multiple enterocutaneous fistulas. Which IV fluid is most appropriate to replace the fistula losses?",
  gray:"15. Trauma from accident, after Sx has multiple enterocutaneus fistula. What is management? — A. Ringer lactate B. 3% nss C. Albumin D. 5%Dextrose",
  opts:["Ringer lactate","3% NaCl","5% albumin","5% dextrose in water","0.45% NaCl"],
  ans:0, key:"A Ringer lactate"+KS,
  interp:"Enterocutaneous fistula หลายตำแหน่ง = เสียน้ำจากลำไส้เล็กซึ่งเป็นสารน้ำ isotonic มี Na, K และ HCO3 → ต้องทดแทนด้วย isotonic balanced crystalloid",
  why:"Small bowel effluent มี Na ราว 100–140, K ราว 5–15, Cl ราว 60–125 และ HCO3 ราว 20–40 mmol/L (ต่างกันตามตำแหน่ง) → <b>Ringer lactate</b> (Na 130, K 4, Cl 109, lactate 28 ซึ่งเปลี่ยนเป็น HCO3 ที่ตับ, Ca 3) เป็น <b>balanced isotonic crystalloid</b> ที่ใกล้เคียง physiologic ที่สุด ทดแทนทั้งปริมาตร Na และ base ที่เสียไป",
  wrong:["3% NaCl เป็น hypertonic saline ใช้แก้ symptomatic severe hyponatremia หรือลด ICP — ให้ทดแทน fistula loss จะทำให้ hypernatremia; จะถูกถ้าโจทย์ให้ผู้ป่วยชักจาก Na 112 mmol/L",
    "Albumin เป็น colloid ไม่มี electrolyte ที่เสียทาง fistula และไม่ได้ประโยชน์ในการทดแทน output; hypoalbuminemia ใน fistula แก้ด้วย nutrition; จะถูกถ้าใช้ร่วมในการ resuscitate cirrhosis หลัง large-volume paracentesis",
    "5% dextrose in water เป็น free water (hypotonic เมื่อน้ำตาลถูกใช้) → hyponatremia และไม่ทดแทน Na หรือ HCO3 ที่เสียไป ทำให้ metabolic acidosis แย่ลง; จะถูกถ้าแก้ hypernatremia จาก free water deficit",
    "0.45% NaCl เป็น hypotonic ใช้เป็น maintenance fluid ในบางกรณี — Na ไม่พอทดแทน fistula loss ที่เกือบ isotonic; จะถูกถ้าทดแทน gastric loss ร่วม KCl ในบางตำรา หรือเป็น maintenance ร่วม dextrose"],
  trap:"เห็นคำว่า \"management\" แล้วคิดถึงการผ่าตัดปิด fistula ทันที — ช่วงแรกต้อง <b>resuscitate และทดแทนน้ำ electrolyte</b> ก่อน ผ่าตัด definitive ทำหลัง 3–6 เดือน",
  summary:["Output ของ ECF: low &lt;200, moderate 200–500, high &gt;500 mL/วัน; high-output มาจาก proximal small bowel และปิดเองยากกว่า","ทดแทน output แบบ mL ต่อ mL ด้วย isotonic crystalloid (RL หรือ NSS) + K; pancreatic หรือ duodenal fistula มี HCO3 สูง อาจต้องเพิ่ม bicarbonate; gastric loss มี HCl → NSS + KCl","หลัก SNAP: Sepsis control และ skin care, Nutrition (TPN ใน high output, enteral ถ้าทำได้; fistuloclysis), Anatomy (fistulogram หรือ CT), Procedure (definitive surgery หลังปล่อยให้ peritoneum หายอักเสบ 3–6 เดือน)","ยาที่ช่วยลด output: PPI, loperamide, octreotide (ลด output แต่ไม่เพิ่มอัตราการปิด)","ปัจจัยที่ทำให้ไม่ปิดเอง <b>FRIENDS</b>: Foreign body, Radiation, Inflammation หรือ Infection (IBD), Epithelialization, Neoplasm, Distal obstruction, Short tract &lt;2 cm (บางตำราใช้ S = Sepsis หรือ Steroids)","Fistula ส่วนใหญ่ที่ปิดเองได้ปิดภายใน 4–6 สัปดาห์ หลังจากนั้นโอกาสปิดเองต่ำ","ดูข้อ 22, 25, 32, 49 (fluid, electrolytes)"],
  notes:"ลายมือ: ขีดเส้นใต้ \"multiple enterocutaneous fistula\"; วงช้อย A เขียน <b>\"physiologic ที่สุดแล้ว\"</b>; ที่ช้อย D 5% Dextrose เขียน <b>\"metabolic acidosis\"</b>",
  mnemonic:"<b>FRIENDS</b> ทำให้ fistula ไม่ปิด; <b>SNAP</b> = ลำดับการดูแล",
  guide:"ASPEN-FELANPE Clinical Guidelines: Nutrition Support of Adult Patients With Enterocutaneous Fistula (Kumpf et al., JPEN 2017); Sabiston 21st ed. (2022)",
  opinion:"",
  variants:["ผู้ป่วย high-output jejunal fistula 2 L/วัน มี hypokalemia และ metabolic acidosis → ทดแทนด้วย RL + KCl และให้ TPN","Enterocutaneous fistula 2 เดือนไม่ปิด CT พบ distal obstruction → ปัจจัยที่ทำให้ไม่ปิด (Distal obstruction ใน FRIENDS)","ผู้ป่วย pyloric obstruction อาเจียนมาก → hypochloremic hypokalemic metabolic alkalosis → ให้ NSS + KCl"]}),

A({page:4, page2:4, orig:"16", kimg:KI("17"),
  stem:"Which of the following must be included in the preoperative evaluation of hemostasis and coagulation?",
  gray:"16. Which must be include in preop in term of hemostasis and coagulation — A. CBC with platelete B. PT/INR C. APTT D. ADP platelet function E. History and physical exam",
  opts:["CBC with platelet count","PT/INR","APTT","ADP platelet function test","History and physical examination"],
  ans:4, key:"E History and physical exam"+KS,
  interp:"คำว่า <b>must</b> (ต้องทำทุกราย) — ถามการประเมิน bleeding risk ก่อนผ่าตัดที่จำเป็นสำหรับทุกคน",
  why:"<b>Bleeding history</b> (ประวัติเลือดออกง่ายหลังผ่าตัดหรือถอนฟัน ประจำเดือนมาก ประวัติครอบครัว ยา anticoagulant หรือ antiplatelet โรคตับไต) + <b>physical examination</b> (petechiae, ecchymosis, hepatosplenomegaly, stigmata ของโรคตับ) เป็น screening ที่ดีที่สุดและต้องทำ<b>ทุกราย</b>; routine coagulation test ในผู้ที่ประวัติปกติมี positive predictive value ต่ำ และไม่แนะนำ (BCSH 2008, NICE NG45)",
  wrong:["CBC with platelet ส่งตามข้อบ่งชี้ (ผ่าตัดใหญ่ที่คาดว่าเสียเลือดมาก, ประวัติ anemia, โรคเลือด, โรคตับ) — ไม่ใช่ทุกราย",
    "PT/INR ส่งเมื่อได้ warfarin, มีโรคตับ, malnutrition หรือ vitamin K deficiency, ประวัติเลือดออกผิดปกติ — ไม่ใช่ทุกราย",
    "APTT ส่งเมื่อได้ heparin, สงสัย hemophilia หรือ von Willebrand disease จากประวัติ — ไม่ใช่ทุกราย; ค่าผิดปกติที่พบบ่อยในคนไม่มีอาการคือ lupus anticoagulant หรือ factor XII deficiency ซึ่งไม่เพิ่มเลือดออก",
    "ADP platelet function test ใช้ในผู้ที่มีประวัติ mucocutaneous bleeding สงสัย platelet function disorder หรือประเมินฤทธิ์ P2Y12 inhibitor ในบางกรณี — ไม่ใช่ screening ทั่วไป"],
  trap:"คิดว่าต้องส่ง CBC, PT, APTT ทุกคนก่อนผ่าตัด — ประวัติและตรวจร่างกาย<b>สำคัญกว่าและต้องทำเสมอ</b> ส่วน lab ส่งตามข้อบ่งชี้",
  summary:["Bleeding history ที่ควรถาม: เลือดออกนานหลังผ่าตัด ถอนฟัน หรือคลอด, ประจำเดือนมาก, จ้ำเลือดง่าย เลือดกำเดาบ่อย, ประวัติครอบครัว, ยา (warfarin, DOAC, antiplatelet, NSAID, สมุนไพรอย่าง ginkgo หรือน้ำมันปลา), โรคตับ ไต; ใช้แบบสอบถามมาตรฐานเช่น ISTH-BAT","ตรวจร่างกาย: petechiae, purpura, ecchymosis, hemarthrosis, hepatosplenomegaly, jaundice, stigmata ของ cirrhosis","BCSH 2008: ไม่แนะนำ routine coagulation screening ในผู้ไม่มีประวัติเลือดออก ไม่ว่าการผ่าตัดใหญ่หรือเล็ก","ส่ง lab ตามข้อบ่งชี้: anticoagulant → PT/INR หรือ APTT; โรคตับ → PT/INR, platelet; ประวัติเลือดออกผิดปกติ → CBC, PT, APTT, fibrinogen, VWF studies ปรึกษา hematologist","PT ตรวจ extrinsic + common pathway (VII, X, V, II, fibrinogen); APTT ตรวจ intrinsic + common pathway (XII, XI, IX, VIII, X, V, II)","ประวัติปกติแต่ผล APTT ยาวโดยบังเอิญ → ทำ mixing study (แก้ได้ = factor deficiency; แก้ไม่ได้ = inhibitor เช่น lupus anticoagulant)","ดูข้อ 33, 35, 52, 53, 54, 55, 76 (perioperative)"],
  notes:"ลายมือ: ขีดเส้นใต้ \"must\" ในโจทย์; วงเล็บปีกกา A–D เขียน <b>\"ตามแต่จะ Hx, PE ได้\"</b>; วงช้อย E เขียน <b>\"เสมอ!\"</b>",
  mnemonic:"",
  guide:"BCSH Guidelines on the assessment of bleeding risk prior to surgery or invasive procedures (Chee et al., Br J Haematol 2008); NICE NG45 Routine preoperative tests for elective surgery (2016)",
  opinion:"",
  variants:["ผู้ป่วยก่อนผ่าตัดถุงน้ำดี ไม่มีประวัติเลือดออก ไม่มีโรคร่วม → ไม่ต้องส่ง coagulation test","ผู้ป่วยมีประวัติเลือดออกนานหลังถอนฟัน ประจำเดือนมาก APTT ยาวเล็กน้อย → von Willebrand disease ต้องตรวจ VWF antigen และ activity","APTT ยาวในผู้ป่วยไม่มีอาการ mixing study ไม่แก้ → lupus anticoagulant"]}),

A({page:4, page2:4, orig:"17", kimg:KI("18"),
  stem:"A patient has a low TSH. A thyroid scan shows a cold nodule. What is the most likely diagnosis?",
  gray:"17. TSH ต่ำ. Thyroid scan ได้ cold nodule. ? Diagnosis. — A. Thyroid cancer B. Grave’s C. autoimmune thyroiditis D. Toxic adenoma",
  opts:["Thyroid cancer","Graves disease","Autoimmune thyroiditis","Toxic adenoma","Subacute thyroiditis"],
  ans:1, key:"B Grave’s"+KS,
  interp:"TSH ต่ำ = hyperthyroidism; scan พบ cold nodule = nodule ที่ไม่จับ tracer ในต่อมที่ทำงานเกิน → ต้องหาโรคที่อธิบาย TSH ต่ำได้ แล้ว nodule เย็นเป็น nodule ที่อยู่ร่วม",
  why:"<b>Graves disease</b> อธิบาย TSH ต่ำได้ (TRAb กระตุ้น TSH receptor → diffuse increased uptake) และต่อม Graves <b>มี nodule ที่ไม่ทำงาน (cold) ร่วมได้</b> ซึ่งจะเห็นเป็นบริเวณไม่จับ tracer ท่ามกลางเนื้อต่อมที่จับ tracer มาก; โรคอื่นในช้อยอธิบายผล TSH ต่ำ + cold nodule ร่วมกันไม่ได้ — แต่ <b>cold nodule ในผู้ป่วย Graves ต้องประเมินมะเร็ง</b>ด้วย US ± FNA ตาม ATA (cold nodule เป็นมะเร็งราว 10%) โดยเฉพาะก่อนให้ RAI",
  wrong:["Thyroid cancer ทำให้เกิด cold nodule ได้ แต่ผู้ป่วยมักเป็น <b>euthyroid</b> (TSH ปกติ) — มะเร็งไม่ได้อธิบาย TSH ต่ำ; จะถูกถ้าโจทย์ให้ TSH ปกติ + cold nodule + US suspicious",
    "Autoimmune thyroiditis (Hashimoto) มักทำให้ <b>TSH สูง</b> (hypothyroid) และ uptake ต่ำหรือ heterogeneous; ช่วงแรกอาจมี hashitoxicosis ชั่วคราวแต่ uptake ต่ำทั่วต่อม; จะถูกถ้าโจทย์ให้ TSH สูง anti-TPO บวก ต่อมโตแข็งขรุขระ",
    "Toxic adenoma ทำให้ TSH ต่ำได้ แต่ scan เป็น <b>hot nodule</b> ที่กดเนื้อต่อมส่วนที่เหลือ — ไม่ใช่ cold; จะถูกถ้าโจทย์ให้ TSH ต่ำ + hot nodule เดี่ยว",
    "Subacute (de Quervain) thyroiditis ทำให้ TSH ต่ำได้ แต่ uptake <b>ต่ำทั่วทั้งต่อม</b> (ไม่ใช่ cold nodule เฉพาะจุด) ต่อมเจ็บ มีไข้ ESR สูง หลังติดเชื้อไวรัส; จะถูกถ้าโจทย์ให้คอเจ็บ ไข้ RAIU ต่ำมากทั้งต่อม"],
  trap:"เห็น cold nodule แล้วตอบมะเร็งทันที — มะเร็งไม่ทำให้ TSH ต่ำ; และอย่าสับสน toxic adenoma (hot) กับ cold nodule",
  summary:["Thyroid scan ใน hyperthyroidism: Graves = diffuse increased uptake; toxic adenoma = hot nodule เดี่ยว เนื้อที่เหลือถูกกด; toxic MNG (Plummer) = หลาย hot nodule; thyroiditis (subacute, painless, postpartum) และ exogenous thyroid hormone = uptake ต่ำทั่วต่อม","Cold (nonfunctioning) nodule: ส่วนใหญ่ benign (colloid nodule, cyst, adenoma, autoimmune) แต่มะเร็งราว 10% → ประเมินด้วย US และทำ FNA ตามขนาดและ sonographic pattern","Hot (hyperfunctioning) nodule แทบไม่เป็นมะเร็ง → ATA 2015 ไม่ต้อง FNA","Graves ที่มี nodule: ATA 2016 แนะนำประเมิน nodule ด้วย US และ FNA ตามเกณฑ์ก่อนเลือกการรักษา; ถ้า cytology สงสัยหรือเป็นมะเร็ง → total thyroidectomy แทน RAI","Marine-Lenhart syndrome = Graves disease ร่วมกับ <b>functioning nodule</b> (nodule ที่ยังจับ tracer แต่ไม่เท่าเนื้อ Graves รอบข้าง) — ไม่ใช่ cold nodule แท้; nodule ชนิดนี้มักดื้อต่อ RAI ต้องใช้ขนาดสูงหรือผ่าตัด","Graves: TRAb บวก, exophthalmos, pretibial myxedema; รักษาด้วย antithyroid drug (methimazole; PTU ในไตรมาสแรก), RAI หรือ total thyroidectomy","ดูข้อ 39 (โจทย์เดียวกันที่ถูกจดซ้ำในไฟล์นี้)"],
  notes:"ลายมือ: ช้อย A Thyroid cancer <b>\"→ euthyroid\"</b>; ช้อย B Grave's (วง) <b>\"→ TSH↓ มี cold nodule ได้\"</b> และเขียน <b>\"Marine-Lenhart syn.\"</b>; ช้อย C autoimmune thyroiditis <b>\"→ TSH↑\"</b>; ช้อย D Toxic adenoma <b>\"→ hot nodule\"</b>; แปะสไลด์ <b>Differential diagnosis</b>: \"A list of differential diagnoses for cold nodules comprise both benign and malignant entities... great majority comprising benign entities such as autoimmune changes, coexisting nodular goitre; incidence of thyroid malignancy in ~10% of all nodules; scintigraphically-cold nodules with sonographic features suspicious for malignancy are usually biopsied, especially before radioiodine therapy.\"",
  mnemonic:"<b>TSH ต่ำ = ต่อมทำงานเกิน → ต้องมีโรคที่ทำงานเกิน</b>; cold = nodule ที่อยู่ร่วม ไม่ใช่ตัวการ",
  guide:"2016 ATA Guidelines for Diagnosis and Management of Hyperthyroidism and Other Causes of Thyrotoxicosis (Ross et al.); 2015 ATA Guidelines for Thyroid Nodules and Differentiated Thyroid Cancer (Haugen et al.)",
  opinion:"⚠ เห็นด้วยกับคีย์ B (most likely diagnosis) — แก้เล็กน้อยจากโน้ตรุ่นพี่: Marine-Lenhart syndrome หมายถึง Graves ร่วมกับ <b>functioning nodule</b> ที่ทำงานน้อยกว่าเนื้อ Graves รอบข้าง (จึงดูจางกว่าแต่ยังจับ tracer) ไม่ใช่ cold nodule ที่ไม่ทำงานเลย; cold nodule แท้ใน Graves คือ coexisting nonfunctioning nodule ซึ่งต้องประเมินมะเร็งตาม US ± FNA ก่อนเลือก RAI",
  variants:["หญิงอายุ 35 TSH ต่ำ ต่อมโตทั่ว scan diffuse increased uptake มี exophthalmos → Graves disease","TSH ต่ำ scan พบ hot nodule เดี่ยว เนื้อที่เหลือถูกกด → toxic adenoma; ไม่ต้อง FNA","TSH ปกติ cold nodule 2 cm US solid hypoechoic microcalcification → FNA"]}),

A({page:4, page2:4, orig:"18", kimg:KI("19"),
  stem:"A patient has multiple microcalcifications in the upper inner and lower inner parts of the breast. Biopsy shows invasive ductal carcinoma. On physical examination, the axillary lymph nodes are negative. What is the next management?",
  gray:"18. multiple microcalcification at upper and lower inner part. Dx as invasive ductal carcinoma. PE แล้ว LN negative. ทำไรต่อ — A. BCT + SNLB B. total mastectomy + SNLB C. BCT + ALND D. total mastectomy + ALND",
  opts:["Breast-conserving therapy and SLNB","Total mastectomy and SLNB","Breast-conserving therapy and ALND","Total mastectomy and ALND","Breast-conserving therapy alone"],
  ans:1, key:"B total mastectomy + SNLB"+KS,
  interp:"Microcalcification กระจายหลายจุดในสอง quadrant (upper inner และ lower inner) = diffuse suspicious microcalcifications → BCT ไม่เหมาะ; axilla clinically negative → staging ด้วย SLNB",
  why:"NCCN: <b>diffuse suspicious or malignant-appearing microcalcifications</b> เป็น <b>absolute contraindication ของ BCT</b> (ตัดให้ margin ลบและเหลือรูปเต้านมที่ยอมรับได้ไม่ได้) → ต้อง <b>total mastectomy</b>; axilla <b>clinically node-negative (cN0)</b> → <b>sentinel lymph node biopsy</b> เป็นมาตรฐาน ไม่ทำ ALND ตั้งแต่แรก",
  wrong:["BCT + SLNB ถูกสำหรับก้อนเดียว ขนาดเหมาะกับเต้านม และ calcification เฉพาะที่ — แต่ diffuse microcalcification หลาย quadrant ห้าม BCT; จะถูกถ้าโจทย์ให้ IDC ก้อนเดียว 2 cm cN0",
    "BCT + ALND ผิดทั้งสองส่วน: ห้าม BCT และ cN0 ไม่ต้อง ALND; ALND ใช้เมื่อ axillary node บวกที่พิสูจน์แล้วและยังไม่ได้ neoadjuvant หรือ SLN บวก ≥3 ต่อม",
    "Total mastectomy + ALND ส่วน mastectomy ถูก แต่ ALND เกินจำเป็นใน cN0 และเพิ่ม lymphedema; จะถูกถ้าโจทย์ให้ axillary node คลำได้และ FNA ยืนยันว่าเป็นมะเร็ง (cN1 ที่ไม่ได้ neoadjuvant)",
    "BCT alone ห้ามทั้ง BCT และขาด axillary staging — invasive cancer ต้อง stage axilla (ยกเว้นบางกลุ่มเช่นผู้สูงอายุ ≥70 HR-positive HER2-negative cT1N0 ที่อาจละเว้น SLNB ได้)"],
  trap:"เห็นว่า LN negative แล้วคิดว่าเลือก BCT ได้ — ตัวตัดสินชนิดการผ่าตัดเต้านมคือ<b>การกระจายของ calcification</b> ส่วน LN เป็นตัวตัดสิน axillary surgery แยกกัน",
  summary:["Absolute contraindications ของ BCT (NCCN): inflammatory breast cancer หรือ extensive skin involvement, diffuse suspicious microcalcifications, ตัด margin ให้ลบไม่ได้หลัง re-excision, homozygous ATM mutation, multicentric disease ที่มีเงื่อนไขเสี่ยง, ตั้งครรภ์ที่ต้องฉายรังสีระหว่างตั้งครรภ์","Relative contraindications: genetic predisposition (BRCA), Li-Fraumeni (TP53), active connective tissue disease ที่ผิวหนัง (scleroderma, lupus), เคยฉายรังสีบริเวณเต้านมหรือทรวงอก","BCT = breast-conserving surgery + whole breast radiotherapy; survival เท่า mastectomy ในผู้ที่เหมาะสม","Axilla: cN0 → SLNB; SLN บวก 1–2 ต่อมใน BCT + RT → ไม่ต้อง ALND (ACOSOG Z0011); ใน mastectomy SLN บวก 1–2 → axillary RT แทน ALND ได้ (AMAROS); SLN บวก ≥3 หรือ cN+ ที่พิสูจน์แล้ว → ALND","ข้อแทรกซ้อน ALND: lymphedema (~15–20%), seroma, intercostobrachial nerve numbness, จำกัดการเคลื่อนไหวไหล่ — SLNB ลดอัตราเหล่านี้มาก","Microcalcification ที่น่าสงสัยบน mammogram: fine pleomorphic, fine linear branching, segmental distribution → BI-RADS 4–5 → stereotactic core biopsy","ดูข้อ 26 (โจทย์ diffuse microcalcification คล้ายกัน)"],
  notes:"วงช้อย B; แปะสไลด์ <b>NCCN Guidelines Version 3.2024 Invasive Breast Cancer — Special considerations to breast-conservation therapy requiring RT</b>: Contraindications for BCT — <b>Absolute (mastectomy is recommended)</b>: inflammatory breast cancer or invasive breast cancer with extensive skin and dermal lymphatic involvement; <b>diffuse suspicious or malignant-appearing microcalcifications</b>; inability to achieve negative pathologic margins after one or more re-excision attempts; homozygous ATM mutation; multicentric disease with any of the following: receipt of neoadjuvant chemotherapy or endocrine therapy, age ≤40, triple-negative, more than 2 lesions involving more than 2 quadrants by MRI, any individual lesion ≥5 cm, BRCA mutation carrier, multicentric pure DCIS, inability to achieve negative margins, cN2–N3, any reason precluding delivery of WBRT + boost; patients diagnosed with gestational breast cancer who cannot receive RT within 12–16 weeks; <b>Relative (mastectomy should be considered, but BCT may be appropriate)</b>: patients with a known genetic predisposition to breast cancer, pathologic p53 mutation (Li-Fraumeni), active connective tissue disease involving the skin (scleroderma, lupus), a history of prior radiation therapy to the affected area",
  mnemonic:"",
  guide:"NCCN Guidelines Breast Cancer v.3.2024 (สไลด์ในไฟล์ — ใช้เวอร์ชันปัจจุบันประกอบ); Management of the Axilla in Early-Stage Breast Cancer: OH (CCO) and ASCO Guideline (Brackstone et al., 2021)",
  opinion:"",
  variants:["IDC ก้อนเดียว 2 cm ที่ upper outer quadrant cN0 ต้องการเก็บเต้านม → BCT + SLNB แล้วฉายรังสี","IDC ทำ BCT + SLNB พบ SLN บวก 2 ต่อม จะฉาย whole breast RT → ไม่ต้อง ALND (Z0011)","Inflammatory breast cancer → neoadjuvant systemic therapy แล้ว modified radical mastectomy + RT (ห้าม BCT และห้าม SLNB)"]}),
A({page:4, page2:4, orig:"19", kimg:KI("20"),
  stem:"A patient presents with a goiter. Evaluation shows a multinodular goiter involving both thyroid lobes, and the patient has compressive symptoms. What is the most appropriate treatment?",
  gray:"19. ผู้ป่วยเป็น goiter. รักษาอะไร. — A. Total thyroidectomy B. Subtotal thyroidectomy",
  opts:["Total thyroidectomy","Subtotal thyroidectomy","Lobectomy","Radioactive iodine","Levothyroxine suppression"],
  ans:0, key:NK, flag:"⚠ ต้นฉบับบอกแค่ 'goiter' และมีช้อยแค่ total vs subtotal — เติม multinodular goiter ทั้งสองกลีบ + compressive symptoms ให้มีข้อบ่งชี้ผ่าตัดและเหลือคำตอบเดียว; ไฟล์เฉลยไม่ได้วงคำตอบ",
  interp:"ต้นฉบับถามสั้นมาก (goiter รักษาอะไร) ระหว่าง total กับ subtotal thyroidectomy — แก่นของข้อคือ goiter ที่มีข้อบ่งชี้ผ่าตัดและเป็นทั้งสองกลีบ ปัจจุบันผ่าแบบไหน",
  why:"Goiter ไม่ได้ต้องผ่าทุกราย — ข้อบ่งชี้ผ่าตัดคือ <b>compressive symptoms</b> (dysphagia, dyspnea, stridor, หายใจลำบากตอนนอนราบ), retrosternal extension, สงสัยหรือเป็นมะเร็ง, toxic MNG ที่เลือกผ่า และ cosmetic concern. เมื่อ MNG เป็น<b>ทั้งสองกลีบ</b> → <b>total (หรือ near-total) thyroidectomy</b>: ไม่เหลือเนื้อต่อมให้โตซ้ำ (subtotal มี recurrence สูงเมื่อติดตามนาน และ reoperation ในแผลเป็นเสี่ยง RLN injury และ hypoparathyroidism มากกว่าการผ่าครั้งแรกหลายเท่า). Cochrane review 2015 พบว่า total/near-total ลด recurrence เมื่อเทียบกับ subtotal โดย permanent RLN palsy และ permanent hypoparathyroidism ไม่ต่างกัน (transient hypocalcemia อาจมากกว่า) — หลังผ่าต้องให้ levothyroxine ตลอดชีวิต",
  wrong:["เหลือเนื้อต่อมไว้ → goiter กลับเป็นซ้ำได้สูงเมื่อติดตามนาน และการผ่าซ้ำเสี่ยง RLN injury/hypoparathyroidism มากกว่า; เดิมนิยมเพื่อเลี่ยง hypothyroidism — ปัจจุบันแทบไม่ใช้ใน MNG ทั้งสองกลีบ (near-total ที่เหลือเนื้อเพียงเล็กน้อยยังพอรับได้ในบางศูนย์)",
         "เหมาะกับโรคข้างเดียว: toxic adenoma, solitary nodule ที่ indeterminate, DTC 1–4 cm low risk — ใน MNG ทั้งสองกลีบจะเหลือ nodule อีกข้างที่ยังกดเบียดหรือโตต่อ; จะถูกถ้าโจทย์บอกว่าเป็น nodule หรือ goiter ข้างเดียว",
         "RAI ลดขนาด goiter ได้บางส่วนและช้า (เป็นเดือน) อาจบวมชั่วคราวช่วงแรก ไม่เหมาะเมื่อมีอาการกดหลอดลม — ใช้ใน toxic MNG (ATA 2016 ให้ RAI หรือผ่าตัด) หรือผู้สูงอายุที่เสี่ยงผ่าตัดสูงและไม่มีอาการกดเบียดรุนแรง",
         "ATA 2015 ไม่แนะนำ TSH suppression เป็น routine ใน benign nodule ในพื้นที่ที่ได้ไอโอดีนเพียงพอ — ลดขนาดได้น้อย เสี่ยง AF และ osteoporosis และไม่แก้ compressive symptom; ไม่มีกรณีที่เป็นคำตอบของข้อนี้"],
  trap:"คิดว่า subtotal 'ปลอดภัยกว่า' เพราะเหลือต่อมไว้ — ในมือผู้ชำนาญ total ปลอดภัยพอ ๆ กัน และ subtotal ทำให้ต้องผ่าซ้ำซึ่งอันตรายกว่า; อีกกับดักคือ goiter ที่ไม่มีอาการ euthyroid และ FNA benign ไม่ต้องผ่าเลย",
  summary:["Goiter workup: TSH ก่อนเสมอ → US คอ → FNA nodule ตามลักษณะ US (ATA 2015); TSH ต่ำ → thyroid scan หา hot หรือ cold nodule",
    "ข้อบ่งชี้ผ่าตัด goiter: compressive symptoms, retrosternal extension, สงสัยหรือพิสูจน์ว่าเป็นมะเร็ง, toxic MNG หรือ toxic adenoma ที่เลือกผ่า, cosmetic concern",
    "MNG ทั้งสองกลีบ → total thyroidectomy เป็นมาตรฐานแทน subtotal — ลด recurrence และเลี่ยง reoperation; ให้ levothyroxine ตลอดชีวิต",
    "โรคข้างเดียว (toxic adenoma, solitary nodule) → lobectomy",
    "Toxic MNG (ATA 2016): RAI หรือ near-total/total thyroidectomy (เลือกผ่าถ้าก้อนใหญ่กดเบียด สงสัยมะเร็ง หรือต้องการผลเร็ว); antithyroid drug ใช้คุมให้ euthyroid ก่อน หรือ low-dose ระยะยาวในบางราย — remission หลังหยุดยาน้อยมากเมื่อเทียบกับ Graves",
    "Complication ของ total thyroidectomy: hypocalcemia จาก hypoparathyroidism (ส่วนใหญ่ชั่วคราว), RLN injury (เสียงแหบ; สองข้าง → stridor), external branch of superior laryngeal nerve (เสียงสูงไม่ได้), neck hematoma (กดทางเดินหายใจ → เปิดแผลทันที)",
    "Levothyroxine suppression ไม่แนะนำ routine; RAI สำหรับ nontoxic goiter ใช้ในผู้เสี่ยงผ่าตัดสูง",
    "ดูข้อ 8, 18, 39, 40 (thyroid)"],
  notes:"ไฟล์เฉลย<b>ไม่ได้วงคำตอบ</b> — ลายมือข้างโจทย์: '=โต? ดูยังไง??' (สงสัยว่า goiter ในโจทย์หมายถึงแค่ต่อมโต) และ '<b>ถ้าตอบได้ต้องมี compressive symptom</b>'; ด้านขวาเขียน '<b>toxic MNG: ① ยา → 2 ปีไม่หาย → ② I-131 or ③ ไปผ่า</b>'; แปะ flowchart thyroid nodule (History/Physical examination, Serum TSH, Thyroid sonography → FNA → Non-diagnostic: repeat FNA; Benign: follow up — cyst re-accumulate ×3, continued growth, compressive symptoms → lobectomy; AUS/FLUS: repeat FNA หรือ lobectomy; FN/SFN: lobectomy หรือ TT; Suspicious for malignancy: lobectomy &amp; frozen section หรือ TT; Malignancy: TT)",
  mnemonic:"",
  guide:"ATA 2015 Thyroid Nodules and Differentiated Thyroid Cancer; ATA 2016 Hyperthyroidism and Other Causes of Thyrotoxicosis; Cochrane review total/near-total vs subtotal thyroidectomy for multinodular non-toxic goitre 2015",
  opinion:"เห็นด้วยกับ total thyroidectomy เมื่อเติมว่าเป็นทั้งสองกลีบและมีอาการกดเบียด (ความมั่นใจสูง). ต้นฉบับไม่ระบุชนิด goiter — รุ่นพี่เองก็เขียนว่าต้องมี compressive symptom ถึงจะตอบได้. ถ้าโจทย์เป็น nodule ข้างเดียว → lobectomy; ถ้าเป็น toxic MNG ในผู้สูงอายุเสี่ยงผ่าตัดและไม่กดเบียด → RAI. โน้ตรุ่นพี่ 'ยา 2 ปีไม่หาย' เป็น pathway แบบ Graves (ATD 12–18 เดือนแล้วประเมิน remission) — toxic MNG แทบไม่ remission ด้วยยา จึงมักไป RAI หรือผ่าตัดเป็น definitive treatment",
  variants:["Retrosternal goiter หายใจลำบากตอนนอนราบ → total thyroidectomy ผ่านแผลที่คอ (ส่วนใหญ่ไม่ต้อง sternotomy)","Toxic adenoma ก้อนเดียว เป็น hot nodule → lobectomy หรือ RAI","Benign nodule 2 cm ไม่มีอาการ euthyroid → ติดตามด้วย US ไม่ต้องผ่าและไม่ต้อง levothyroxine"]}),
A({page:4, page2:4, orig:"20", kimg:KI("21"),
  stem:"Which of the following is NOT considered prophylactic antibiotic use?",
  gray:"20. what is NOT considered “prophylactic antibiotics” — A. ceftriaxone and metronidazole given to patient with acute appendicitis while waiting for appendectomy B. vancomycin given 20 mins prior to herniorrhaphy with mesh ?? to patient allergic to penicillin C. cefazolin given 1 hour prior to athroplasty",
  opts:["Ceftriaxone and metronidazole given to a patient with uncomplicated acute appendicitis while awaiting appendectomy","Vancomycin given 20 minutes before mesh herniorrhaphy to a patient allergic to penicillin","Cefazolin given 1 hour before arthroplasty","Cefazolin given 30 minutes before mastectomy","None of the above"],
  ans:4, key:NK, flag:"⚠ ไฟล์เฉลยไม่ได้วง (รุ่นพี่เขียนครอบทุกช้อยว่า 'ถูกทุกข้อ' = ทุกข้อเป็น prophylaxis); ต้นฉบับมี 3 ช้อย — แต่ง D, E เพิ่ม และเติม 'uncomplicated' ในช้อย A ให้เหลือคำตอบเดียว",
  interp:"ถามนิยาม prophylactic antibiotics — ทุกช้อยเป็นการให้ยา<b>ก่อน</b>ผ่าตัดเพื่อป้องกัน SSI ในผู้ที่ไม่มีการติดเชื้อที่ต้องรักษาต่อ (หรือการอักเสบจำกัดอยู่ในอวัยวะที่จะตัดออก)",
  why:"Prophylaxis = ให้ยาก่อนลงมีด (ส่วนใหญ่ภายใน 60 นาที; vancomycin และ fluoroquinolone ภายใน 120 นาทีเพราะต้องหยดนาน) และหยุดภายใน 24 ชม. เพื่อลด SSI. ใน <b>uncomplicated appendicitis</b> การอักเสบจำกัดอยู่ในไส้ติ่งที่จะถูกตัดออก ยาก่อนผ่าตัดจึงนับเป็น prophylaxis (ASHP 2013 จัด appendectomy for uncomplicated appendicitis ไว้ในตาราง prophylaxis และไม่ให้ยาต่อหลังผ่า). Vancomycin 20 นาทีก่อนผ่า = <b>เริ่มช้าเกินไป</b> (ควรเริ่มหยด 60–120 นาทีก่อน incision) แต่เจตนายังเป็น prophylaxis. Cefazolin 1 ชม. ก่อน arthroplasty และ 30 นาทีก่อน mastectomy อยู่ในเกณฑ์ → ทุกข้อเป็น prophylaxis → <b>None of the above</b>",
  wrong:["ใน uncomplicated appendicitis ยาก่อนผ่า = prophylaxis และไม่ต้องให้ต่อหลังผ่า — ช้อยนี้จะเป็นคำตอบ (= therapeutic ไม่ใช่ prophylaxis) ถ้าเป็น <b>complicated appendicitis</b>: perforated, gangrenous, abscess หรือ peritonitis ซึ่งต้องให้ยาต่อหลัง source control (~4 วันตาม STOP-IT trial 2015)",
         "ยังเป็น prophylaxis — vancomycin เป็นทางเลือกในผู้แพ้ beta-lactam รุนแรงหรือมี MRSA colonization (รุ่นพี่: 'OK! if MRSA suspected') แต่ 20 นาทีก่อนผ่า timing ไม่เหมาะ → ผิดเรื่องเวลา ไม่ใช่ผิดประเภท; จะเป็นคำตอบถ้าโจทย์ถามว่า 'ข้อใดให้ prophylaxis ไม่ถูกต้อง'",
         "Cefazolin 2 g IV ภายใน 60 นาทีก่อน incision (3 g ถ้าน้ำหนัก ≥120 kg) = prophylaxis มาตรฐานของ arthroplasty; จะผิดก็ต่อเมื่อให้หลังลงมีดแล้ว หรือให้ต่อเนื่องเกิน 24 ชม.",
         "Breast cancer surgery เป็น clean procedure; cefazolin ภายใน 60 นาทีก่อนผ่าเป็น prophylaxis ที่ ASHP แนะนำ — จะไม่ใช่ prophylaxis ถ้าให้เพื่อรักษา mastitis หรือ breast abscess ที่มีอยู่แล้ว"],
  trap:"คิดว่า 'มีโรคติดเชื้ออยู่แล้ว = ยาที่ให้คือยารักษา' — ต้องแยก uncomplicated appendicitis (prophylaxis ไม่ต้องให้ต่อ) กับ complicated (treatment); และอย่าสับสน 'ให้ยาผิดเวลา' กับ 'ไม่ใช่ prophylaxis'",
  summary:["หลักการ prophylaxis: ยาครอบคลุมเชื้อที่คาดว่าจะปนเปื้อน ให้ IV ภายใน 60 นาทีก่อน incision (vancomycin, fluoroquinolone ภายใน 120 นาที), redose cefazolin ทุก 4 ชม. หรือเมื่อเสียเลือด &gt;1,500 mL, หยุดภายใน 24 ชม. (WHO และ CDC 2017 แนะนำไม่ให้ต่อหลังปิดแผล)",
    "Cefazolin เป็นยาหลักใน clean และ clean-contaminated ส่วนใหญ่ (2 g; 3 g ถ้า ≥120 kg); appendectomy และ colorectal ต้องครอบคลุม anaerobe → cefazolin + metronidazole, cefoxitin หรือ ceftriaxone + metronidazole",
    "แพ้ penicillin ที่ไม่ใช่ anaphylaxis หรือ severe cutaneous reaction → ให้ cefazolin ได้ (cross-reactivity ต่ำมาก); แพ้รุนแรง → clindamycin หรือ vancomycin; MRSA colonization → เพิ่ม vancomycin",
    "Uncomplicated appendicitis: ยาก่อนผ่า = prophylaxis ไม่ต้องให้ต่อ; complicated (perforated, abscess, peritonitis) = therapeutic ให้ต่อหลัง source control ราว 4 วัน",
    "ตารางยาไทยที่รุ่นพี่สรุป: appendectomy → ceftriaxone + metronidazole หรือ cefoxitin; colorectal → ceftriaxone + metronidazole; biliary tract → cefazolin หรือ ciprofloxacin; vascular graft → cloxacillin",
    "Open inguinal mesh repair: HerniaSurge 2018 ไม่แนะนำ prophylaxis routine ในผู้ป่วยความเสี่ยงเฉลี่ยในสถานที่ที่ SSI ต่ำ แต่แนะนำในผู้ป่วยหรือสถานที่ที่เสี่ยงสูง",
    "ดูข้อ 17, 33, 37 (perioperative)"],
  notes:"ไฟล์เฉลย<b>ไม่ได้วงคำตอบ</b> — วงคำว่า NOT ในโจทย์; ขีดเส้นใต้ 'while waiting' (เขียน '?' กำกับ), '20 mins', '1 hour prior'; ข้าง B เขียน '→ OK! if MRSA suspected'; วงเล็บปีกกาครอบช้อย A–C เขียนว่า '<b>ถูกทุกข้อ</b>'; แปะตาราง Table 1 antimicrobial recommended prophylaxis suitable for surgical practice in Thailand (ไฮไลต์บางแถว) และเขียนสรุป: appendectomy: ceftri + metro OR cefoxitin; colorectal: ceftri + metro; biliary tract: cefazolin OR ciprofloxacin; vascular graft: cloxacillin",
  mnemonic:"'60–120–4–24': ให้ภายใน 60 นาที (vanco/FQ 120), redose cefazolin ทุก 4 ชม., หยุดภายใน 24 ชม.",
  guide:"ASHP/IDSA/SIS/SHEA Clinical Practice Guidelines for Antimicrobial Prophylaxis in Surgery 2013; WHO Global Guidelines for the Prevention of SSI 2018; CDC SSI Guideline 2017; HerniaSurge 2018",
  opinion:"⚠ ไฟล์เฉลยไม่ได้วง แต่รุ่นพี่เขียนครอบทุกช้อยว่า 'ถูกทุกข้อ' (ทุกข้อเป็น prophylaxis) จึงเพิ่ม D (cefazolin ก่อน mastectomy) และ E None of the above ให้ครบ 5 ช้อยแล้วตอบ E. ต้นฉบับเขียนแค่ 'acute appendicitis' — ถ้าผู้ออกข้อสอบตั้งใจว่า 'ให้ยาในคนที่มีการอักเสบติดเชื้ออยู่แล้ว = รักษา' คำตอบจะเป็น A; ความต่างอยู่ที่ uncomplicated (prophylaxis ตาม ASHP 2013) กับ complicated (therapeutic) จึงเติม 'uncomplicated' ในช้อย A ให้เหลือคำตอบเดียว. ความมั่นใจปานกลาง: ข้อสอบจริงอาจต้องการคำตอบ A",
  variants:["Perforated appendicitis ได้ ceftriaxone + metronidazole ต่อหลังผ่า 4 วัน → therapeutic ไม่ใช่ prophylaxis","ผู้ป่วยแพ้ penicillin แบบผื่นธรรมดา จะผ่าตัด clean surgery → ให้ cefazolin ได้","ผ่าตัดนาน 5 ชม. ได้ cefazolin ก่อนลงมีด → ต้อง redose ที่ 4 ชม."]}),
A({page:5, page2:5, orig:"21", kimg:KI("22"),
  stem:"In SIADH, which serum electrolyte is abnormal?",
  gray:"21. SIADH อะไรผิดปกติ — A. Na B. K C. Mg",
  opts:["Sodium","Potassium","Magnesium","Calcium","Phosphate"],
  ans:0, key:"A Sodium"+KS,
  interp:"SIADH = ADH หลั่งเกินโดยไม่สัมพันธ์กับ osmolality → เก็บน้ำอิสระ → electrolyte ตัวไหนเปลี่ยน",
  why:"ADH↑ → V2 receptor ที่ collecting duct → aquaporin-2 → ดูดน้ำอิสระกลับ → <b>dilutional hyponatremia</b> แบบ euvolemic. เกณฑ์วินิจฉัย: serum Na &lt;135 mmol/L, serum osmolality &lt;275 mOsm/kg, urine osmolality &gt;100 mOsm/kg (เข้มข้นอย่างไม่เหมาะสม), urine Na &gt;30 mmol/L ขณะกินเกลือปกติ, euvolemia, ไม่มี hypothyroidism หรือ adrenal insufficiency และไม่ได้ใช้ diuretic — K, Mg, Ca, phosphate โดยทั่วไปปกติ",
  wrong:["SIADH ไม่มี aldosterone excess จึงไม่กระทบ K โดยตรง — hyponatremia ร่วมกับ K ผิดปกติให้นึกถึง adrenal insufficiency (Na↓ K↑) หรือ thiazide และการอาเจียน (Na↓ K↓)",
         "ไม่เกี่ยวกับ ADH — hypomagnesemia พบใน diuretic, PPI ระยะยาว, alcoholism, diarrhea, cisplatin และมักมาคู่ hypokalemia, hypocalcemia",
         "ไม่เกี่ยว — hypercalcemia กลับทำให้เกิด nephrogenic DI (ปัสสาวะมาก ตรงข้าม SIADH); hypocalcemia พบหลัง thyroidectomy/parathyroidectomy, pancreatitis",
         "ไม่เกี่ยว — hypophosphatemia พบใน refeeding syndrome และระหว่างรักษา DKA; hyperphosphatemia พบใน CKD, tumor lysis, rhabdomyolysis"],
  trap:"คิดว่า Na ในร่างกายหายไป — จริง ๆ total body Na เกือบปกติ แต่<b>น้ำเกิน</b>จึงเจือจาง; และอย่าสับสนกับ cerebral salt wasting ซึ่ง hypovolemic และต้องให้ NaCl ไม่ใช่จำกัดน้ำ",
  summary:["SIADH = euvolemic hypotonic hyponatremia: Na &lt;135, Posm &lt;275, Uosm &gt;100, UNa &gt;30, ไม่บวมไม่ขาดน้ำ, thyroid-adrenal-renal function ปกติ; uric acid และ BUN มักต่ำ",
    "สาเหตุ: CNS (head injury, SAH, meningitis), pulmonary (pneumonia, TB, positive-pressure ventilation), malignancy (small cell lung cancer), ยา (SSRI, carbamazepine, cyclophosphamide, vincristine, opioid), หลังผ่าตัด (ปวด คลื่นไส้)",
    "Cerebral salt wasting แยกจาก SIADH ด้วย volume status: CSW hypovolemic → ให้ NaCl; SIADH euvolemic → จำกัดน้ำ",
    "รักษา: จำกัดน้ำ (ราว 800–1,000 mL/วัน), salt tablets, urea, tolvaptan; อาการรุนแรง (ชัก ซึมมาก) → 3% NaCl bolus 100–150 mL ซ้ำได้ เป้าเพิ่ม Na 4–6 mmol/L แรก",
    "เพิ่ม Na ไม่เกิน 10–12 mmol/L ใน 24 ชม. (≤8 ในกลุ่มเสี่ยง: alcoholism, malnutrition, hypokalemia, liver disease) เพื่อป้องกัน osmotic demyelination syndrome",
    "หลังผ่าตัด ADH สูงจาก surgical stress → การให้ hypotonic fluid เสี่ยง hyponatremia; ใช้ isotonic fluid เป็นหลัก",
    "ดูข้อ 16, 25, 32, 49 (fluids/electrolytes)"],
  notes:"วง A. Na และเขียน '<b>ADH↑</b>'; แปะสไลด์ SIADH: Syndrome of inappropriate ADH secretion (SIAD, syndrome of inappropriate antidiuresis); the most common cause of euvolemic hyponatremia; excessive secretion of ADH; generation of hyponatremia: persistent intake of free water at serum osmolalities that are lower than the usual threshold for thirst; common causes: pulmonary disease, CNS disease",
  mnemonic:"SIADH = 'น้ำเกิน ไม่ใช่เกลือหาย' → Na เจือจาง แต่ปัสสาวะเข้มข้นผิดที่",
  guide:"European Clinical Practice Guideline on Hyponatraemia 2014 (ESE/ESICM/ERBP); US Expert Panel Recommendations on Hyponatremia 2013; Sabiston 21st ed. (2022)",
  opinion:"",
  variants:["ผู้ป่วย head injury Na 125, ขาดน้ำ, ปัสสาวะมาก urine Na สูง → cerebral salt wasting → ให้ NaCl","ผู้ป่วย small cell lung cancer Na 120 euvolemic → SIADH → จำกัดน้ำ","Na 118 ชัก → 3% NaCl bolus แล้วระวังไม่ให้ Na ขึ้นเกิน 10 ใน 24 ชม."]}),
A({page:5, page2:5, orig:"22", kimg:KI("23"),
  stem:"Which of the following is required when matching a donor liver to a recipient for liver transplantation?",
  gray:"22. Liver transplantต้องทำอะไร — A. Cross matching B. HLA C. ABO",
  opts:["Lymphocytotoxic crossmatch","HLA matching","ABO compatibility","Rh compatibility","Donor-recipient sex matching"],
  ans:2, key:"C ABO compatibility"+KS,
  interp:"ถามว่าในการจับคู่ตับ ต้องดูความเข้ากันได้อะไร — แยกจาก kidney transplant ที่ต้องดูหลายอย่าง",
  why:"ตับเป็น <b>immune privileged organ</b>: ทนต่อ hyperacute และ antibody-mediated rejection ได้ดี (ขนาดใหญ่ มี dual blood supply, Kupffer cells กรองแอนติบอดีและ immune complex, หลั่ง soluble HLA class I) จึง<b>ไม่ต้อง HLA matching และไม่ต้องรอผล crossmatch</b> ก่อนผ่า — จัดสรรด้วย <b>ABO compatibility</b> (เหมือนหรือเข้ากันได้) + ขนาด + ความรุนแรงของโรค (MELD/PELD). ABO-incompatible LT เสี่ยง antibody-mediated rejection, hepatic artery thrombosis และ ischemic cholangiopathy",
  wrong:["ไม่ต้องทำก่อนจัดสรรตับ (positive crossmatch ไม่ใช่ข้อห้ามของ LT) — จำเป็นใน kidney transplant (และ pancreas, heart ในผู้ที่ sensitized) เพราะ positive CDC crossmatch → hyperacute rejection",
         "ไม่ต้องจับคู่ HLA ในตับ (ผลต่อ graft survival น้อย และไม่มีเวลารอระหว่าง cold ischemia) — HLA matching สำคัญใน kidney transplant และ HSCT",
         "Rh (D antigen) อยู่บนเม็ดเลือดแดง ไม่ใช่ endothelium ของอวัยวะ จึงไม่ใช้ใน solid organ transplant — สำคัญใน blood transfusion และการตั้งครรภ์",
         "เพศไม่ใช่เกณฑ์จับคู่ — ที่ใช้คือ size matching (น้ำหนักตัว, ใน LDLT ใช้ graft-to-recipient weight ratio ≥0.8%)"],
  trap:"เอาหลักของ kidney transplant (ABO + HLA + crossmatch) มาใช้กับตับ — ตับต้องการแค่ ABO + ขนาด",
  summary:["Liver = immune privileged organ: ทนต่อ hyperacute rejection, ไม่ต้อง HLA matching หรือ crossmatch ก่อนผ่า — จับคู่ด้วย ABO + ขนาด + ความรุนแรงของโรค",
    "Allocation policy: patient-based (sickest first ตาม MELD/PELD) เทียบกับ center-based",
    "Kidney transplant ต้อง ABO compatible + HLA typing + crossmatch (CDC หรือ flow) negative; PRA สูง = sensitized รอนาน",
    "ABO-incompatible LT ทำได้ในภาวะฉุกเฉินหรือ LDLT ร่วมกับ desensitization (rituximab, plasmapheresis) — เสี่ยง AMR, hepatic artery thrombosis, biliary complication",
    "LDLT: graft-to-recipient weight ratio ≥0.8% (หรือ graft ≥40% ของ standard liver volume) เพื่อเลี่ยง small-for-size syndrome",
    "ดูข้อ 24 (orthotopic, indications ของ liver transplantation)"],
  notes:"วง C. ABO; แปะสไลด์ Liver transplantation: allocate by same blood group; no need for HLA typing and crossmatch; immune privilege organ (มีลายมือเล็ก ๆ กำกับเหตุผล); allocation policy: patient based (sickest first) vs center based",
  mnemonic:"ตับ 'ABO พอ' — ไต 'ABO + HLA + crossmatch ครบชุด'",
  guide:"EASL Clinical Practice Guidelines: Liver Transplantation 2016; Sabiston 21st ed. (2022)",
  opinion:"",
  variants:["Kidney transplant ต้องทำอะไรก่อนผ่า → ABO, HLA typing และ crossmatch negative","ทำไม liver ไม่ค่อยเกิด hyperacute rejection → immune privileged (Kupffer cells, soluble HLA class I, dual blood supply)"]}),
A({page:5, page2:5, orig:"23", kimg:KI("24"),
  stem:"In liver transplantation, the recipient's diseased liver is removed and the donor liver is placed in the same anatomical position. Which term describes this transplantation according to the position of the graft?",
  gray:"23. เปลี่ยนตับ — A. Orthotopic B. Allograft C. Autograft",
  opts:["Orthotopic","Heterotopic","Allograft","Autograft","Xenograft"],
  ans:0, key:"A Orthotopic"+KS, flag:"⚠ ต้นฉบับมีแค่ 'เปลี่ยนตับ' — ตับจากผู้บริจาคก็เป็น allograft ด้วย จึงเติม stem ให้ถามชื่อเรียกตาม<b>ตำแหน่ง</b>ของ graft",
  interp:"แยกศัพท์ 2 แกน: ตามตำแหน่ง (orthotopic/heterotopic) กับตามแหล่งผู้ให้ (auto/iso/allo/xenograft)",
  why:"<b>Orthotopic</b> = ตัดอวัยวะเดิมของผู้รับออกแล้ววาง graft ในตำแหน่งกายวิภาคเดิม (ortho = ถูกที่) — liver, heart, lung transplant เป็นแบบนี้; ตรงกับที่รุ่นพี่เขียนว่า 'มาแทนที่ที่เดิม'",
  wrong:["Heterotopic = วาง graft ในตำแหน่งอื่นโดยไม่ตัดอวัยวะเดิม — kidney (iliac fossa), pancreas; heterotopic/auxiliary liver หรือ heart ทำน้อยมาก",
         "ถูกในแง่ชนิดผู้ให้ (คนละคน สายพันธุ์เดียวกัน) — ตับจาก deceased หรือ living donor เป็น allograft; จะเป็นคำตอบถ้าโจทย์ถามว่า graft จากผู้บริจาคสมองตายจัดเป็นชนิดใด แต่ไม่ได้บอกตำแหน่ง",
         "Autograft = เนื้อเยื่อของตัวเอง — skin graft, saphenous vein graft, parathyroid autotransplantation, islet autotransplant หลัง total pancreatectomy; ไม่ใช่ตับจากผู้อื่น",
         "Xenograft = ต่างสายพันธุ์ (pig-to-human kidney หรือ heart ยังเป็นงานทดลอง) — ไม่ใช่ liver transplant มาตรฐาน"],
  trap:"Allograft ก็ 'ถูก' สำหรับ liver transplant — ต้องอ่านว่าโจทย์ถามแกนไหน (ตำแหน่ง vs แหล่งผู้ให้)",
  summary:["Orthotopic = ตัดอวัยวะเดิมแล้ววาง graft ตำแหน่งเดิม: liver (มัก piggyback technique เก็บ IVC ของผู้รับไว้), heart, lung",
    "Heterotopic = วางตำแหน่งอื่นและไม่ตัดอวัยวะเดิม: kidney ที่ iliac fossa, pancreas",
    "ชนิดตามผู้ให้: autograft (ตัวเอง), isograft (แฝดเหมือน), allograft (คนอื่นสายพันธุ์เดียวกัน), xenograft (ต่างสายพันธุ์)",
    "ชนิด graft ตับ: deceased vs living donor; whole vs split (แบ่งตับหนึ่งให้ 2 คน) vs reduced-size",
    "ข้อบ่งชี้: เด็ก → biliary atresia (หลัง Kasai ล้มเหลว) มากที่สุด; ผู้ใหญ่ → decompensated cirrhosis (HBV, HCV, alcohol, MASLD), HCC ใน Milan criteria (ก้อนเดียว ≤5 cm หรือ ≤3 ก้อน แต่ละก้อน ≤3 cm, ไม่มี vascular invasion หรือ extrahepatic spread), acute liver failure (King's College criteria)",
    "ดูข้อ 23 (ABO matching), 31 (donor contraindications)"],
  notes:"วง A. Orthotopic เขียนว่า '<b>มาแทนที่ที่เดิม</b>'; แปะสไลด์ Liver transplantation: orthotopic transplantation; living vs cadaveric; split vs reduced size vs whole graft; most common indication: pediatric — BA, adult — cirrhosis caused by HCV, HBV, alcohol; HCC (Milan's criteria); FHF",
  mnemonic:"Ortho = ตรงที่เดิม, Hetero = ต่างที่",
  guide:"EASL Clinical Practice Guidelines: Liver Transplantation 2016; Sabiston 21st ed. (2022)",
  opinion:"เห็นด้วยกับคีย์และสไลด์ที่รุ่นพี่แปะ. ช้อยต้นฉบับมี Allograft ซึ่งถูกเช่นกันถ้าถามชนิดตามผู้ให้ จึงเติม stem ให้ถามเรื่องตำแหน่ง",
  variants:["Kidney transplant วางที่ iliac fossa โดยไม่เอาไตเดิมออก → heterotopic","เด็ก biliary atresia หลัง Kasai ล้มเหลว ได้ตับส่วน left lateral segment จากพ่อ → living donor, reduced-size orthotopic allograft"]}),
A({page:5, page2:5, orig:"24", kimg:KI("25"),
  stem:"A patient with oliguric acute kidney injury after a crush injury develops an arrhythmia that progresses to ventricular fibrillation. Which electrolyte abnormality is the most likely cause?",
  gray:"24. Arrhythmia + VF — A. Hyperkalemia B. Hypokalemia C. HypoMg",
  opts:["Hyperkalemia","Hypokalemia","Hypomagnesemia","Hypercalcemia","Hypernatremia"],
  ans:0, key:"A Hyperkalemia"+KS, flag:"⚠ ต้นฉบับ 'Arrhythmia + VF' อย่างเดียวตอบได้ทั้ง hyperK, hypoK และ hypoMg — เติมบริบท oliguric AKI หลัง crush injury ให้เหลือ hyperkalemia",
  interp:"Crush injury → rhabdomyolysis + AKI แบบปัสสาวะน้อย → electrolyte ตัวไหนทำ VF",
  why:"Crush → กล้ามเนื้อตาย ปล่อย K ออกนอกเซลล์ + myoglobin ทำ AKI จนขับ K ไม่ได้ + metabolic acidosis ดัน K ออกจากเซลล์ → <b>hyperkalemia</b> (K &gt;5.5). ECG เรียงตามความรุนแรง: peaked T → PR ยาว, P แบนหรือหาย → QRS กว้าง → sine wave → <b>VF</b>/asystole. รักษา: calcium gluconate 10% IV (stabilize membrane) → insulin + glucose, salbutamol nebulizer, NaHCO3 ถ้า acidosis (shift) → K binder, dialysis (remove)",
  wrong:["Hypokalemia ทำ ST↓ T แบน U wave และ ventricular arrhythmia ได้ — จะเป็นคำตอบถ้าโจทย์ให้อาเจียนมาก, NG loss, diuretic หรือให้ insulin; ไม่เข้ากับ oliguric AKI จาก crush",
         "Hypomagnesemia ทำ long QT และ torsades de pointes → VF ได้ — จะเป็นคำตอบในผู้ป่วย alcoholism, diuretic, PPI, diarrhea (รักษาด้วย MgSO4 2 g IV)",
         "Hypercalcemia ทำ short QT และ bradyarrhythmia แต่ VF พบน้อย — ใน crush syndrome ช่วงแรกกลับเป็น <b>hypocalcemia</b> (Ca ไปจับกล้ามเนื้อที่ตาย) ส่วน hypercalcemia มักเกิดช่วง recovery",
         "Hypernatremia ทำอาการทางสมอง (ซึม ชัก) ไม่ใช่สาเหตุของ VF — พบในผู้ที่ขาดน้ำหรือ DI"],
  trap:"เห็น VF แล้วตอบ hypoK หรือ hypoMg ตามความเคยชิน — ต้องดูบริบท: ไตวาย + เนื้อเยื่อตาย = K สูง; crush ยังมี hypocalcemia ช่วงแรกซึ่งยิ่งเพิ่มพิษของ hyperK",
  summary:["Hyperkalemia: K &gt;5.5 mmol/L; อันตรายเมื่อ ≥6.5 หรือมี ECG change",
    "สาเหตุ: intake เกิน, ขับออกไม่ได้ (renal failure, RTA type 4, hypoaldosteronism, ACEI/ARB, spironolactone), shift ออกจากเซลล์ (acidosis, tissue damage จาก crush/burn/tumor lysis/hemolysis, succinylcholine, beta-blocker)",
    "ECG: peaked T → PR ยาว, P แบนหรือหาย → QRS กว้าง → sine wave → VF/asystole; ECG ปกติไม่ได้แปลว่าปลอดภัย",
    "รักษา 3 ขั้น: stabilize membrane (calcium gluconate 10% IV) → shift (insulin + glucose, salbutamol, NaHCO3 ถ้า acidosis) → remove (K binder, loop diuretic, dialysis)",
    "Crush syndrome: rhabdomyolysis → hyperK, metabolic acidosis, hypoCa ช่วงแรก, myoglobinuric AKI → ให้ isotonic fluid เร็ว (เริ่มก่อนนำผู้ป่วยออกจากที่ถูกทับถ้าทำได้) เป้าปัสสาวะสูง, dialysis ถ้า hyperK ดื้อการรักษา",
    "เปรียบเทียบ ECG: hypoK → ST↓ T แบน U wave; hypoMg → long QT, torsades; hypoCa → long QT; hyperCa → short QT",
    "ดูข้อ 16, 22, 32, 49 (fluids/electrolytes)"],
  notes:"วง A. Hyperkalemia และวงคำว่า VF ในโจทย์; ข้าง B hypokalemia เขียน '↓T, ↓ST, U wave'; แปะสไลด์ Hyperkalemia (K⁺ &gt; 5.5 mEq/L): excessive intake → oral, IV; inadequate excretion (renal failure, RTA, hypoaldosteronism); K⁺ shift out of cells (acidosis, tissue damage, drugs); S&amp;S — GI (N/V, cramping), muscle weakness, heart (EKG change: ↑T, QRS↑, ↓P, ↑PR, sine wave → VF, cardiac arrest)",
  mnemonic:"ECG hyperK: 'T แหลม → P หาย → QRS กว้าง → sine → VF'",
  guide:"UK Renal Association: Treatment of Acute Hyperkalaemia in Adults 2020; AHA Guidelines for CPR and ECC 2020; KDIGO AKI 2012",
  opinion:"เห็นด้วยกับ hyperkalemia ตามคีย์และสไลด์ที่รุ่นพี่แปะ. ต้นฉบับกำกวม (hypoK และ hypoMg ก็ทำ VF ได้) จึงเติมบริบทที่ทำให้ K สูงโดยไม่บอก ECG ตรง ๆ; ถ้าโจทย์ให้อาเจียนมากหรือได้ diuretic + U wave → hypokalemia; ถ้าให้คนติดสุรา long QT + torsades → hypomagnesemia",
  variants:["ผู้ป่วย CKD K 7.2 มี QRS กว้าง → ให้ calcium gluconate IV เป็นอย่างแรก","ผู้ป่วยอาเจียนมาก มี U wave → hypokalemia","ผู้ป่วยติดสุรา QT ยาว เกิด torsades → MgSO4 IV"]}),
A({page:5, page2:5, orig:"25", kimg:KI("26"),
  stem:"Mammography shows diffuse suspicious microcalcifications in one breast. Core needle biopsy shows invasive ductal carcinoma. The axillary lymph nodes are not palpable. What is the most appropriate surgical management?",
  gray:"25. นมมีmicrocal axilla LNคลำไม่ได้ — A. Masectomy ALND B. Masectomy sentinel C. BCS sentinel",
  opts:["Mastectomy with axillary lymph node dissection","Mastectomy with sentinel lymph node biopsy","Breast-conserving surgery with sentinel lymph node biopsy","Breast-conserving surgery with axillary lymph node dissection","Breast-conserving surgery without axillary staging"],
  ans:1, key:"B Mastectomy with sentinel lymph node biopsy"+KS, flag:"⚠ ต้นฉบับบอกแค่ 'microcal' + LN คลำไม่ได้ — ถ้า microcalcification เป็นกลุ่มเดียวขนาดเล็ก BCS + SLNB ก็ถูก จึงเติม diffuse suspicious microcalcifications + core biopsy IDC",
  interp:"ต้องตัดสิน 2 เรื่อง: (1) เต้านม — BCS ได้ไหม (2) รักแร้ — cN0 ใช้ SLNB หรือ ALND",
  why:"<b>Diffuse suspicious (malignant-appearing) microcalcifications</b> เป็น absolute contraindication ของ breast-conserving therapy (NCCN) เพราะตัดให้ margin negative พร้อม cosmetic ที่ยอมรับได้ไม่ได้ → <b>mastectomy</b>. รักแร้คลำไม่ได้ (cN0) → axillary staging ด้วย <b>SLNB</b> (lymphedema ราว 5% เทียบ ALND ราว 20%); ALND สงวนไว้สำหรับ node บวกที่พิสูจน์แล้วหรือ SLN mapping ล้มเหลว",
  wrong:["ALND ทำเมื่อ cN+ ที่พิสูจน์ด้วย US-guided biopsy (และไม่ได้ neoadjuvant หรือยังเหลือโรคหลัง neoadjuvant), SLN mapping ล้มเหลว หรือ SLN บวก ≥3 ต่อม — cN0 ไม่ควรทำ ALND ตั้งแต่ต้น",
         "เป็นมาตรฐานถ้า microcalcification จำกัดเป็นบริเวณเดียวที่ตัดได้ margin negative และฉายรังสีได้ — แต่ diffuse suspicious microcalcifications เป็น absolute contraindication ของ BCT",
         "ผิดทั้งสองส่วน: BCT ห้ามใน diffuse microcalcification และ ALND เกินจำเป็นใน cN0 — BCS + ALND ใช้ใน cN+ ที่พิสูจน์แล้วโดยก้อนเหมาะกับ BCS",
         "ละ axillary staging ได้เฉพาะกลุ่มเลือกสรร (อายุ ≥70, HR+/HER2−, T1 cN0 ตาม Choosing Wisely; SOUND 2023 และ INSEMA 2024 ศึกษาใน BCS ที่ US รักแร้ปกติ) — ข้อนี้ยังติดที่ BCS ทำไม่ได้"],
  trap:"เห็น 'microcalcification' แล้วนึกว่าเป็นโรคเล็ก → BCS — ต้องดูการกระจาย: diffuse หรือหลาย quadrant = mastectomy; และ LN คลำไม่ได้ ไม่ได้แปลว่าไม่ต้อง staging",
  summary:["Contraindication ของ BCT (NCCN 2024): absolute — pregnancy ที่ต้องฉายรังสีระหว่างตั้งครรภ์, diffuse suspicious หรือ malignant-appearing microcalcifications, โรคกว้างตัดผ่านแผลเดียวให้ margin negative และ cosmetic ดีไม่ได้, diffusely positive margin, homozygous ATM mutation; relative — เคยฉายรังสีที่เต้าหรือผนังอก, active connective tissue disease ที่ผิวหนัง (scleroderma, lupus), TP53 (Li-Fraumeni), ก้อน &gt;5 cm",
    "BCT = BCS + whole breast RT ให้ overall survival เท่ากับ mastectomy (NSABP B-06, Milan I)",
    "Axilla: cN0 → SLNB; cN+ (พิสูจน์ด้วย US-guided biopsy) → ALND หรือ neoadjuvant แล้วประเมินใหม่ (SLNB หรือ targeted axillary dissection ถ้า ycN0)",
    "SLN บวก 1–2 ต่อมใน BCS + whole breast RT → ไม่ต้อง ALND (ACOSOG Z0011); ใน mastectomy อาศัยข้อมูล AMAROS (axillary RT แทน ALND) และ SENOMAC",
    "Lymphedema หลัง ALND ราว 20% เทียบ SLNB ราว 5%",
    "ละ SLNB ได้ในผู้สูงอายุ ≥70 HR+/HER2− T1 cN0 หรือตามเกณฑ์ SOUND/INSEMA",
    "ดูข้อ 19 (โจทย์ microcalcification หลาย quadrant แบบเดียวกัน)"],
  notes:"วง B. Masectomy sentinel + เขียน '<b>น่าจะเอาแค่นี้ก่อน</b>'; แปะสไลด์ NCCN Guidelines Version 3.2024 Invasive Breast Cancer — Special considerations to breast-conserving therapy requiring RT: contraindications (ชี้และไฮไลต์บรรทัด diffuse suspicious microcalcifications)",
  mnemonic:"",
  guide:"NCCN Breast Cancer v.3.2024; ASCO Guideline Sentinel Lymph Node Biopsy in Early-Stage Breast Cancer 2021",
  opinion:"เห็นด้วยกับคีย์เมื่อ microcalcification กระจาย (ความมั่นใจสูง). ต้นฉบับไม่บอกลักษณะการกระจาย — ถ้าเป็น cluster เดียวที่ตัดได้ → C (BCS + SLNB) ถูก; ถ้ามี axillary LN บวกพิสูจน์แล้ว → ต้องทำ ALND หรือ neoadjuvant ก่อน",
  variants:["Microcalcification cluster 1.5 cm ที่ upper outer quadrant core biopsy IDC LN คลำไม่ได้ → BCS + SLNB + whole breast RT","IDC 2 cm มี axillary LN โต FNA บวก → ALND หรือ neoadjuvant systemic therapy","BCS + SLNB พบ SLN บวก 2 ต่อม จะฉาย whole breast RT → ไม่ต้อง ALND (Z0011)"]}),
A({page:5, page2:5, orig:"26", kimg:KI("27"),
  stem:"Which pairing of an infectious agent with the cancer it causes is incorrect?",
  gray:"26. ทำให้เกิดcancer ข้อไหนผิด — A. Hep A-HCC B. EBV-burkitt C. HPV-penis D. O.viver-cholang E. H.pylori-gastric adeno",
  opts:["Hepatitis A virus and hepatocellular carcinoma","Epstein-Barr virus and Burkitt lymphoma","Human papillomavirus and penile cancer","Opisthorchis viverrini and cholangiocarcinoma","Helicobacter pylori and gastric adenocarcinoma"],
  ans:0, key:"A Hepatitis A virus and hepatocellular carcinoma"+KS,
  interp:"ถามคู่เชื้อก่อมะเร็ง (IARC Group 1) ที่ผิด",
  why:"HAV เป็น RNA picornavirus ติดทาง fecal-oral ก่อ acute hepatitis ที่หายเองเกือบทั้งหมด <b>ไม่มี chronic carrier state</b> → ไม่ทำ cirrhosis หรือ HCC. ไวรัสก่อ HCC คือ <b>HBV</b> (DNA virus integrate เข้าจีโนม ก่อ HCC ได้แม้ไม่มี cirrhosis) และ <b>HCV</b> (ผ่าน chronic inflammation → cirrhosis)",
  wrong:["ถูก — EBV เป็น IARC Group 1 ก่อ Burkitt lymphoma (โดยเฉพาะ endemic, t(8;14) MYC), Hodgkin lymphoma, nasopharyngeal carcinoma, extranodal NK/T-cell lymphoma และ PTLD; จะเป็นคู่ที่ผิดถ้าจับคู่ EBV กับ HCC",
         "ถูก — high-risk HPV (16, 18) ก่อ SCC ของ cervix, anus, vulva, vagina, penis และ oropharynx; จะผิดถ้าจับคู่ HPV กับมะเร็งที่ไม่ใช่ squamous ของบริเวณเหล่านี้",
         "ถูก — liver fluke ที่พบในภาคอีสาน (กินปลาน้ำจืดดิบหรือสุกไม่ทั่ว เช่นก้อยปลา) → chronic biliary inflammation → cholangiocarcinoma; Clonorchis sinensis ก็เป็น Group 1",
         "ถูก — H. pylori ก่อ non-cardia gastric adenocarcinoma และ gastric MALT lymphoma (eradication รักษา MALT lymphoma ระยะแรกได้)"],
  trap:"คิดว่า hepatitis ทุกตัวก่อ HCC — เฉพาะตัวที่เป็นเรื้อรังได้ (B, C และ D ร่วมกับ B); A และ E ติดทางปากและไม่เรื้อรังในคนภูมิปกติ",
  summary:["IARC Group 1 ไวรัส: HBV, HCV → HCC; EBV → Burkitt, Hodgkin, NPC, NK/T-cell lymphoma; HPV → cervix, anus, penis, vulva, vagina, oropharynx; HHV-8 → Kaposi sarcoma, primary effusion lymphoma; HTLV-1 → adult T-cell leukemia/lymphoma; HIV-1",
    "Parasites: Opisthorchis viverrini, Clonorchis sinensis → cholangiocarcinoma; Schistosoma haematobium → bladder SCC",
    "Bacteria: H. pylori → non-cardia gastric adenocarcinoma และ gastric MALT lymphoma",
    "HAV และ HEV ติดทาง fecal-oral → acute hepatitis ไม่เรื้อรังในคนภูมิปกติ → ไม่ก่อ HCC",
    "ปัจจัยเสี่ยง HCC อื่น: cirrhosis จากทุกสาเหตุ, alcohol, MASLD, aflatoxin B1 (เสริมฤทธิ์กับ HBV), hemochromatosis",
    "ภาคอีสานของไทยมีอุบัติการณ์ cholangiocarcinoma สูงมากจาก O. viverrini — ป้องกันด้วยการไม่กินปลาดิบ"],
  notes:"กากบาท A. Hep A-HCC ✗ เขียน 'Hepatitis B, C'; B ✓ 'Hodgkin, Burkitt (non-Hodgkin), Nasopharyngeal CA'; C ✓; D ✓; E ✓ + วงเล็บ 'gastric adenoCA, gastric MALT lymphoma'",
  mnemonic:"'A กับ E กินเข้าไปแล้วหาย — B กับ C เรื้อรังจนเป็นมะเร็ง'",
  guide:"IARC Monographs Volume 100B: Biological Agents (2012)",
  opinion:"",
  variants:["ข้อใดไม่ใช่สาเหตุของ cholangiocarcinoma → H. pylori (ส่วน O. viverrini, PSC, choledochal cyst ใช่)","HHV-8 สัมพันธ์กับมะเร็งใด → Kaposi sarcoma","เชื้อใดสัมพันธ์กับ MALT lymphoma ของกระเพาะ → H. pylori"]}),
A({page:6, page2:6, orig:"27", kimg:KI("28"),
  stem:"A patient presents with symptoms of obstructive jaundice. Imaging shows a mass at the hepatic hilum, dilated hepatic ducts, and peritoneal nodules. What is used to relieve his symptoms?",
  gray:"27. Patient w obstructive jaundice symptoms. Imaging มี mass at hepatic hilum, dilated hepatic duct มี peritoneal nodules. What is used to relieve his symptoms — A. PTBD B. ERCP + stent",
  opts:["Percutaneous transhepatic biliary drainage","ERCP with biliary stent","Hepaticojejunostomy bypass","Pancreaticoduodenectomy","Systemic chemotherapy alone"],
  ans:1, key:"B ERCP with biliary stent"+KS, flag:"⚠ ใช้โจทย์ตามต้นฉบับ — คำตอบขึ้นกับ Bismuth type: ถ้าก้อนลามทั้ง right และ left hepatic duct (Bismuth III–IV) หรือ ERCP ไม่สำเร็จ หลายสถาบันเลือก PTBD",
  interp:"Hilar mass + obstructive jaundice + peritoneal nodules = perihilar cholangiocarcinoma ระยะแพร่กระจาย → ต้องการแค่ palliation ของ jaundice",
  why:"Peritoneal nodules = distant metastasis → unresectable → เป้าหมายคือ biliary drainage เพื่อลด jaundice, pruritus, cholangitis และให้ bilirubin ลดพอจะเริ่ม chemotherapy. <b>ERCP + stent</b> (SEMS ถ้าคาดว่ามีชีวิต &gt;3 เดือน) เป็น internal drainage ไม่มีสายออกนอกตัว ไม่เสียน้ำดี คุณภาพชีวิตดีกว่า และเป็นวิธีที่ใช้บ่อย (รุ่นพี่: 'more common &amp; recommended'); เป้าคือระบายเนื้อตับที่ทำงานอย่างน้อย 50%",
  wrong:["เลือกเมื่อ hilar ซับซ้อน (Bismuth III–IV) ที่ ERCP ระบายได้ไม่พอหรือเสี่ยง cholangitis ใน segment ที่ฉีด contrast แต่ระบายไม่ได้, ERCP ล้มเหลว, หรือกายวิภาคถูกผ่าตัดเปลี่ยน (Roux-en-Y) — ข้อเสียคือสายภายนอก เจ็บ หลุด เสียน้ำดี เลือดออก; ถ้าโจทย์บอก Bismuth IV หรือ ERCP ไม่สำเร็จ → ตอบข้อนี้",
         "Surgical bypass ใช้น้อยลงมากเพราะ morbidity สูงในผู้ป่วยระยะแพร่กระจาย — พิจารณาเมื่อเปิดผ่าตัดหวังตัดแล้วพบว่าตัดไม่ได้ในผู้ป่วยที่แข็งแรง",
         "Whipple เป็นการผ่าตัดหวังหายขาดของ distal cholangiocarcinoma หรือ periampullary tumor ที่ resectable — ไม่ใช่ hilar และห้ามเมื่อมี peritoneal metastasis",
         "Chemotherapy (gemcitabine + cisplatin + durvalumab หรือ pembrolizumab) เป็นการรักษาหลักของ advanced biliary tract cancer แต่ไม่ได้ลด jaundice เร็ว และ bilirubin สูงหรือ cholangitis เป็นข้อจำกัดในการให้ยา → ต้องระบายน้ำดีก่อน"],
  trap:"คิดว่ามะเร็งท่อน้ำดี = Whipple — Whipple สำหรับ distal CBD/periampullary; hilar ที่ตัดได้ต้อง hepatectomy + bile duct resection; มี peritoneal nodule = M1 ไม่ผ่าตัดหวังหายขาด",
  summary:["Perihilar cholangiocarcinoma (Klatskin tumor): painless jaundice, intrahepatic duct โต แต่ GB และ CBD ไม่โต",
    "Bismuth–Corlette: I ใต้ confluence, II ถึง confluence, IIIa ลาม right hepatic duct, IIIb ลาม left, IV ทั้งสองข้างหรือ multifocal",
    "Unresectable: ลาม second-order ducts สองข้างจนเหลือตับไม่พอ, vascular encasement สองข้าง, distant metastasis รวม peritoneal → palliation",
    "Palliative drainage: ERCP + stent (SEMS ถ้าคาดชีวิต &gt;3 เดือน, plastic ถ้าน้อยกว่าหรือยังไม่ชัดว่าผ่าได้) หรือ PTBD; ระบาย ≥50% ของเนื้อตับที่ทำงาน; Bismuth III–IV หรือ ERCP ล้มเหลว → PTBD",
    "Distal malignant biliary obstruction → ERCP + SEMS เป็น first-line; ล้มเหลว → EUS-guided biliary drainage หรือ PTBD",
    "ถ้ายังอาจผ่าตัดได้ ควรทำ CT/MRCP ก่อนใส่ stent เพื่อไม่ให้รบกวน staging",
    "Systemic therapy ของ advanced biliary tract cancer: gemcitabine + cisplatin + durvalumab (TOPAZ-1) หรือ + pembrolizumab (KEYNOTE-966)",
    "ดูข้อ 6, 41, 58 (biliary obstruction)"],
  notes:"เลขข้อไฮไลต์เหลือง (รุ่นพี่ไม่ชัวร์); เขียนเหนือ peritoneal nodules ว่า '<b>CA stage 4?</b>'; ข้าง A เขียน 'percutaneous transhepatic biliary drainage'; กากบาท B. ERCP + stent และเขียน '<b>more common &amp; recommended</b>'",
  mnemonic:"",
  guide:"ESGE Endoscopic Biliary Stenting Guideline (updated 2017, Endoscopy 2018); NCCN Biliary Tract Cancers 2024",
  opinion:"เห็นด้วยกับคีย์ในระดับปานกลาง: ต้นฉบับไม่บอก Bismuth type. ESGE ให้เลือก endoscopic หรือ percutaneous ตามความชำนาญของสถาบัน; หลายการศึกษาพบ PTBD ระบายสำเร็จสูงกว่าและ cholangitis น้อยกว่าใน Bismuth III–IV ขณะที่ ERCP สะดวกกว่าและไม่มีสายภายนอก — ถ้าโจทย์ระบุว่าก้อนลามทั้ง right และ left hepatic duct หรือ ERCP ล้มเหลว ควรตอบ PTBD",
  variants:["Distal CBD stricture จาก pancreatic head cancer มี liver metastasis → ERCP + SEMS","Hilar cholangiocarcinoma Bismuth IV ERCP ล้มเหลว เกิด cholangitis → PTBD","Hilar cholangiocarcinoma Bismuth II ไม่มี metastasis → extended hepatectomy + bile duct resection"]}),
A({page:6, page2:6, orig:"28", kimg:KI("29"),
  stem:"A patient with chronic hepatitis B virus infection needs an operation. Which of the following should NOT be done?",
  gray:"28. คนไข้ติดHBVไม่ควรทำอะไร — A. Observe ไม่เข้าผ่า B. ใส่ goggle C. ใส่apron",
  opts:["Observe and decline to operate","Wear protective eyewear","Wear an impermeable apron","Wear double gloves","Use standard precautions as for all patients"],
  ans:0, key:"A Observe and decline to operate"+KS,
  interp:"ถามสิ่งที่ไม่ควรทำเมื่อผ่าตัดผู้ป่วย HBV — แยกการป้องกันที่ถูกต้องออกจากการปฏิเสธการรักษา",
  why:"การไม่ผ่าตัดเพราะผู้ป่วยติด HBV <b>ผิดจริยธรรมและไม่มีเหตุผลทางการแพทย์</b> — บุคลากรป้องกันตัวเองได้ด้วย HBV vaccination (anti-HBs ≥10 mIU/mL = มีภูมิ), standard precautions กับผู้ป่วยทุกราย, PPE ตามความเสี่ยง และ post-exposure prophylaxis. ผู้ป่วยต้องได้รับการรักษาตามข้อบ่งชี้เหมือนคนอื่น",
  wrong:["ควรทำ — eye protection ป้องกันเลือดกระเด็นเข้าตาและ mucosa; เป็นส่วนหนึ่งของ standard precautions ในทุกการผ่าตัดที่มีโอกาส splash ไม่ใช่เฉพาะผู้ป่วยติดเชื้อ จึงไม่มีบริบทที่ข้อนี้เป็น 'สิ่งที่ไม่ควรทำ'",
         "ควรทำ — impermeable gown หรือ apron เมื่อคาดว่าจะสัมผัสเลือดหรือสารคัดหลั่งปริมาณมาก; ถูกต้องในทุกผู้ป่วย",
         "ควรทำ — double gloving ลดการทะลุของถุงมือชั้นในและการสัมผัสเลือดของศัลยแพทย์ แนะนำในการผ่าตัดทั่วไปโดยเฉพาะผู้ป่วยที่มี blood-borne infection",
         "ถูก — standard precautions คือถือว่าเลือดและสารคัดหลั่งของทุกคนอาจติดเชื้อ จึงปฏิบัติเหมือนกันทุกราย ไม่ต้องรู้สถานะการติดเชื้อก่อน"],
  trap:"ข้อนี้ถาม 'ไม่ควรทำ' — ช้อย PPE ทุกตัวเป็นสิ่งที่ควรทำ; อย่าเผลอเลือก double glove หรือ apron เพราะคิดว่า 'ไม่จำเป็นถ้าใช้ standard precautions'",
  summary:["Standard precautions ใช้กับผู้ป่วยทุกราย: hand hygiene, PPE ตามความเสี่ยง (gloves, gown หรือ apron, mask, eye protection), safe sharps (ไม่ recap เข็ม, ใช้ neutral zone ส่งของมีคม), ทิ้ง sharps ในภาชนะเฉพาะ",
    "ความเสี่ยงติดเชื้อจากเข็มตำในผู้ที่ไม่มีภูมิ: HBV clinical hepatitis 1–6% ถ้าผู้ป่วย HBeAg− และ 22–31% ถ้า HBeAg+ (serologic evidence 23–37% และ 37–62% ตามลำดับ), HCV ราว 1.8%, HIV ราว 0.3%",
    "บุคลากรต้องได้ HBV vaccine 3 เข็ม และตรวจ anti-HBs 1–2 เดือนหลังครบ (≥10 mIU/mL = responder)",
    "PEP หลังสัมผัสเลือด HBsAg+: responder → ไม่ต้องทำอะไร; non-responder หลังวัคซีน 1 ชุด → HBIG 1 ครั้ง + เริ่มวัคซีนชุดใหม่; non-responder หลัง 2 ชุด → HBIG 2 ครั้งห่าง 1 เดือน; ไม่เคยได้วัคซีน → HBIG + เริ่มวัคซีน (HBIG ให้เร็วที่สุด ภายใน 24 ชม.)",
    "Double gloving ลดการทะลุของถุงมือชั้นใน; indicator glove ช่วยให้เห็นรูรั่ว",
    "การปฏิเสธรักษาเพราะผู้ป่วยติด HBV, HCV หรือ HIV ผิดจริยธรรม",
    "ดูข้อ 76 (hand hygiene)"],
  notes:"กากบาท A. Observe ไม่เข้าผ่า (เลือกเป็นคำตอบ) — ไม่มีโน้ตเพิ่ม",
  mnemonic:"Rule of 3s เข็มตำ: HBV 30%, HCV 3%, HIV 0.3% (ตัวเลขจำง่าย; HCV จริงราว 1.8%)",
  guide:"CDC Updated US Public Health Service Guidelines for Management of Occupational Exposures to HBV, HCV, and HIV 2001; CDC Guidance for Evaluating Health-Care Personnel for HBV Protection 2013; SHEA Guideline for Management of HCWs Infected with HBV, HCV, and/or HIV 2010",
  opinion:"",
  variants:["ศัลยแพทย์ที่ anti-HBs ≥10 mIU/mL โดนเข็มตำจากผู้ป่วย HBsAg+ → ไม่ต้องให้ HBIG หรือวัคซีนเพิ่ม","บุคลากรไม่เคยได้วัคซีน โดนเข็มตำจากผู้ป่วย HBsAg+ → HBIG + เริ่ม HBV vaccine","เข็มตำจากผู้ป่วย HIV+ → เริ่ม PEP antiretroviral ให้เร็วที่สุด ภายใน 72 ชม. นาน 28 วัน"]}),
A({page:6, page2:6, orig:"29", kimg:KI("30"), imgNote:"รูปในข้อสอบ: plain film ช่องท้อง — เงาทึบรังสีที่ RLQ ร่วมกับลำไส้เล็กอุดตัน (ไม่มีรูปในไฟล์)",
  stem:"A patient presents with symptoms of small bowel obstruction. An abdominal X-ray is provided, showing a radiopaque density in the right lower quadrant. What is the most likely diagnosis?",
  gray:"29. Patient มี small bowel obstruction symptoms.มี X ray มาให้ (มีขาว ๆ ที่ RLQ) ผู้ป่วยเป็นอะไร — A. Midgut volvulus B. Gallstone ileus C. Acute cholangitis D. Acute cholecystitis",
  opts:["Midgut volvulus","Gallstone ileus","Acute cholangitis","Acute cholecystitis","Sigmoid volvulus"],
  ans:1, key:"B Gallstone ileus"+KS,
  interp:"Small bowel obstruction + เงาทึบที่ RLQ (ตำแหน่ง terminal ileum ใกล้ ileocecal valve) → นึกถึงก้อนอะไรมาอุดใน lumen",
  why:"<b>Gallstone ileus</b> = mechanical SBO จากนิ่วถุงน้ำดีขนาดใหญ่ (มัก &gt;2–2.5 cm) ที่ผ่าน <b>cholecystoenteric fistula</b> (cholecystoduodenal บ่อยที่สุด) แล้วไปติดที่ส่วนแคบที่สุดของลำไส้เล็ก คือ <b>terminal ileum ใกล้ ileocecal valve</b> → เงาทึบที่ RLQ. พบมากในผู้หญิงสูงอายุ. <b>Rigler triad</b>: SBO + pneumobilia + ectopic radiopaque gallstone (เห็นครบใน plain film ไม่บ่อยเพราะนิ่วส่วนใหญ่ไม่ทึบรังสี) → CT วินิจฉัยได้ดีที่สุด",
  wrong:["Midgut volvulus จาก malrotation พบในทารกและเด็กเล็ก มาด้วย bilious vomiting; plain film อาจเห็น double bubble กับ gas ส่วนปลายน้อย ไม่มีเงาทึบที่ RLQ — UGI study เห็น corkscrew → Ladd procedure ฉุกเฉิน",
         "Acute cholangitis = obstruction ของท่อน้ำดี + infection มาด้วย Charcot triad (ไข้ ปวด RUQ เหลือง) ไม่ใช่ SBO — นิ่วอยู่ใน CBD ไม่ใช่ใน lumen ลำไส้",
         "Acute cholecystitis มาด้วยปวด RUQ, Murphy sign, ไข้ วินิจฉัยด้วย US; อาจมี ileus ข้างเคียงแต่ไม่ใช่ mechanical SBO และไม่มีนิ่วที่ RLQ — ทั้งนี้ cholecystitis เรื้อรังเป็นจุดเริ่มต้นของ fistula ที่นำไปสู่ gallstone ileus",
         "Sigmoid volvulus เป็น large bowel obstruction ในผู้สูงอายุท้องผูกเรื้อรัง plain film เห็น coffee bean sign จาก LLQ ชี้ไป RUQ — ไม่ใช่ SBO"],
  trap:"ชื่อ 'ileus' ทำให้คิดว่าเป็น paralytic ileus — จริง ๆ เป็น <b>mechanical obstruction</b>; และอย่าเลือก cholecystitis หรือ cholangitis เพียงเพราะเห็นคำว่านิ่ว",
  summary:["Gallstone ileus: ผู้หญิงสูงอายุ, SBO แบบเป็น ๆ หาย ๆ (tumbling obstruction ขณะนิ่วเคลื่อน), ประวัติโรคถุงน้ำดี",
    "กลไก: cholecystitis เรื้อรัง → cholecystoenteric fistula (cholecystoduodenal บ่อยที่สุด) → นิ่วใหญ่ไปติด terminal ileum ใกล้ ileocecal valve",
    "Rigler triad: SBO + pneumobilia + ectopic gallstone; CT เป็น investigation of choice",
    "Bouveret syndrome = นิ่วไปติดที่ duodenum หรือ pylorus → gastric outlet obstruction",
    "รักษา: resuscitate (ผู้ป่วยมักขาดน้ำ electrolyte ผิดปกติ) → <b>enterolithotomy</b> (ผ่าลำไส้ส่วนต้นต่อจุดอุดเอานิ่วออก) ตรวจหานิ่วก้อนอื่นในลำไส้; cholecystectomy + fistula repair ทำพร้อมกันเฉพาะผู้ป่วยแข็งแรงที่เลือกไว้ หรือทำภายหลัง",
    "SBO ทั่วไป: สาเหตุอันดับ 1 คือ adhesion, อันดับ 2 hernia; gallstone ileus เป็นสาเหตุไม่บ่อย (ราว 1–4%) แต่พบบ่อยขึ้นในผู้สูงอายุ",
    "ดูข้อ 65 (SBO), 6 และ 43 (โรคทางเดินน้ำดี)"],
  notes:"กากบาท B. Gallstone ileus (เลือกเป็นคำตอบ) + เขียน '<b>น่าจะเป็น gall stone ที่ไปอุดแถว IC valve</b>'",
  mnemonic:"Rigler triad 'อุด–ลม–หิน': SBO, air in biliary tree, ectopic stone",
  guide:"Sabiston 21st ed. (2022); Schwartz's Principles of Surgery 11th ed. (2019)",
  opinion:"",
  variants:["ผู้หญิงอายุ 78 ปี SBO + CT เห็น pneumobilia และนิ่วใน terminal ileum → enterolithotomy","ผู้ป่วยอาเจียนมาก CT เห็นนิ่วใหญ่ติดที่ duodenal bulb + pneumobilia → Bouveret syndrome","ผู้สูงอายุท้องผูกเรื้อรัง ท้องอืดมาก film เห็น coffee bean sign → sigmoid volvulus → endoscopic detorsion"]}),
A({page:6, page2:6, orig:"30", kimg:KI("31"),
  stem:"Who is NOT contraindicated for solid organ donation?",
  gray:"30. Who is not contraindicated for solid organ donation. — A. HIV infection B. Malignant melanoma C. Persistent hypertension D. Creutzfeldt-Jakob disease",
  opts:["A donor with HIV infection","A donor with malignant melanoma","A donor with persistent hypertension","A donor with Creutzfeldt-Jakob disease","A donor with active disseminated tuberculosis"],
  ans:2, key:"C A donor with persistent hypertension"+KS,
  interp:"ถามว่าข้อใดไม่ใช่ข้อห้ามของการบริจาคอวัยวะ — แยก absolute contraindication (ถ่ายทอดโรคร้ายแรงไปผู้รับ) ออกจากภาวะที่เพียงทำให้คุณภาพอวัยวะลดลง",
  why:"<b>Hypertension ไม่ใช่ข้อห้าม</b> (อยู่ในกลุ่ม 'need to be risk assessed' ของสไลด์) — อาจทำให้ไตของผู้บริจาคมีคุณภาพลดลง (เป็นปัจจัยใน expanded criteria donor และ KDPI) แต่ยังใช้ได้หลังประเมินอวัยวะ. ข้อห้ามสัมบูรณ์คือภาวะที่ถ่ายทอดสู่ผู้รับแล้วรักษาไม่ได้หรืออันตรายถึงชีวิต: CJD (prion), active HIV ในบริบททั่วไป, malignancy ที่แพร่ทางอวัยวะได้สูง (melanoma, choriocarcinoma) หรือ metastatic cancer, การติดเชื้อที่ยังควบคุมไม่ได้",
  wrong:["HIV ถือเป็น absolute contraindication ในบริบททั่วไป (สไลด์ 'CHUMP' และโน้ตรุ่นพี่) — ยกเว้น HIV+ ไปยังผู้รับ HIV+ ซึ่งทำได้ภายใต้ HOPE Act ของสหรัฐฯ (2013) และในแอฟริกาใต้; ข้อนี้จะไม่ใช่ข้อห้ามถ้าโจทย์ระบุว่าผู้รับก็ติด HIV",
         "Melanoma ถ่ายทอดทางอวัยวะได้สูงมากและอาจกลับเป็นซ้ำหลังปลอดโรคนานหลายปี จึงเป็นข้อห้ามไม่ว่าห่างจากการรักษานานเท่าใด (เช่นเดียวกับ choriocarcinoma); ต่างจาก in situ skin cancer ที่ไม่ใช่ melanoma หรือมะเร็งที่รักษาหายนานแล้วซึ่งพิจารณาได้",
         "CJD เป็น prion disease ที่ถ่ายทอดผ่านเนื้อเยื่อได้ (มีรายงานจาก dura mater และ corneal graft) ไม่มีวิธีฆ่าเชื้อหรือรักษา → absolute contraindication เสมอ",
         "Active TB ที่ยังไม่ได้รักษาเป็นการติดเชื้อที่ควบคุมไม่ได้ จึงเป็นข้อห้าม — ต่างจาก TB ที่รักษาครบแล้ว หรือ latent TB ซึ่งบริจาคได้และให้ผู้รับได้ isoniazid prophylaxis ตามความเหมาะสม"],
  trap:"ใช้เกณฑ์ผู้บริจาคเลือดหรือเกณฑ์ 'สุขภาพดี' มาตัดสิน — ผู้บริจาคอวัยวะหลังเสียชีวิตเป็นผู้สูงอายุ เป็น HT, DM, AKI ได้ ซึ่งไม่ใช่ข้อห้าม",
  summary:["ABSOLUTE contraindications 'CHUMP': CJD, active HIV, uncontrolled infection หรือ donor sepsis ที่ไม่ทราบเชื้อ, metastatic หรือ non-curable malignancy, past malignancy ที่ถ่ายทอดได้สูงไม่ว่าปลอดโรคนานเท่าใด (melanoma, choriocarcinoma)",
    "NOT contraindications 'LIP-HEAD' (ต้องประเมินความเสี่ยง): Localised tumours (kidney, prostate), treated Infections (bacterial, hepatitis B หรือ C, risk factors for HIV), Past malignancy with long cancer-free interval, Hypertension, Elderly (เคยบริจาคจากผู้ป่วยอายุ 80 กว่า), Acute renal failure, Diabetes mellitus",
    "Primary CNS tumor ส่วนใหญ่ (ยกเว้น high grade หรือเคยผ่าตัดหรือ shunt) และ skin cancer ที่ไม่ใช่ melanoma บริจาคได้",
    "HBV+ หรือ HCV+ donor ใช้ได้กับผู้รับที่เหมาะสม (HCV ให้ DAA หลังปลูกถ่าย; HBV ให้ผู้รับที่มีภูมิหรือให้ prophylaxis)",
    "HIV+ donor → HIV+ recipient ทำได้ภายใต้ HOPE Act (สหรัฐฯ 2013)",
    "Hypertension, DM, อายุมาก, Cr สูงจาก AKI ลดคุณภาพไต (expanded criteria donor, KDPI สูง) แต่ไม่ใช่ข้อห้าม",
    "ดูข้อ 4, 23, 24, 73 (transplantation)"],
  notes:"กากบาท C. Persistent hypertension (เลือกเป็นคำตอบ); วงเล็บครอบ A, B, D เขียนว่า '<b>absolute contraindication!</b>'; ใต้ D เขียน 'neurocognitive disease due to prion'; แปะสไลด์ ABSOLUTE 'CHUMP': CJD, active HIV, uncontrolled infection (donor sepsis), metastatic or non-curable malignant disease, past history of malignancy that poses risk for transmission no matter how long the apparent disease-free period (e.g. melanoma, choriocarcinoma) และ NOT CONTRAINDICATIONS (need to be risk assessed) 'LIP-HEAD': localised tumours (kidney, prostate), treated infections (bacterial, hepatitis B or C, risk factors for HIV), past malignancy and a long cancer-free interval (childhood leukaemia, lymphoma), hypertension, elderly (donations have taken place from patients in early 80's), acute renal failure, diabetes mellitus",
  mnemonic:"ห้าม = '<b>CHUMP</b>' (CJD, HIV, Uncontrolled infection, Metastatic, Past melanoma or choriocarcinoma); ไม่ห้าม = '<b>LIP-HEAD</b>'",
  guide:"UK NHSBT/SaBTO Microbiological Safety Guidelines (2020); Council of Europe Guide to the Quality and Safety of Organs for Transplantation 8th ed. (2022); HIV Organ Policy Equity (HOPE) Act 2013",
  opinion:"เห็นด้วยกับคีย์ (ความมั่นใจสูง). ข้อสังเกต: HIV ไม่ใช่ absolute contraindication อีกต่อไปในบางประเทศ (HIV+ → HIV+) แต่ในบริบทข้อสอบทั่วไปยังถือเป็นข้อห้าม",
  variants:["ผู้บริจาคสมองตายอายุ 75 ปี เป็น DM และ HT → ไม่ใช่ข้อห้าม ประเมินอวัยวะรายตัว","ผู้บริจาคเคยตัด melanoma เมื่อ 15 ปีก่อน → ห้ามบริจาค","ผู้บริจาค HCV antibody+ → ให้ผู้รับได้ร่วมกับ DAA"]}),
A({page:6, page2:6, orig:"31", kimg:KI("32"),
  stem:"What is the expected urine output for a patient weighing 50 kg?",
  gray:"31. คาดหวังปัสสาวะ นน 50 กก — A. 20-25 cc/hr B. 30-50cc/hr C. 2-3cc/kg/hr D. 3-5cc/kg/hr",
  opts:["20–25 mL/hr","30–50 mL/hr","2–3 mL/kg/hr","3–5 mL/kg/hr","100–150 mL/hr"],
  ans:1, key:"B 30–50 mL/hr"+KS,
  interp:"ถามเป้า urine output ที่บ่งว่า end-organ perfusion และ volume status เพียงพอในผู้ใหญ่",
  why:"เป้าปัสสาวะผู้ใหญ่ = <b>0.5–1 mL/kg/hr</b> → 50 kg × 0.5–1 = <b>25–50 mL/hr</b> ซึ่งตรงกับช่วง 30–50 mL/hr ที่ใช้ทั่วไปในผู้ใหญ่ (เช่นเป้าใน burn resuscitation ตาม ABA). ต่ำกว่า 0.5 mL/kg/hr ต่อเนื่อง 6 ชม. = oliguria ตามเกณฑ์ KDIGO AKI",
  wrong:["20–25 mL/hr = ราว 0.4–0.5 mL/kg/hr ต่ำกว่าหรือแค่ขอบล่าง — ต่ำกว่า 0.5 mL/kg/hr นาน 6 ชม. เข้าเกณฑ์ oliguria (KDIGO stage 1) จึงไม่ใช่ค่าที่คาดหวัง",
         "2–3 mL/kg/hr = 100–150 mL/hr สูงเกินเป้าปกติ — สะท้อน over-resuscitation หรือ diuresis (osmotic diuresis จาก hyperglycemia, DI, post-obstructive diuresis); ค่าทำนองนี้คือ<b>ปริมาณ fluid</b> ไม่ใช่ urine output (Parkland 4 mL/kg/%TBSA, ABA 2–4 mL/kg/%TBSA)",
         "3–5 mL/kg/hr สูงมาก = polyuria (DI, osmotic diuresis) ไม่ใช่เป้า resuscitation",
         "100–150 mL/hr = 2–3 mL/kg/hr สูงเกินเป้าในผู้ใหญ่ทั่วไป — เป้าสูงขึ้นใช้ในบางภาวะ: myoglobinuria หรือ electrical injury ตั้งเป้า 75–100 mL/hr ในผู้ใหญ่ (ABLS) จนปัสสาวะใส, rhabdomyolysis หรือ crush syndrome ตั้งเป้าสูงกว่านี้"],
  trap:"สับสนระหว่าง <b>ปริมาณสารน้ำที่ให้</b> (mL/kg/%TBSA) กับ <b>urine output ที่ต้องการ</b> (mL/kg/hr); และเด็กใช้ 1 mL/kg/hr ไม่ใช่ 0.5",
  summary:["Urine output เป้า: ผู้ใหญ่ 0.5–1 mL/kg/hr (≈30–50 mL/hr); เด็ก ≥1 mL/kg/hr (ราว 1–1.5 ใน burn เด็ก); ทารก 1–2 mL/kg/hr",
    "Myoglobinuria หรือ high-voltage electrical injury: ผู้ใหญ่ตั้งเป้า 75–100 mL/hr จนปัสสาวะใส",
    "Oliguria ตาม KDIGO: &lt;0.5 mL/kg/hr ≥6 ชม. = stage 1, ≥12 ชม. = stage 2, &lt;0.3 mL/kg/hr ≥24 ชม. หรือ anuria ≥12 ชม. = stage 3",
    "Burn resuscitation: Parkland 4 mL/kg/%TBSA หรือ ABA 2–4 mL/kg/%TBSA ของ Ringer lactate ใน 24 ชม. (ครึ่งแรกใน 8 ชม. นับจากเวลาเกิดเหตุ) แล้วปรับอัตราตาม urine output",
    "Oliguria หลังผ่าตัด: แยก prerenal (hypovolemia — ดูชีพจร BP CVP, fluid challenge), renal, postrenal (เช็ก Foley อุดตันก่อน)",
    "การวัดต้องใส่ Foley catheter และบันทึกทุกชั่วโมงในผู้ป่วยที่ resuscitation",
    "ดูข้อ 16, 22, 25, 49 (fluids/electrolytes)"],
  notes:"กากบาท B. 30–50 cc/hr (เลือกเป็นคำตอบ) + เขียน '<b>0.5–1 ml/kg/hr</b>' และ '<b>25–50 ml/hr</b>'; ด้านบนเป็นส่วนต่อของสไลด์ CHUMP/LIP-HEAD จากข้อก่อนหน้า",
  mnemonic:"'ครึ่งถึงหนึ่ง' — 0.5–1 mL/kg/hr ในผู้ใหญ่, 1 ในเด็ก",
  guide:"KDIGO Clinical Practice Guideline for Acute Kidney Injury 2012; ABA Advanced Burn Life Support (ABLS) Provider Manual 2018; ATLS 10th ed. (2018)",
  opinion:"",
  variants:["ผู้ป่วย burn 60 kg TBSA 40% → Parkland 9,600 mL ใน 24 ชม. ครึ่งแรกใน 8 ชม. ปรับตามปัสสาวะ 30–60 mL/hr","เด็ก 20 kg หลังผ่าตัด ปัสสาวะที่ต้องการ → ≥20 mL/hr","ผู้ป่วย high-voltage electrical injury ปัสสาวะสีน้ำตาลเข้ม → เป้า 75–100 mL/hr"]}),
A({page:7, page2:7, orig:"32", kimg:KI("33"),
  stem:"A patient develops a fever on postoperative day 5. The urinary catheter was removed on day 2, oral diet was started on day 3, and the patient has been ambulating since day 4. Which is the most likely cause of the fever?",
  gray:"32. post op fever day 5. remove urinary catheter on day 2, start your oral diet day 3, ambulate ได้ day 4. Which is the most unlikely cause — A. Atelectasis B. UTI C. Wound infection D. DVT E. Thrombophlebitis",
  opts:["Atelectasis","UTI","Wound infection","DVT","Thrombophlebitis"],
  ans:2, key:"C Wound infection"+KS, flag:"⚠ ไฟล์โจทย์เขียน '<b>most unlikely</b> cause' แต่รุ่นพี่ขีดฆ่าคำว่า 'un' แล้ววง C — จึงใช้ stem 'most likely'; ถ้าข้อสอบจริงถาม 'unlikely' คำตอบคือ Atelectasis",
  interp:"ใช้ timing ของ postoperative fever: day 5 + ปัจจัยเสี่ยงแต่ละอย่างถูกตัดไปแล้ว (เอาสายสวนออกแล้ว, กินได้, เดินได้) → เหลือสาเหตุไหน",
  why:"ไข้หลังผ่าตัดตามเวลา: day 0–2 → inflammatory response จากการผ่าตัด (atelectasis เป็นสิ่งที่พบร่วมแต่ไม่ได้พิสูจน์ว่าเป็นสาเหตุของไข้); day 3–5 → UTI, pneumonia, thrombophlebitis; <b>day 5–7 → wound infection (SSI)</b> และ anastomotic leak/abscess; หลัง day 7 → DVT/PE, deep abscess. ในโจทย์นี้ถอด Foley ตั้งแต่ day 2 (ความเสี่ยง CAUTI ลดลง), ลุกเดินได้ day 4 (DVT ลดลง) → สาเหตุที่เข้ากับ day 5 ที่สุดคือ <b>wound infection</b> → ตรวจแผลก่อน",
  wrong:["Atelectasis พบบ่อย day 1–2 และหลักฐานปัจจุบันชี้ว่า<b>ไม่ได้เป็นสาเหตุของไข้</b>โดยตรง — ผู้ป่วยกินได้ เดินได้ day 5 ยิ่งไม่เข้า; ถ้าข้อสอบถาม 'most unlikely' ช้อยนี้คือคำตอบ",
         "UTI (CAUTI) พบ day 3–5 แต่ความเสี่ยงสัมพันธ์กับระยะเวลาคาสาย — ถอด Foley ตั้งแต่ day 2 จึงน้อยลง (รุ่นพี่: 'remove cath ไปแล้ว?'); จะเป็นคำตอบถ้ายังคาสายถึง day 4–5 และมี dysuria หรือ pyuria",
         "DVT มักทำไข้ต่ำ ๆ หลัง day 7 และพบน้อยเมื่อลุกเดินได้ — จะเป็นคำตอบถ้าโจทย์ให้ขาบวมข้างเดียวในผู้ป่วยนอนนาน ไม่ได้ป้องกัน หรือเป็นมะเร็ง",
         "Thrombophlebitis ที่ตำแหน่งเปิดเส้นพบ day 3–5 ได้ — จะเป็นคำตอบถ้าโจทย์บอกว่ามีเส้นเลือดแข็งเป็นลำ แดง กดเจ็บที่ตำแหน่ง IV cannula"],
  trap:"อ่าน 'unlikely' ไม่ทัน หรือไม่ใช้ข้อมูลตัดทิ้ง (ถอดสาย, เดินได้) ที่โจทย์ให้มา; และจำ 'atelectasis = ไข้ day 1' แบบเก่าซึ่งปัจจุบันถือว่าไม่ใช่สาเหตุพิสูจน์ได้",
  summary:["ไข้หลังผ่าตัด 'Wind–Water–Wound–Walking–Wonder drugs': day 1–2 Wind (pulmonary; ไข้ช่วงนี้ส่วนใหญ่เป็น inflammatory response), day 3–5 Water (UTI) และ IV line, day 5–7 Wound (SSI), day 5–7 ขึ้นไป anastomotic leak/intra-abdominal abscess, &gt;7 วัน Walking (DVT/PE), ทุกช่วง Wonder drugs (drug fever) และ transfusion",
    "ไข้ภายใน 48 ชม. ส่วนใหญ่ไม่ต้อง workup มาก ยกเว้นสงสัย necrotizing soft-tissue infection (Clostridium, group A strep) หรือ anastomotic leak เร็ว",
    "SSI: superficial incisional (ผิวหนัง/subcutaneous), deep incisional (fascia/กล้ามเนื้อ), organ/space — นับภายใน 30 วัน หรือ 90 วันถ้ามี implant (CDC NHSN)",
    "รักษา superficial SSI: เปิดแผลระบายหนอง ล้างทำแผล; ให้ antibiotic ถ้ามี cellulitis รอบแผลหรือ systemic sign",
    "CAUTI ลดได้โดยถอด Foley เร็วที่สุด (ภายใน 24–48 ชม. ในผ่าตัดส่วนใหญ่)",
    "Atelectasis ป้องกันด้วย incentive spirometry, ลุกนั่งเดินเร็ว, คุมปวด",
    "ดูข้อ 37 (mesh infection หลัง herniorrhaphy day 5), 35 (DVT prophylaxis)"],
  notes:"ไฟล์โจทย์เขียน 'most unlikely cause' — รุ่นพี่<b>ขีดฆ่าคำว่า 'un'</b> และ<b>กากบาท A. Atelectasis</b> แล้ว<b>วง C. Wound infection</b>; เลขข้อไฮไลต์เหลือง (ไม่ชัวร์); วงคำว่า 'day 5' และ 'on day 2'; ข้าง B UTI เขียน 'remove cath ไปแล้ว?'; ข้าง D DVT เขียน 'ambulate ได้ น่าจะดีแล้ว'",
  mnemonic:"5W: Wind (1–2), Water (3–5), Wound (5–7), Walking (&gt;7), Wonder drugs (ทุกเวลา)",
  guide:"Sabiston 21st ed. (2022); CDC NHSN Surgical Site Infection Event 2024",
  opinion:"⚠ ต้นฉบับถาม 'most unlikely cause' — ถ้าตีความตามตัวอักษร คำตอบคือ Atelectasis (ไข้ day 5 ในผู้ป่วยที่กินได้ เดินได้ และ atelectasis ไม่ได้เป็นสาเหตุของไข้ที่พิสูจน์ได้). รุ่นพี่ขีดคำว่า 'un' ออกแล้วตอบ Wound infection แสดงว่าเชื่อว่าคนจดโจทย์จดผิดหรือข้อสอบถาม 'most likely'. เราเลือกตามคีย์โดยใช้ stem 'most likely' → Wound infection (เข้ากับ day 5–7 และปัจจัยอื่นถูกตัดทิ้ง). ความมั่นใจปานกลาง: ถ้าในข้อสอบจริงเห็นคำว่า 'unlikely' ให้ตอบ Atelectasis",
  variants:["ไข้ day 1 หลัง laparotomy ปอดฟังมี crepitation เล็กน้อย → สังเกตอาการ, incentive spirometry, ส่วนใหญ่เป็น inflammatory response","ไข้ day 6 หลัง colectomy ปวดท้องมาก หัวใจเต้นเร็ว → anastomotic leak → CT","ไข้ day 10 ขาซ้ายบวม → DVT → compression duplex US"]}),
A({page:7, page2:7, orig:"33", kimg:KI("34"),
  stem:"A patient presents with hematemesis from esophageal varices. Resuscitation and sclerotherapy were performed. He now bleeds again. What should be done?",
  gray:"33. Patient hematemesis จาก esophageal varice. Resus กับ sclerotherapy ไปแล้ว. ตอนนี้ bleed อีกรอบ. ให้ทำอะไร. — A. Band ligation B. TIPS C. portocaval shunt D. Distal splenorenal shunt",
  opts:["Band ligation","TIPS","Portocaval shunt","Distal splenorenal shunt","Balloon tamponade as definitive therapy"],
  ans:0, key:"A Band ligation"+KS,
  interp:"Variceal rebleeding หลัง endoscopic therapy ครั้งแรก → ขั้นต่อไปตาม algorithm คืออะไร",
  why:"ตาม algorithm ที่รุ่นพี่แปะ: rebleeding หลัง endoscopic therapy ครั้งแรก → <b>repeat endoscopic therapy</b> โดย <b>EVL</b> เป็นวิธีเลือก (ดีกว่า sclerotherapy: rebleeding, stricture, ulcer และ complication น้อยกว่า) ร่วมกับ vasoactive drug (terlipressin, octreotide หรือ somatostatin 2–5 วัน) + ceftriaxone prophylaxis. Baveno VI/VII: rebleeding ช่วง 5 วันแรกให้ลอง endoscopic therapy ครั้งที่สองได้ ถ้าเลือดออกรุนแรงหรือยังคุมไม่ได้หลัง vasoactive + endoscopic → <b>rescue TIPS</b>",
  wrong:["TIPS เป็นขั้นถัดไปเมื่อ endoscopic therapy ครั้งที่สองล้มเหลว (uncontrolled หรือ further bleeding) หรือเลือดออกรุนแรง = rescue TIPS; และ <b>pre-emptive TIPS ภายใน 72 ชม.</b> (ดีที่สุดภายใน 24 ชม.) ในผู้ป่วยเสี่ยงสูง (Child C 10–13 หรือ Child B &gt;7 ที่มี active bleeding ขณะส่องกล้อง) — ถ้าโจทย์บอกว่าทำ EVL ซ้ำแล้วยังออก → ตอบ TIPS",
         "Total portosystemic shunt ลด portal pressure ได้ดีแต่ encephalopathy และ liver failure สูง (เลือดไม่ผ่านตับเลย) — ปัจจุบันถูก TIPS แทนเกือบทั้งหมด ใช้เมื่อ TIPS ทำไม่ได้หรือล้มเหลวในศูนย์ที่มีความชำนาญ",
         "Selective shunt (Warren) ลด pressure เฉพาะ gastrosplenic bed ยังรักษา portal flow ไปตับ — encephalopathy น้อยกว่า ใช้ในผู้ป่วย Child A ที่ rebleeding ซ้ำแบบ elective หรือ non-cirrhotic portal hypertension; ไม่ใช่ขั้นแรกของ acute rebleeding",
         "Balloon tamponade (Sengstaken-Blakemore, Minnesota) เป็น<b>bridge</b>ไม่เกิน 24 ชม. เมื่อเลือดออกควบคุมไม่ได้ระหว่างรอ TIPS หรือ endoscopy — rebleeding สูงเมื่อปล่อยลม เสี่ยง esophageal perforation และ aspiration; esophageal stent (SX-Ella Danis) ใช้แทนได้"],
  trap:"กระโดดไป TIPS หรือ shunt surgery ทันทีที่ rebleed — ต้องลอง endoscopic therapy ซ้ำก่อน (ยกเว้นเลือดออกรุนแรงคุมไม่ได้); และอย่าลืมว่า EVL ดีกว่า sclerotherapy",
  summary:["Acute variceal bleeding: airway protection, restrictive transfusion (Hb เป้า 7–8 g/dL), vasoactive drug ทันทีที่สงสัย (terlipressin, octreotide, somatostatin 2–5 วัน), ceftriaxone 1 g/วัน (สูงสุด 7 วัน), ICU",
    "EGD ภายใน 12 ชม. → esophageal varices: EVL; gastric varices (GOV2, IGV1): cyanoacrylate glue injection หรือ TIPS/BRTO",
    "Pre-emptive TIPS ภายใน 72 ชม. (ดีที่สุด &lt;24 ชม.) ใน Child C 10–13 หรือ Child B &gt;7 ที่มี active bleeding ขณะส่องกล้อง (Baveno VII)",
    "Rebleeding ช่วงแรก → repeat EVL; uncontrolled หรือ further bleeding → balloon tamponade หรือ esophageal stent เป็น bridge → rescue TIPS → shunt surgery ถ้า TIPS ทำไม่ได้",
    "Secondary prophylaxis: non-selective beta-blocker (propranolol หรือ carvedilol) + EVL ทุก 1–4 สัปดาห์จน varices หมด; ล้มเหลว → TIPS",
    "Shunt surgery: total (portocaval) → encephalopathy สูง; selective (distal splenorenal, Warren) → รักษา hepatic portal flow ใช้ใน Child A; transplant เป็น definitive therapy ใน decompensated cirrhosis",
    "ดูข้อ 59 (anatomy ของ esophageal varices: left gastric vein), 71 (UGIB จาก varices)"],
  notes:"กากบาท A. Band ligation (เลือกเป็นคำตอบ); ด้านบนเขียน 'sclerotherapy = ฉีด sclerosing agent เข้า varix'; ข้าง B เขียน 'Transjugular intrahepatic portosystemic shunt'; แปะ flowchart suspected variceal bleeding: airway protection, PRBC transfusion, vasoactive agents, antibiotics, medical ICU admission → EGD within 12 h → esophageal variceal bleeding: endoscopic variceal ligation → no further bleeding: secondary prophylaxis NSBBs or EVL; rebleeding: repeat EVL → further bleeding → TIPS; uncontrolled: balloon tamponade or metal stent → TIPS → (uncontrolled bleeding or TIPS contraindicated) porto-caval shunt surgery; failure or intolerant of NSBBs/EVL → TIPS; gastric variceal bleeding → endoscopic or EUS glue injection → eradication by glue injection; glue injection unavailable/unsuccessful → TIPS",
  mnemonic:"'Band → Band → TIPS → Shunt' (ระหว่างรอใช้ balloon เป็นสะพาน)",
  guide:"Baveno VII Renewing Consensus in Portal Hypertension 2022; AASLD Guidance on Risk Stratification and Management of Portal Hypertension and Varices in Cirrhosis 2024",
  opinion:"เห็นด้วยกับคีย์: ต้นฉบับบอกว่าเพิ่งทำ sclerotherapy ครั้งแรก จึงขั้นต่อไปคือ endoscopic therapy ซ้ำด้วย EVL. ถ้าโจทย์บอกว่าเลือดออกมากคุมไม่ได้หรือ rebleed หลัง EVL ครั้งที่สอง → TIPS; ถ้า Child C 10–13 ตั้งแต่แรก → pre-emptive TIPS",
  variants:["Rebleed หลัง EVL ครั้งที่สองแม้ได้ octreotide → rescue TIPS","Child C 11 มี active bleeding ขณะ EGD ทำ EVL หยุดได้ → pre-emptive TIPS ภายใน 72 ชม.","เลือดออกจาก varices มากคุมไม่ได้ระหว่างรอ TIPS → balloon tamponade เป็น bridge"]}),
A({page:7, page2:7, orig:"34", kimg:KI("35"),
  stem:"A patient with breast cancer undergoes breast surgery with a skin flap. Which of the following helps prevent DVT?",
