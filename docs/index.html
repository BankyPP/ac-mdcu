  mnemonic:"ฝีตับไทย: เบาหวาน → Klebsiella; ชาวนาอีสาน → melioidosis; ชายดื่มเหล้า ก้อนเดียว → amebic",
  guide:"Sabiston Textbook of Surgery 21st ed. 2022 — The Liver (hepatic abscess)",
  opinion:"เห็นด้วยกับคีย์ A เมื่อมีข้อมูลทางคลินิก (มั่นใจสูง). ต้นฉบับให้แค่ 'Pale, rim enhance 10 cm, mix-solid, cystic' ซึ่งเข้าได้ทั้ง abscess และเนื้องอกที่มี hemorrhage หรือ necrosis (ซึ่งก็ heterogeneous และมีขอบ enhance ได้) รุ่นพี่จึงไฮไลต์ว่าไม่ชัวร์ — จึงเติมไข้, RUQ pain 1 สัปดาห์ และ leukocytosis. ถ้า 'Pale' ในต้นฉบับหมายถึงผู้ป่วยซีด + ปวดเฉียบพลัน + Hb ลดในผู้ป่วย cirrhosis หรือกินยาคุม จะตอบ tumor hemorrhage",
  variants:["Thai rice farmer with DM, fever, multiple small liver and splenic abscesses → melioidosis","Young man, single right-lobe abscess, anchovy-paste aspirate → amebic liver abscess, metronidazole","Liver abscess 8 cm not improving with IV antibiotics → percutaneous catheter drainage"]}),
A({page:10, page2:10, orig:"50", kimg:KI("51"),
  stem:"Which of the following does not indicate the severity of acute pancreatitis?",
  gray:"50. อันไหนบอกseverity ของ acute pan ไม่ได้ — A. Amylase B. WBC count C. Glucose D. Hypocalcemia",
  opts:["Amylase","WBC count","Glucose","Hypocalcemia","Blood urea nitrogen"],
  ans:0, key:"A Amylase"+KS,
  interp:"ถามตัวแปรที่ใช้วินิจฉัยแต่ไม่ได้บอกความรุนแรงของ acute pancreatitis",
  why:"<b>Amylase</b> (และ lipase) ใช้ <b>วินิจฉัย</b> (≥3 เท่าของ upper limit of normal) แต่ระดับไม่สัมพันธ์กับความรุนแรงหรือ prognosis และไม่ต้องตรวจซ้ำเพื่อติดตาม; ส่วน WBC, glucose (Ranson on admission), calcium (Ranson ที่ 48 ชม.) และ BUN (BISAP, Ranson ที่ 48 ชม.) อยู่ใน scoring system ที่ใช้ประเมินความรุนแรง",
  wrong:[
    "WBC count: Ranson on admission (&gt;16,000 non-gallstone, &gt;18,000 gallstone) และเป็นส่วนหนึ่งของ SIRS ใน BISAP — จะเป็นคำตอบถ้าถามตัวที่ไม่อยู่ใน Ranson criteria ช่วง 48 ชม.",
    "Glucose: Ranson on admission (&gt;200 mg/dL non-gallstone, &gt;220 gallstone) — จะเป็นคำตอบถ้าถามตัวที่ไม่อยู่ใน BISAP",
    "Hypocalcemia: Ranson ที่ 48 ชม. (Ca &lt;8 mg/dL) สะท้อน fat saponification และความรุนแรง — จะเป็นคำตอบถ้าถามตัวที่ไม่อยู่ใน Ranson on admission",
    "Blood urea nitrogen: BISAP (BUN &gt;25 mg/dL) และ Ranson ที่ 48 ชม. (BUN เพิ่ม &gt;5 mg/dL); BUN ที่สูงขึ้นใน 24 ชม. แรกทำนาย mortality — จะเป็นคำตอบถ้าถามตัวที่ไม่อยู่ใน Ranson on admission"],
  trap:"คิดว่า amylase หรือ lipase ยิ่งสูงยิ่งรุนแรง — ไม่จริง; และ amylase อาจปกติได้ใน hypertriglyceridemia-induced หรือ alcohol-related pancreatitis ที่มาช้า (lipase ไวกว่า)",
  summary:[
    "Diagnosis (Revised Atlanta 2012): ≥2 ใน 3 — epigastric pain ร้าวไปหลัง, lipase หรือ amylase ≥3×ULN, imaging (CECT, MRI, US) เข้าได้",
    "Ranson non-gallstone on admission: age &gt;55, WBC &gt;16,000, glucose &gt;200 mg/dL, LDH &gt;350 IU/L, AST &gt;250 IU/L; ภายใน 48 ชม.: Hct ลด &gt;10%, BUN เพิ่ม &gt;5 mg/dL, Ca &lt;8 mg/dL, PaO2 &lt;60 mmHg, base deficit &gt;4 mEq/L, fluid sequestration &gt;6 L; ≥3 ข้อ = severe (gallstone version ใช้ age &gt;70, WBC &gt;18,000, glucose &gt;220, LDH &gt;400)",
    "BISAP (ภายใน 24 ชม.): BUN &gt;25 mg/dL, Impaired mental status, SIRS, Age &gt;60, Pleural effusion; ≥3 = mortality สูง",
    "Revised Atlanta severity: mild = ไม่มี organ failure และไม่มี local หรือ systemic complication; moderately severe = transient organ failure &lt;48 ชม. และ/หรือ local complication หรือ comorbidity กำเริบ; severe = persistent organ failure &gt;48 ชม. (modified Marshall score ≥2 ในระบบหายใจ หัวใจ หรือไต)",
    "Marker อื่น: Hct &gt;44% แรกรับ, CRP &gt;150 mg/L ที่ 48 ชม., APACHE II ≥8, CT severity index (Balthazar + necrosis), obesity",
    "Local complications: APFC (&lt;4 สัปดาห์) → pseudocyst (&gt;4 สัปดาห์ ไม่มี necrosis); ANC (&lt;4 สัปดาห์) → walled-off necrosis (&gt;4 สัปดาห์); infected necrosis → step-up approach (antibiotics → percutaneous หรือ endoscopic drainage → necrosectomy)",
    "ดูข้อ 13, 58 (pancreas)"],
  notes:"รุ่นพี่ขีด <b>A</b> (Amylase). แปะสไลด์ Ranson Prognostic Criteria for Non-Gallstone Pancreatitis และ for Gallstone Pancreatitis (Box 55-1, 55-2; มีลายมือเล็ก ๆ บนสไลด์อ่านไม่ชัด), สไลด์ BISAP scoring system (BUN &gt;25 mg/dL, impaired mental status, SIRS, age &gt;60, pleural effusion) และสไลด์ Atlanta Criteria for Acute Pancreatitis (Box 55-3: organ failure, systemic complications, local complications — necrosis, abscess, pseudocyst) (สไลด์ BISAP และ Atlanta ต่อไปถึงภาพของข้อถัดไป)",
  mnemonic:"BISAP = BUN, Impaired mental, SIRS, Age, Pleural effusion; 'Amylase วินิจฉัย ไม่ได้วัดความรุนแรง'",
  guide:"Revised Atlanta Classification of Acute Pancreatitis 2012; ACG Clinical Guideline: Management of Acute Pancreatitis 2024",
  opinion:"",
  variants:["Which is a component of BISAP? → BUN &gt;25 mg/dL","Which Ranson criterion is assessed at 48 hours? → serum Ca &lt;8 mg/dL","Severe acute pancreatitis by revised Atlanta → persistent organ failure &gt;48 ชม."]}),
A({page:10, page2:10, orig:"51", kimg:KI("52"),
  stem:"Which of the following indicates malnutrition?",
  gray:"51 ข้อไหนคือmalnutrition — A. Glucose&lt;90 B. นน&lt;50kg C. นนลด 10%ใน3เดือน",
  opts:["Glucose below 90 mg/dL","Body weight below 50 kg","10% weight loss in 3 months","Serum albumin 3.8 g/dL","BMI 22 kg/m2"],
  ans:2, key:"C 10% weight loss in 3 months"+KS,
  interp:"ถามเกณฑ์ที่บอกภาวะทุพโภชนาการ — ตัวชี้วัดที่ดีที่สุดคืออัตราการลดน้ำหนักโดยไม่ตั้งใจเทียบกับเวลา",
  why:"GLIM 2019 phenotypic criterion: unintentional weight loss &gt;5% ภายใน 6 เดือน หรือ &gt;10% เกิน 6 เดือน → ลด <b>10% ใน 3 เดือน</b>เข้าเกณฑ์และจัดเป็น severe (stage 2: &gt;10% ภายใน 6 เดือน); ASPEN/AND 2012 ในโรคเฉียบพลัน ลด &gt;7.5% ใน 3 เดือน = severe malnutrition; ESPEN surgery ถือว่าลด &gt;10–15% ใน 6 เดือนเป็น severe nutritional risk ก่อนผ่าตัด",
  wrong:[
    "Glucose below 90 mg/dL: อยู่ในช่วงปกติของ fasting glucose และระดับน้ำตาลไม่ใช่เกณฑ์วินิจฉัย malnutrition ใน guideline ใด — ไม่มีบริบทที่เป็นคำตอบ",
    "Body weight below 50 kg: น้ำหนักสัมบูรณ์ไม่บอกอะไรถ้าไม่รู้ส่วนสูง (คนสูง 150 cm หนัก 48 kg มี BMI ราว 21 ปกติ) — จะเป็นคำตอบถ้าเปลี่ยนเป็น BMI &lt;18.5 kg/m2",
    "Serum albumin 3.8 g/dL: เป็นค่าปกติ และ albumin เป็น negative acute phase reactant สะท้อน inflammation มากกว่า nutrition — ESPEN ใช้ albumin &lt;3.0 g/dL (ไม่มีโรคตับหรือไต) เป็นเกณฑ์ severe nutritional risk ก่อนผ่าตัด จึงจะเป็นคำตอบถ้า albumin &lt;3.0",
    "BMI 22 kg/m2: ปกติ — GLIM ใช้ BMI &lt;20 (อายุ &lt;70) หรือ &lt;22 (≥70) ในคนตะวันตก และ &lt;18.5 (อายุ &lt;70) หรือ &lt;20 (≥70) ในเอเชีย; จะเป็นคำตอบถ้า BMI &lt;18.5 ในคนเอเชียอายุ &lt;70"],
  trap:"ใช้น้ำหนักสัมบูรณ์หรือ albumin ตัดสิน — สิ่งที่สำคัญคืออัตราการลดน้ำหนักโดยไม่ตั้งใจ ซึ่งบอกทั้งการวินิจฉัยและความรุนแรง",
  summary:[
    "ขั้นตอน: screening (NRS-2002, MUST, SPENT ในไทย) → assessment; GLIM 2019 วินิจฉัยเมื่อมี ≥1 phenotypic + ≥1 etiologic criterion",
    "GLIM phenotypic: weight loss &gt;5% ใน 6 เดือน หรือ &gt;10% เกิน 6 เดือน; low BMI; reduced muscle mass; etiologic: กินได้ ≤50% ของความต้องการ &gt;1 สัปดาห์ หรือกินลดลงใด ๆ &gt;2 สัปดาห์ หรือ malabsorption; inflammation หรือ disease burden",
    "GLIM severe (stage 2): weight loss &gt;10% ใน 6 เดือน หรือ &gt;20% เกิน 6 เดือน",
    "ESPEN surgery: severe nutritional risk = weight loss &gt;10–15% ใน 6 เดือน, BMI &lt;18.5, SGA grade C หรือ NRS ≥5, albumin &lt;30 g/L (ไม่มี hepatic หรือ renal dysfunction) → nutrition therapy 7–14 วันก่อนผ่าตัดใหญ่ (enteral ก่อน)",
    "SPENT ของไทย 4 คำถาม: น้ำหนักลดโดยไม่ตั้งใจใน 6 เดือน, กินน้อยลงกว่าปกติ &gt;7 วัน, BMI &lt;18.5 หรือ ≥25, มีภาวะวิกฤตหรือกึ่งวิกฤต; ตอบใช่ ≥2 ข้อ → ประเมินต่อด้วย NAF หรือ NT",
    "Albumin และ prealbumin สะท้อน inflammation มากกว่าภาวะโภชนาการ แต่ albumin ต่ำทำนาย postoperative complication",
    "Refeeding syndrome ในผู้ป่วยขาดอาหารรุนแรง: hypophosphatemia, hypokalemia, hypomagnesemia, thiamine deficiency → เริ่มให้อาหารช้า ๆ + thiamine"],
  notes:"รุ่นพี่ขีด <b>C</b> (นน ลด 10% ใน 3 เดือน) ด้วยหมึกแดง. แปะสไลด์ 'แนวทางปฏิบัติของการคัดกรองและการประเมินภาวะโภชนาการที่เหมาะสมสำหรับประเทศไทย': ผู้ป่วยทุกรายที่รับไว้ → คัดกรองด้วย 4 คำถาม (1) น้ำหนักตัวลดลงโดยไม่ได้ตั้งใจในช่วง 6 เดือน (2) ได้รับอาหารน้อยกว่าที่เคยได้ เกิน 7 วัน (3) ดัชนีมวลกาย &lt;18.5 หรือ ≥25 (4) มีภาวะวิกฤตหรือกึ่งวิกฤต → ใช่ ≥2 ข้อ ประเมินต่อด้วย NAF หรือ NT → ความเสี่ยงต่ำ (NAF A, NT 1–2) ประเมินซ้ำใน 7 วัน; ความเสี่ยงปานกลาง (NAF B, NT 3); ความเสี่ยงสูง (NAF C, NT 4) → ส่งนักกำหนดอาหาร/ทีมโภชนบำบัด (ข้อความในกล่องผลลัพธ์อ่านไม่ชัดทั้งหมด); มุมขวาบนเป็นสไลด์ BISAP และ Atlanta ของข้อก่อนหน้า",
  mnemonic:"'ลดเร็ว ลดมาก' สำคัญกว่าน้ำหนักตอนนี้",
  guide:"GLIM Criteria for the Diagnosis of Malnutrition 2019; ESPEN Guideline: Clinical Nutrition in Surgery 2021; ASPEN/AND Consensus Statement on Adult Malnutrition 2012",
  opinion:"",
  variants:["Preoperative patient lost 12% in 4 months with albumin 2.8 g/dL → เลื่อนผ่าตัด 7–14 วันเพื่อให้ nutrition therapy","Which is not a GLIM phenotypic criterion? → serum albumin","Thai SPENT positive 2 items → ประเมินต่อด้วย NAF หรือ NT"]}),
A({page:11, page2:11, orig:"52", kimg:KI("53"),
  stem:"A patient with diabetes takes aspirin 325 mg daily for primary prevention and has no history of coronary stent placement. He is scheduled for elective hernia repair. What is the most appropriate plan for the aspirin?",
  gray:"52.DM,on ยา ASA gr 5จะ elective hernia — A. หยุด 7 วัน B. ไม่ต้องหยุด C. Bridgingด้วย",
  opts:["Stop 7 days before surgery","Continue without interruption","Bridge with heparin","Stop 1 day before surgery","Switch to clopidogrel"],
  ans:0, key:"A Stop 7 days before surgery"+KS, flag:"⚠ เติม primary prevention + no coronary stent (ต้นฉบับไม่บอกข้อบ่งชี้ของ aspirin); guideline ปัจจุบันยอมให้ continue aspirin ได้ในหลายกรณี — ดู opinion",
  interp:"ASA gr 5 = aspirin 5 grains = 325 mg; ใช้เพื่อ primary prevention (ไม่มี CAD, stent, stroke) → ประโยชน์ต่อหัวใจช่วงผ่าตัดน้อย แต่เพิ่ม bleeding; elective surgery จึงหยุดได้",
  why:"Aspirin acetylate COX-1 แบบ <b>irreversible</b> → platelet เสียการทำงานตลอดอายุ (7–10 วัน); ร่างกายสร้าง platelet ใหม่ราว 10% ต่อวัน → หยุด <b>7 วัน</b>ก่อนผ่าตัดให้ platelet ใหม่ทำงานได้พอ; POISE-2 (2014) พบว่า perioperative aspirin ไม่ลด death หรือ MI แต่เพิ่ม major bleeding ใน noncardiac surgery → ในกลุ่ม primary prevention ที่ไม่มี stent การหยุดยาจึงสมเหตุสมผล แล้วเริ่มกลับเมื่อ hemostasis ดี (ราว 24 ชม. หลังผ่าตัด)",
  wrong:[
    "Continue without interruption: เหมาะกับ secondary prevention (CAD, MI, stroke, PAD) และผู้ป่วยมี coronary stent (ห้ามหยุด aspirin เพราะเสี่ยง stent thrombosis) — จะเป็นคำตอบถ้าโจทย์บอกว่ากิน aspirin เพราะเคยใส่ stent หรือเป็น secondary prevention ที่ bleeding risk ของการผ่าตัดยอมรับได้",
    "Bridge with heparin: bridging ใช้กับ warfarin ในผู้ป่วย thrombotic risk สูง ไม่ใช่ antiplatelet; heparin ไม่ทดแทนฤทธิ์ต้าน platelet และเพิ่ม bleeding — ไม่มีบริบทที่ถูกสำหรับ aspirin",
    "Stop 1 day before surgery: สั้นเกินไป เพราะ platelet ส่วนใหญ่ยังถูกยับยั้งแบบถาวร — จะเป็นคำตอบสำหรับ NSAID แบบ reversible ฤทธิ์สั้นอย่าง ibuprofen",
    "Switch to clopidogrel: clopidogrel ยับยั้ง P2Y12 แบบ irreversible เช่นกัน ต้องหยุด 5 วัน และ bleeding risk ไม่ได้น้อยกว่า — clopidogrel ใช้แทน aspirin เมื่อแพ้ aspirin ในข้อบ่งชี้ secondary prevention ไม่ใช่เพื่อเตรียมผ่าตัด"],
  trap:"คิดว่า bridging ใช้กับยาต้านการแข็งตัวของเลือดทุกชนิด; หรือหยุด aspirin ในผู้ป่วยมี coronary stent ซึ่งอันตราย",
  summary:[
    "Aspirin: irreversible COX-1 inhibitor → ↓TXA2 ฤทธิ์อยู่ตลอดอายุ platelet 7–10 วัน; ถ้าต้องหยุดให้หยุดราว 7 วัน (ACCP 2022: ≤7 วันก่อนผ่าตัด)",
    "Primary prevention: ประโยชน์ช่วงผ่าตัดไม่คุ้ม bleeding → หยุดได้ (POISE-2); secondary prevention: ส่วนใหญ่ continue ยกเว้นผ่าตัดที่เลือดออกในที่ปิด (intracranial, spinal canal, posterior chamber ของตา)",
    "Coronary stent: elective noncardiac surgery ควรเลื่อนจนครบช่วง DAPT ขั้นต่ำ (BMS ≥30 วัน, DES ≥6 เดือนตาม ACC/AHA 2016); ช่วงผ่าตัด continue aspirin หยุดเฉพาะ P2Y12 inhibitor",
    "P2Y12 inhibitor: clopidogrel หยุด 5 วัน, ticagrelor 3–5 วัน, prasugrel 7 วัน",
    "Warfarin: หยุด 5 วัน; bridging เฉพาะ high thrombotic risk (mechanical mitral valve, VTE หรือ stroke ภายใน 3 เดือน)",
    "DOAC: หยุด 1–2 วันตาม bleeding risk ของการผ่าตัด (นานขึ้นถ้าไตเสื่อมสำหรับ dabigatran) ไม่ต้อง bridge (PAUSE trial)",
    "ดูข้อ 45, 75 (warfarin กับเลือดออกฉุกเฉิน)"],
  notes:"รุ่นพี่ขีดเส้นใต้ 'ASA gr 5' และเขียน '<b>ASA gr 5 = 325 mg</b>' (aspirin 5 grains); ขีด <b>A</b> (หยุด 7 วัน) ด้วยหมึกแดง",
  mnemonic:"Aspirin irreversible → หยุด 7 วัน ≈ อายุ platelet; มี stent ห้ามหยุด",
  guide:"ACCP (CHEST) Perioperative Management of Antithrombotic Therapy 2022; ESC 2022 Guidelines on Cardiovascular Assessment and Management of Patients Undergoing Non-cardiac Surgery; POISE-2 (NEJM 2014)",
  opinion:"คงคีย์ A ความมั่นใจปานกลาง. ⚠ ต้นฉบับไม่บอกว่ากิน aspirin เพื่ออะไร — ถ้าเป็น secondary prevention หรือมี coronary stent คำตอบจะเป็น continue (B) จึงเติม primary prevention + no stent. ข้อควรรู้: ACCP 2022 แนะนำแบบ conditional (หลักฐานต่ำ) ให้ continue aspirin มากกว่าหยุดในผู้ป่วย noncardiac surgery และถ้าจะหยุดให้หยุด ≤7 วันก่อนผ่าตัด; ESC 2022 ให้พิจารณาหยุด aspirin ในผู้ที่ไม่เคยทำ PCI ถ้า bleeding risk มากกว่า ischemic risk. ดังนั้นในทางปฏิบัติ hernia repair ซึ่ง bleeding risk ต่ำ การ continue ก็ยอมรับได้ แต่ในข้อสอบที่เป็น primary prevention และตัวเลือกอื่นเป็น bridging หรือหยุด 1 วัน คำตอบ A สอดคล้องกับสรีรวิทยาของ platelet และผลของ POISE-2",
  variants:["DES placed 2 months ago, elective hernia repair → เลื่อนผ่าตัด continue DAPT","Aspirin for secondary prevention after MI, elective cholecystectomy → continue aspirin","Clopidogrel before elective surgery → หยุด 5 วัน"]}),
A({page:11, page2:11, orig:"53", kimg:KI("54"),
  stem:"Which of the following does not help postoperative recovery?",
  gray:"53. ข้อไหนไม่ช่วยใน post op recovery. — A. Epidural anesthesia B. รีบเอาNGออก C. O2 supplement D. Non-opoid E. Post op gum chewing",
  opts:["Epidural anesthesia","Early removal of nasogastric tube","Routine supplemental oxygen","Non-opioid analgesia","Postoperative gum chewing"],
  ans:2, key:"C Routine supplemental oxygen"+KS,
  interp:"ถาม component ของ ERAS (enhanced recovery after surgery) — ข้อไหนไม่ได้อยู่ใน pathway",
  why:"ทุกช้อยยกเว้น O2 เป็น ERAS element ที่มีหลักฐาน; <b>supplemental oxygen แบบ routine</b> หลังผ่าตัดไม่ได้ช่วยให้ฟื้นตัวเร็วขึ้น ให้เฉพาะเมื่อมีข้อบ่งชี้ (SpO2 ต่ำ) — ตามที่รุ่นพี่เขียน 'only in certain case' เพราะ hypoxemia หลังผ่าตัดพบน้อยลงมากเมื่อใช้ opioid-sparing analgesia และยาดมสลบออกฤทธิ์สั้น; การติดสาย O2 ยังทำให้ผู้ป่วยลุกเดินช้า. (แยกจาก intraoperative FiO2 80% ที่ WHO แนะนำเพื่อลด SSI ซึ่งเป็นคนละประเด็น)",
  wrong:[
    "Epidural anesthesia: thoracic epidural ใน open abdominal surgery ให้ analgesia ดี ลด opioid, ลด ileus และ pulmonary complication → เป็น ERAS element ใน open surgery — จะเป็นคำตอบถ้าถามสิ่งที่ไม่จำเป็นใน laparoscopic ERAS (ใช้ spinal หรือ TAP block แทนได้)",
    "Early removal of nasogastric tube: ERAS ไม่ใส่ NG routine หรือถอดก่อนตื่น → ลด pneumonia, atelectasis และกินได้เร็ว (รุ่นพี่: ลด complication of prolonged NG) — จะเป็นคำตอบถ้าเปลี่ยนเป็น routine prolonged NG decompression",
    "Non-opioid analgesia: multimodal opioid-sparing (paracetamol, NSAID, regional block) ลด ileus, PONV และอาการง่วง → ลุกเดินเร็ว — จะเป็นคำตอบถ้าเปลี่ยนเป็น routine high-dose opioid",
    "Postoperative gum chewing: sham feeding กระตุ้น cephalic-vagal reflex → flatus และ bowel movement เร็วขึ้น มีหลักฐานจาก meta-analysis และอยู่ใน ERAS 2018 (รุ่นพี่ให้ ±) — ถ้าไม่มีช้อย O2 บางคนอาจเลือกข้อนี้เพราะหลักฐานอ่อนกว่าข้ออื่น"],
  trap:"คิดว่าให้ O2 'ไม่เสียหาย' จึงต้องช่วย — สิ่งที่ไม่มีหลักฐานว่าเร่ง recovery ไม่ใช่ ERAS element; ในทางกลับกัน gum chewing ที่ดูแปลกกลับมีหลักฐาน",
  summary:[
    "ERAS preop: counseling, เลิกบุหรี่และสุรา, prehabilitation, nutrition optimization, ไม่งดอาหารนาน (solid 6 ชม., clear fluid 2 ชม.), carbohydrate loading, ไม่ให้ long-acting sedative premedication",
    "ERAS intraop: minimally invasive surgery, short-acting anesthetic, goal-directed หรือ near-zero fluid balance, normothermia, PONV prophylaxis, หลีกเลี่ยง drain และ NG routine",
    "ERAS postop: early oral intake, early mobilization, ถอด urinary catheter เร็ว, multimodal opioid-sparing analgesia, glycemic control, gum chewing",
    "Analgesia: open → thoracic epidural; laparoscopic → spinal, TAP block, wound infiltration; ร่วมกับ paracetamol + NSAID ตามเวลา",
    "ป้องกัน postoperative ileus: เลี่ยง fluid overload และ opioid, MIS, gum chewing, alvimopan, early feeding",
    "Oxygen ให้ตามข้อบ่งชี้ ไม่ต้อง routine; intraoperative FiO2 80% เพื่อลด SSI (WHO 2016) เป็นคนละเรื่องกับ recovery",
    "ดูข้อ 53, 55 (perioperative care)"],
  notes:"ลายมือรุ่นพี่: A Epidural anesthesia '✓ ลด pain → active!'; B รีบเอา NG ออก '✓ ลด complication of prolonged NG'; ขีด <b>C</b> O2 supplement '— <b>only in certain case</b> (incidence ของ hypoxemia ในระยะหลัง ๆ ต่ำลงมาก)'; D Non-opioid ✓; E Post op gum chewing '(±) ✓ ช่วยให้ bowel function กลับมาไวขึ้น [มีหลายเปเปอร์บอก แต่ยังไม่เคยเห็นที่ไทย]'",
  mnemonic:"ERAS = 'ลุกไว กินไว ถอดสายไว ปวดน้อยโดยไม่พึ่ง opioid'",
  guide:"ERAS Society Guidelines for Perioperative Care in Elective Colorectal Surgery 2018; WHO Global Guidelines for the Prevention of Surgical Site Infection 2016 (updated 2018)",
  opinion:"เห็นด้วยกับคีย์ C (มั่นใจค่อนข้างสูง) — gum chewing ที่รุ่นพี่ให้ ± มีหลักฐานว่าลดระยะ ileus และอยู่ใน ERAS 2018 จึงไม่ใช่คำตอบ",
  variants:["Which is an ERAS element? → carbohydrate loading 2 ชม. ก่อนผ่าตัด","Which increases postoperative ileus? → IV fluid เกินและ opioid","Analgesia for laparoscopic colectomy under ERAS → TAP block หรือ spinal + multimodal oral analgesics"]}),
A({page:11, page2:11, orig:"54", kimg:KI("55"),
  stem:"Which of the following is not an advantage of minimally invasive surgery?",
  gray:"54. MIS ไม่ใช่ — A. Recoveryเร็ว B. เจ็บแผลน้อย C. ดมยาสั้นกว่า",
  opts:["Faster recovery","Less wound pain","Shorter anesthesia time","Better cosmesis","Fewer wound complications"],
  ans:2, key:"C Shorter anesthesia time"+KS,
  interp:"ถามข้อที่ไม่ใช่ข้อดีของการผ่าตัดแบบ minimally invasive (laparoscopic, robotic)",
  why:"MIS มักใช้เวลาผ่าตัดและ<b>ดมยานานกว่า</b> open surgery (setup, pneumoperitoneum, learning curve) ไม่ใช่สั้นกว่า; ข้อดีจริงมาจากแผลเล็ก: ปวดน้อย ใช้ opioid น้อย ฟื้นตัวและกลับบ้านเร็ว SSI และ incisional hernia น้อย adhesion น้อย แผลสวย และ stress response น้อยกว่า",
  wrong:[
    "Faster recovery: เป็นข้อดีหลัก (ileus สั้น, LOS สั้น, กลับไปทำงานเร็ว) — จะไม่เป็นข้อดีเมื่อต้อง convert to open หรือเกิด complication",
    "Less wound pain: แผลเล็กปวดน้อยกว่าและใช้ opioid น้อยกว่า — เป็นข้อดีจริง; ข้อที่อาจถูกถามแทนคือ shoulder tip pain จาก CO2 ระคายกะบังลม",
    "Better cosmesis: แผลเล็กหลายแผลหรือ single-incision ดูดีกว่า — เป็นข้อดีจริง",
    "Fewer wound complications: SSI และ incisional hernia น้อยกว่า open — เป็นข้อดีจริง แต่ยังเกิด port-site hernia ได้ (port ≥10 mm ต้องเย็บปิด fascia)"],
  trap:"คิดว่าแผลเล็กแปลว่าผ่าเร็ว — ตรงกันข้าม MIS มักใช้เวลานานกว่าโดยเฉพาะช่วงเรียนรู้",
  summary:[
    "ข้อดี MIS: ปวดน้อย, opioid น้อย, ileus สั้น, LOS สั้น, กลับไปทำงานเร็ว, SSI น้อย, incisional hernia น้อย, adhesion น้อย, cosmesis ดี, ภาพขยายชัด",
    "ข้อเสีย: operative และ anesthesia time นานขึ้น, ค่าอุปกรณ์สูง, ขาด tactile feedback, ภาพ 2D (ยกเว้น 3D หรือ robot), learning curve, trocar injury (vascular, bowel) ขณะ entry, port-site hernia, CO2 embolism",
    "Pneumoperitoneum CO2 12–15 mmHg: hypercarbia + respiratory acidosis, ↓ venous return และ cardiac output (โดยเฉพาะถ้า hypovolemic), ↑ SVR, ↓ FRC และ ↑ airway pressure, ↓ renal blood flow และ urine output, ↑ ICP",
    "Relative contraindications: severe cardiopulmonary disease (EF ต่ำมาก), raised ICP, uncorrected coagulopathy, hemodynamic instability, adhesion มาก",
    "Pregnancy: laparoscopy ทำได้อย่างปลอดภัยทุกไตรมาส (SAGES 2017) ใช้ pressure 10–15 mmHg และ left lateral tilt",
    "ดูข้อ 15, 54 (ข้อห้าม laparoscopy และ ERAS)"],
  notes:"รุ่นพี่ขีด <b>C</b> (ดมยาสั้นกว่า) ด้วยหมึกแดง — ไม่มีลายมืออื่น",
  mnemonic:"MIS: แผลเล็ก แต่เวลาไม่เล็ก",
  guide:"Sabiston Textbook of Surgery 21st ed. 2022 — Minimally Invasive Surgery; SAGES Guidelines for the Use of Laparoscopy During Pregnancy 2017",
  opinion:"",
  variants:["Physiologic effect of CO2 pneumoperitoneum → ↓ venous return และ hypercarbia","Port ≥10 mm → ต้องเย็บปิด fascia เพื่อป้องกัน port-site hernia","Contraindication to laparoscopy → severe heart failure EF 15%"]}),
A({page:11, page2:11, orig:"55", kimg:KI("56"),
  stem:"A 28-year-old woman has been taking oral contraceptive pills for 10 years. Imaging shows a liver mass with rapid washout. What is the most likely diagnosis?",
  gray:"55. ผญอายุ 28 กินยาคุม 10 ปี rapid wash out — A. Hepatic adenoma B. FNH C. HCC",
  opts:["Hepatic adenoma","Focal nodular hyperplasia","Hepatocellular carcinoma","Hepatic hemangioma","Liver metastasis"],
  ans:0, key:"A Hepatic adenoma"+KS,
  interp:"หญิงอายุน้อย + กินยาคุมนาน + liver mass → hepatocellular adenoma; washout ไม่ได้เฉพาะ HCC",
  why:"Hepatocellular adenoma สัมพันธ์กับ estrogen (ยาคุม — เสี่ยงมากขึ้นตามระยะเวลาและขนาดยา), anabolic steroid, glycogen storage disease, obesity; imaging: arterial hyperenhancement และ washout ได้ (โดยเฉพาะ hypointense ใน hepatobiliary phase ของ gadoxetate MRI) ซึ่ง<b>ซ้อนกับ HCC</b> — ตามที่รุ่นพี่เขียน แยกกันด้วยประวัติ: ไม่มี cirrhosis หรือ HBV + หญิงสาวกินยาคุม → adenoma",
  wrong:[
    "Focal nodular hyperplasia: หญิงสาวเหมือนกันแต่ยาคุมไม่ใช่สาเหตุ; imaging: homogeneous arterial enhancement, iso ใน portal และ delayed phase (ไม่ washout), central stellate scar, iso หรือ hyper ใน hepatobiliary phase — จะเป็นคำตอบเมื่อมี central scar และไม่มี washout",
    "Hepatocellular carcinoma: APHE + washout + capsule ในผู้ป่วย cirrhosis หรือ chronic HBV (LI-RADS 5) — จะเป็นคำตอบเมื่อมี risk factor เช่น HBV, HCV, cirrhosis, AFP สูง",
    "Hepatic hemangioma: benign liver tumor ที่พบบ่อยที่สุด; peripheral nodular discontinuous enhancement แล้ว centripetal fill-in, T2 สว่างมาก ไม่มี washout — จะเป็นคำตอบเมื่อเห็น pattern นี้",
    "Liver metastasis: hypovascular (colorectal) เป็น rim enhancement หรือ target; hypervascular (NET, RCC, melanoma, thyroid, breast) อาจ washout ได้ — จะเป็นคำตอบเมื่อมีประวัติมะเร็งหรือมีหลายก้อน"],
  trap:"เห็น rapid washout แล้วตอบ HCC ทันที — washout ต้องตีความร่วมกับ risk factor; LI-RADS ใช้ได้เฉพาะ high-risk population",
  summary:[
    "Hepatocellular adenoma: หญิงอายุ 20–40 กินยาคุม, anabolic steroid, GSD type I, obesity หรือ metabolic syndrome; ความเสี่ยงหลักคือ hemorrhage หรือ rupture และ malignant transformation (ราว 5%)",
    "Subtypes: HNF1α-inactivated (มีไขมันในก้อน signal drop บน opposed-phase MRI, malignant risk ต่ำ), inflammatory (พบบ่อยที่สุด, T2 สว่าง, atoll sign, เลือดออกง่าย), β-catenin-activated (malignant transformation สูงสุด, ผู้ชาย, ใช้ steroid), sonic hedgehog (เลือดออก), unclassified",
    "Management (EASL 2016): หยุดยาคุม + ลดน้ำหนัก แล้วตรวจซ้ำที่ 6 เดือน; resection เมื่อยัง ≥5 cm หลังปรับ lifestyle, ทุกขนาดในผู้ชาย, β-catenin mutation หรือโตขึ้น; เลือดออก → transarterial embolization แล้วผ่าตัดภายหลัง",
    "FNH: central scar ไม่มี malignant potential ไม่ต้องรักษาและไม่ต้องหยุดยาคุม",
    "HCC วินิจฉัยด้วย imaging ได้เฉพาะ high-risk (cirrhosis, chronic HBV, prior HCC): APHE + washout ± capsule (LI-RADS 5); นอกกลุ่มนี้ต้องใช้ pathology",
    "Hemangioma: centripetal fill-in, observe; ก้อนใหญ่มากอาจเกิด Kasabach-Merritt (พบน้อย)",
    "ดูข้อ 57 (โจทย์คู่กัน), 50"],
  notes:"รุ่นพี่ขีดเส้นใต้ '<b>กินยาคุม 10 ปี</b>'; ขีด <b>A</b>; ลากลูกศรจาก Hepatic adenoma และ HCC ไปที่ข้อความ '<b>imaging pattern เหมือนกัน (A-enhance, Rapid washout) แยกกันที่ Hx</b> — ถ้ามี cirrhosis, HBV history จะนึกถึง HCC มากกว่า'",
  mnemonic:"Adenoma = สาว + ยาคุม; FNH = Fine, No Harm, central scar",
  guide:"EASL Clinical Practice Guidelines on the Management of Benign Liver Tumours 2016; ACR LI-RADS v2018",
  opinion:"",
  variants:["Young woman with 7-cm adenoma persisting 6 months after stopping OCP → resection","Ruptured hepatic adenoma with hypotension → resuscitation + transarterial embolization","Young woman with central stellate scar and no washout → FNH, observe"]}),
A({page:11, page2:11, orig:"56", kimg:KI("57"),
  stem:"A patient with chronic hepatitis C infection has a liver mass with rapid washout. The surrounding liver parenchyma appears normal. What is the most likely diagnosis?",
  gray:"56. Chronic HCV, liver parenchyma normal , rapid wash out — A. HCC B. FNH C. Hepatic adenoma",
  opts:["Hepatocellular carcinoma","Focal nodular hyperplasia","Hepatic adenoma","Liver metastasis","Hepatic hemangioma"],
  ans:0, key:NK, flag:"⚠ ไม่มีคีย์ — รุ่นพี่ไม่ได้วงคำตอบ เขียนว่าแยกด้วย imaging ไม่ได้; ตอบ HCC ตาม risk factor (chronic HCV)",
  interp:"chronic HCV = risk factor ของ HCC + ก้อนที่มี washout; ข้อมูลว่าเนื้อตับดูปกติทำให้ลังเลระหว่าง HCC กับ adenoma",
  why:"Chronic HCV ก่อ HCC ส่วนใหญ่ผ่าน cirrhosis หรือ advanced fibrosis (F3) แต่ <b>imaging ไม่ไวต่อ fibrosis ระยะต้นถึงกลาง</b> 'ตับดูปกติ' จึงไม่ได้แปลว่าไม่มี fibrosis และ HCC ราว 1 ใน 5 เกิดในตับที่ไม่ใช่ cirrhosis; ก้อนที่ washout ในผู้ป่วยมี chronic viral hepatitis จึงต้องนึกถึง <b>HCC</b> ก่อน ขณะที่โจทย์ไม่มีปัจจัยของ adenoma (หญิงสาว ยาคุม steroid) — แต่ผู้ป่วย HCV ที่ไม่มี cirrhosis ไม่อยู่ใน LI-RADS population จึงควรยืนยันด้วย multiphasic MRI ± biopsy",
  wrong:[
    "Focal nodular hyperplasia: ไม่ washout มี central scar และพบในหญิงสาว — จะเป็นคำตอบเมื่อ incidental lesion ที่มี central stellate scar",
    "Hepatic adenoma: เนื้อตับปกติ + washout เข้าได้ (รุ่นพี่เขียนว่า 'favor Hep. adenoma') แต่โจทย์ไม่มีบริบทของ adenoma และ chronic HCV เป็น risk ที่ชัดกว่า — จะเป็นคำตอบเมื่อเป็นหญิงอายุน้อยกินยาคุมนานโดยไม่มี viral hepatitis (ข้อ 56)",
    "Liver metastasis: hypervascular metastasis washout ได้ แต่โจทย์ไม่มีประวัติมะเร็งและเป็นก้อนเดียว — จะเป็นคำตอบเมื่อมีประวัติ NET, RCC, melanoma หรือมีหลายก้อน",
    "Hepatic hemangioma: centripetal fill-in ไม่มี washout — จะเป็นคำตอบเมื่อเห็น peripheral nodular enhancement ที่ค่อย ๆ เติมเข้ากลาง"],
  trap:"ตีความ 'liver parenchyma normal' ว่าตัด HCC ทิ้งได้ — HCC เกิดในตับที่ไม่ใช่ cirrhosis ได้ (HBV, MASLD, HCV ที่มี advanced fibrosis) และ imaging ประเมิน fibrosis ไม่ไว",
  summary:[
    "HCC risk factors: cirrhosis ทุกสาเหตุ (HCV, alcohol, MASLD), chronic HBV แม้ไม่มี cirrhosis, aflatoxin, hemochromatosis; chronic HCV เสี่ยงสูงเมื่อมี F3 หรือ cirrhosis และความเสี่ยงลดลงแต่ไม่หมดหลัง SVR",
    "Surveillance (AASLD 2023): US ± AFP ทุก 6 เดือนใน cirrhosis และ chronic HBV กลุ่มเสี่ยง (เช่น ชายเอเชียอายุ ≥40, หญิง ≥50, มีประวัติ HCC ในครอบครัว)",
    "LI-RADS v2018 (CT หรือ MRI) ใช้ได้เฉพาะ cirrhosis, chronic HBV หรือเคยเป็น HCC: LR-5 = 10–19 mm APHE + nonperipheral washout หรือ threshold growth, หรือ ≥20 mm APHE + major feature ≥1 อย่าง (washout, capsule, threshold growth)",
    "นอก high-risk population (เช่น HCV ที่ไม่มี cirrhosis หรือตับปกติ) วินิจฉัย HCC จาก imaging อย่างเดียวไม่ได้ → MRI with hepatobiliary agent ± biopsy",
    "Adenoma กับ HCC: imaging คล้ายกัน (APHE + washout) แยกด้วยบริบท — หญิงสาวกินยาคุมตับปกติ → adenoma; ไวรัสตับอักเสบ, cirrhosis, AFP สูง → HCC",
    "Treatment HCC (BCLC 2022): very early หรือ early → resection (Child-Pugh A ไม่มี portal hypertension), ablation (≤3 cm), transplant (Milan: ก้อนเดียว ≤5 cm หรือ ≤3 ก้อนแต่ละก้อน ≤3 cm ไม่มี vascular invasion); intermediate → TACE; advanced → atezolizumab + bevacizumab",
    "ดูข้อ 56 (โจทย์คู่กัน), 24 (Milan criteria)"],
  notes:"รุ่นพี่<b>ไม่ได้วงคำตอบ</b> แต่ขีดเส้นใต้และเขียน: 'Chronic HCV' → '<b>favor HCC</b>'; 'liver parenchyma normal' (มี ?? ข้างคำว่า normal) → '<b>favor Hep. adenoma</b>'; ลากใต้ช้อย A–C ว่า '<b>แยกกันด้วย imaging ไม่ได้</b>'; และเขียนด้านล่างว่า '(chronic HCV ไม่น่าตับปกตินะ)'",
  mnemonic:"Pattern เหมือน แต่คนต่าง: ไวรัสหรือตับแข็ง → HCC, สาวกินยาคุม → adenoma",
  guide:"AASLD Practice Guidance on Prevention, Diagnosis, and Treatment of HCC 2023; ACR LI-RADS v2018 CT/MRI; BCLC Strategy 2022 Update",
  opinion:"⚠ ไม่มีคีย์ในไฟล์ — รุ่นพี่ไม่ได้วงคำตอบ แต่วิเคราะห์ว่า chronic HCV favor HCC ส่วนตับปกติ favor adenoma และแยกด้วย imaging ไม่ได้ พร้อมตั้งข้อสังเกตว่า 'chronic HCV ไม่น่าตับปกติ'. ตอบ HCC (ความมั่นใจปานกลาง) เพราะ (1) chronic HCV เป็น risk factor เดียวที่โจทย์ให้ (2) ไม่มีข้อมูลเพศ อายุ หรือยาคุมที่ชี้ไปทาง adenoma (3) ตับที่ดูปกติบน imaging ไม่ได้ exclude fibrosis และ HCC เกิดในตับที่ไม่ใช่ cirrhosis ได้ (4) ข้อนี้น่าจะเป็นคู่กับข้อ 56 เพื่อสอนว่า pattern เดียวกันแยกด้วยประวัติ. ในทางปฏิบัติ HCV ที่ไม่มี cirrhosis ไม่อยู่ใน LI-RADS population จึงควรยืนยันด้วย biopsy ก่อนรักษา",
  variants:["Chronic HBV without cirrhosis, 3-cm mass with APHE and washout → HCC (LI-RADS ใช้ได้ใน HBV)","Cirrhosis with 2.5-cm APHE + washout → LR-5 HCC ไม่ต้อง biopsy","Liver mass with APHE + washout in a patient without risk factors → biopsy"]}),
A({page:12, page2:12, orig:"57", kimg:KI("58"),
  stem:"A patient presents with jaundice, anemia, and epigastric pain radiating to the back. The pain improves after taking an anti-inflammatory drug and acetaminophen. An irregular-bordered mass is palpable in the epigastrium. What is the most likely diagnosis?",
  gray:"57. ผู้ป่วย เหลือง anemia ปวดท้อง at epigastrium radiate to back. กิน anti inflammatory drug and acetaminophen แล้ว ดีขึ้น. คลำได้ก้อน irregular border at epigastrium — A. CA head of pancreas B. Gastric adenocarcinoma C. gastric GIST",
  opts:["Carcinoma of the pancreatic head","Gastric adenocarcinoma","Gastric GIST","Chronic pancreatitis","Hepatocellular carcinoma"],
  ans:0, key:"A Carcinoma of the pancreatic head"+KS,
  interp:"โจทย์ให้ triad ของ <b>jaundice + epigastric pain ทะลุหลัง + ก้อน epigastrium ขอบไม่เรียบ</b> ร่วมกับ anemia ให้แยกว่าก้อนมาจากตับอ่อน กระเพาะ หรือตับ",
  why:"<b>Jaundice</b> บอกว่ามีการอุดตันของ distal CBD ซึ่งวิ่งผ่าน pancreatic head — มะเร็งหัวตับอ่อนเป็นสาเหตุ malignant obstructive jaundice ที่พบบ่อยที่สุด (painless jaundice เป็นอาการเด่นของ head lesion) · <b>ปวดทะลุหลัง</b> = tumor ลุกลาม retroperitoneum / celiac plexus (บ่งว่า locally advanced) · ก้อนแข็งขอบไม่เรียบที่ epigastrium = tumor ที่โตมากแล้ว (หรือคลำได้ GB โตแบบ Courvoisier) · anemia อธิบายได้จาก anemia of chronic disease หรือ tumor กิน duodenum แล้วเลือดออกซึม · ปวดดีขึ้นด้วย NSAID/paracetamol ไม่ได้ตัดมะเร็ง (รุ่นพี่: อาจมี peritumoral pancreatitis ร่วม)",
  wrong:["Gastric adenocarcinoma: ให้ anemia, weight loss, early satiety และคลำก้อน epigastrium ได้ แต่ไม่ทำให้ตัวเหลืองโดยตรง — จะเหลืองเมื่อมี liver metastasis หรือ LN ที่ porta hepatis/hepatoduodenal ligament กด CBD แล้ว; จะเป็นคำตอบถ้าโจทย์ไม่มีตัวเหลือง แต่มี dyspepsia เรื้อรัง อาเจียนจาก gastric outlet obstruction หรือคลำได้ Virchow node","Gastric GIST: submucosal tumor ที่มักมาด้วย GI bleeding (melena, anemia) หรือก้อนในท้องที่โตช้า แต่แทบไม่ทำให้เหลืองและไม่ปวดทะลุหลัง; จะเป็นคำตอบถ้าโจทย์ให้ anemia/melena + EGD เจอ subepithelial mass ที่มี central ulcer โดยไม่มีตัวเหลือง","Chronic pancreatitis: ปวด epigastrium ทะลุหลังเรื้อรังจริง และ fibrosis ที่หัวตับอ่อนทำให้ CBD ตีบเหลืองได้ แต่ประวัติควรมี alcohol/สูบบุหรี่ ปวดเป็น ๆ หาย ๆ หลายปี steatorrhea DM และ CT เห็น calcification — ก้อนแข็งขอบไม่เรียบ + anemia เอนไปทางมะเร็งมากกว่า; จะเป็นคำตอบถ้าโจทย์ให้ alcoholic ปวดเรื้อรัง steatorrhea และ plain film/CT เห็น pancreatic calcification","Hepatocellular carcinoma: คลำก้อนได้ที่ RUQ/epigastrium (left lobe) และเหลืองได้ แต่มักมี cirrhosis/HBV/HCV, stigmata of chronic liver disease, AFP สูง และไม่ปวดทะลุหลังแบบ retroperitoneal; จะเป็นคำตอบถ้าโจทย์ให้ chronic HBV + hepatomegaly ก้อนแข็ง + ascites"],
  trap:"เห็นคำว่า <b>anemia + ก้อน epigastrium</b> แล้วรีบตอบมะเร็งกระเพาะ — ตัวตัดสินคือ <b>jaundice</b> (บอกตำแหน่ง distal CBD) และ <b>ปวดทะลุหลัง</b> (บอก retroperitoneal organ)",
  summary:["Pancreatic ductal adenocarcinoma ~60–70% อยู่ที่ head → มาด้วย painless obstructive jaundice, weight loss, Courvoisier sign (GB โตคลำได้ ไม่เจ็บ), pruritus, new-onset DM ในคนอายุ &gt; 50 ปี","ปวด epigastrium ทะลุหลัง = invasion ของ celiac/superior mesenteric plexus → มักบ่งว่า locally advanced/unresectable","Investigation: pancreatic-protocol CT (triphasic) เป็นหลักในการวินิจฉัยและประเมิน resectability (ดู SMA, celiac axis, CHA, SMV-PV) · CA 19-9 ใช้ติดตาม/พยากรณ์ (สูงหลอกได้ใน cholangitis/obstructive jaundice) · EUS-FNB เมื่อต้องการชิ้นเนื้อก่อนให้ neoadjuvant","Resectable head tumor → pancreaticoduodenectomy (Whipple) + adjuvant chemotherapy (mFOLFIRINOX) · borderline resectable → neoadjuvant ก่อน · unresectable/metastatic → systemic chemotherapy + palliation (biliary stent, duodenal stent/gastrojejunostomy, celiac plexus block)","Periampullary tumors (pancreatic head, distal CBD, ampulla, duodenum) อาการคล้ายกัน ใช้ CT/EUS/ERCP แยก","Gastric cancer/GIST ไม่ทำให้เหลืองโดยตรง ยกเว้นมี metastasis ที่ตับหรือ porta hepatis","ดูข้อ 13, 28, 41 (ตับอ่อน/ทางเดินน้ำดีอุดตัน)"],
  notes:"ลายมือรุ่นพี่: ขีดเส้นใต้ \"เหลือง\", \"anemia\", \"ปวดท้อง at epigastrium radiate to back\" · เขียนที่คำว่า radiate to back → <b>\"retroperitonium structure\"</b> · วง/ติ๊ก A CA head of pancreas เขียนข้าง ๆ <b>\"(Maybe อักเสบแล้ว)\"</b> · กากบาท B Gastric adenocarcinoma และ C gastric GIST แล้วเขียนวงเล็บรวมว่า <b>\"ไม่น่าเหลือง\"</b>",
  mnemonic:"",
  guide:"NCCN Pancreatic Adenocarcinoma v.2025 / Sabiston Textbook of Surgery 21st ed.",
  opinion:"เห็นด้วยกับคีย์ (มั่นใจสูง) — ต้นฉบับมีช้อยแค่ 3 ข้อ จึงแต่งตัวลวงเพิ่ม Chronic pancreatitis และ Hepatocellular carcinoma; ทั้งสองไม่เข้ากับก้อนขอบไม่เรียบ + anemia + ปวดทะลุหลังได้ดีเท่ามะเร็งหัวตับอ่อน",
  variants:["ชายอายุ 65 ปี ตัวเหลืองไม่ปวด น้ำหนักลด คลำได้ GB โตไม่เจ็บ → Courvoisier sign → carcinoma of pancreatic head / periampullary tumor","มะเร็งหัวตับอ่อนที่ CT เห็น tumor หุ้ม SMA &gt; 180° → unresectable (locally advanced) → systemic chemotherapy + biliary stent","ผู้ป่วยมะเร็งตับอ่อนมี migratory superficial thrombophlebitis → Trousseau syndrome"]}),

A({page:12, page2:12, orig:"58", kimg:KI("59"), flag:"⚠ ต้นฉบับไม่มีช้อย — แต่งช้อยทั้ง 5 ข้อเอง",
  stem:"In portal hypertension, esophageal varices develop mainly from which portal venous tributary?",
  gray:"58. Esophagel variesจากcollateral อะไร",
  opts:["Left gastric vein","Superior rectal vein","Paraumbilical vein","Retroperitoneal veins of Retzius","Inferior mesenteric vein"],
  ans:0, key:"A Left gastric vein"+KS,
  interp:"ถาม portosystemic anastomosis ที่ทำให้เกิด esophageal varices — ฝั่ง portal คือหลอดเลือดอะไร",
  why:"Esophageal varices เกิดที่ lower esophagus บริเวณที่ <b>left gastric (coronary) vein</b> (portal system ไหลลง portal vein/splenic vein) ต่อกับ <b>esophageal veins</b> ที่ไหลเข้า <b>azygos/hemiazygos vein</b> (systemic) — เมื่อ portal pressure สูง (HVPG ≥ 10 mmHg = clinically significant portal hypertension; varices มีโอกาสแตกเมื่อ HVPG &gt; 12 mmHg) เลือดไหลย้อนผ่าน left gastric vein ขึ้นไปทาง esophageal plexus ทำให้หลอดเลือดใต้ mucosa โป่งพอง",
  wrong:["Superior rectal vein: เป็นฝั่ง portal ของ anorectal varices (ต่อกับ middle/inferior rectal veins → internal iliac/pudendal) ไม่ใช่ esophageal varices; จะเป็นคำตอบถ้าถามว่า rectal varices มาจาก collateral อะไร","Paraumbilical vein: ต่อกับ superficial epigastric veins ของผนังหน้าท้อง → caput medusae; จะเป็นคำตอบถ้าถามว่าเส้นเลือดโป่งรอบสะดือเกิดจาก collateral อะไร","Retroperitoneal veins of Retzius: ต่อระหว่าง colic/mesenteric veins กับ retroperitoneal/lumbar veins ทำให้ผ่าตัด retroperitoneum ในผู้ป่วย portal HT เลือดออกมาก; จะเป็นคำตอบถ้าถาม retroperitoneal portosystemic collateral","Inferior mesenteric vein: เป็น tributary ที่รับ superior rectal vein แล้วไหลเข้า splenic vein — เกี่ยวกับ rectal varices ไม่ใช่ esophageal; จะเป็นคำตอบถ้าถามว่า superior rectal vein ไหลเข้าหลอดเลือดอะไร"],
  trap:"สับสน <b>short gastric veins</b> (ทำให้ gastric fundal varices โดยเฉพาะใน splenic vein thrombosis = left-sided/sinistral portal HT) กับ <b>left gastric vein</b> (esophageal varices)",
  summary:["Portosystemic anastomoses หลัก 4 ตำแหน่ง: (1) esophageal — left gastric v. ↔ esophageal v. → azygos (2) rectal — superior rectal v. ↔ middle/inferior rectal v. (3) paraumbilical — paraumbilical v. ↔ superficial epigastric v. → caput medusae (4) retroperitoneal — veins of Retzius ↔ lumbar/renal v.","Esophageal varices = portal side คือ left gastric (coronary) vein, systemic side คือ azygos/hemiazygos","Gastric fundal varices: มาจาก short gastric/posterior gastric veins; isolated gastric varices (IGV1) โดยไม่มี esophageal varices + cirrhosis ไม่ชัด → นึกถึง splenic vein thrombosis (มักจาก pancreatitis/มะเร็งตับอ่อน) → รักษาด้วย splenectomy","Portal HT นิยามด้วย HVPG &gt; 5 mmHg; clinically significant ≥ 10 mmHg; varices แตกเมื่อ &gt; 12 mmHg","Variceal bleeding: vasoactive drug + antibiotic + restrictive transfusion (Hb 7–8 g/dL) → EGD + band ligation ภายใน 12 ชม.; gastric varices → cyanoacrylate glue","Devascularization (Sugiura) และ distal splenorenal shunt (Warren) อาศัยความรู้นี้ — Warren shunt ต้องตัด left gastric v. เพื่อแยก gastroesophageal ออกจาก portal flow","ดูข้อ 34, 71 (variceal bleeding)"],
  notes:"ต้นฉบับไม่มีช้อย — รุ่นพี่เขียนคำตอบไว้ข้างโจทย์ด้วยปากกาแดง: <b>\"Left gastric — esophageal vein\"</b> (คือ anastomosis ระหว่าง left gastric vein ฝั่ง portal กับ esophageal vein ฝั่ง systemic) · ช้อยทั้ง 5 ข้อในข้อนี้แต่งขึ้นเอง",
  mnemonic:"\"<b>Left</b> gastric <b>lifts</b> blood up to the esophagus\" — ตำแหน่ง anastomosis 4 แห่งจำว่า <b>\"ERUR\"</b>: Esophagus, Rectum, Umbilicus, Retroperitoneum",
  guide:"Moore Clinically Oriented Anatomy 9th ed. / Baveno VII Consensus 2022",
  opinion:"เห็นด้วยกับคำตอบที่รุ่นพี่เขียน (มั่นใจสูง) — ⚠ ต้นฉบับเป็นข้อเขียนสั้นไม่มีช้อย จึงแต่งช้อยทั้งหมดจาก portosystemic anastomosis ตำแหน่งอื่น และไม่ใส่ short gastric vein เพื่อไม่ให้มี 2 คำตอบ (short gastric มีส่วนในการเกิด gastric fundal varices และ cardia varices)",
  variants:["Caput medusae เกิดจาก collateral ใด → paraumbilical vein ↔ superficial epigastric veins","ผู้ป่วย chronic pancreatitis มี isolated gastric fundal varices ตับปกติ → splenic vein thrombosis → splenectomy","Distal splenorenal (Warren) shunt ต้อง ligate หลอดเลือดใดเพื่อให้ selective → left gastric (coronary) vein"]}),

A({page:12, page2:12, orig:"59", kimg:KI("60"), flag:"⚠ คีย์ตอบ A Biopsy — เราตอบ Endoscopic ultrasound ตาม ESGE 2022",
  stem:"Upper endoscopy reveals a subepithelial tumor. What is the most appropriate next step?",
  gray:"59. ส่องกล้องเจอsubepithelial tumor — A. Biopsy B. CT C. Endoscopic ultrasound",
  opts:["Biopsy","CT","Endoscopic ultrasound","Repeat EGD in 1 year","Surgical resection"],
  ans:2, key:"A Biopsy"+KS,
  interp:"เจอ subepithelial lesion (SEL) จากการส่องกล้อง — ขั้นต่อไปคือการตรวจที่บอกชั้นต้นกำเนิด ขนาด ลักษณะ และใช้นำทางการเก็บชิ้นเนื้อ",
  why:"SEL อยู่ใต้ mucosa ปกติ → <b>EUS</b> เป็นเครื่องมือที่ดีที่สุดในการ characterize (ESGE 2022): บอก <b>layer of origin</b> (GIST/leiomyoma = ชั้นที่ 4 muscularis propria, hypoechoic; lipoma = ชั้นที่ 3 submucosa, hyperechoic; cyst = anechoic; ectopic pancreas = ชั้น 2–3 มี duct), ขนาด, echogenicity, ขอบ และ <b>high-risk features</b> (ขอบไม่เรียบ, cystic space, echogenic foci, heterogeneity, ulceration) · ถ้าน่าจะเป็น GIST และขนาด ≥ 20 mm / มี high-risk features / จะผ่าตัดหรือให้ยา → ESGE แนะนำเก็บชิ้นเนื้อด้วย <b>EUS-FNB</b> (หรือ mucosal incision-assisted biopsy) แล้วย้อม CD117 (KIT)/DOG1 — ส่วน forceps biopsy ธรรมดาจาก EGD มักได้แค่ mucosa ปกติ",
  wrong:["Biopsy (คีย์ของรุ่นพี่): forceps biopsy ระหว่าง EGD มักไม่ถึงชั้น submucosa/muscularis propria จึง non-diagnostic และไม่บอกขนาด/ชั้น — การได้ tissue สำหรับย้อม CD117 เป็นเป้าหมายที่ถูกต้อง แต่ควรได้ผ่าน EUS-FNB หลัง EUS; ช้อยนี้จะเป็นคำตอบถ้า lesion มี ulcer ที่ mucosa (biopsy ขอบ ulcer ได้) หรือโจทย์บอกว่าทำ EUS แล้วและถามวิธียืนยันชนิด","CT: ใช้ staging เมื่อสงสัยว่าเป็น GIST ขนาดใหญ่/มะเร็ง (ดู metastasis ที่ตับ, peritoneum) หรือแยก extrinsic compression จากอวัยวะข้างเคียง แต่ประเมิน lesion เล็ก ๆ และชั้นผนังได้ไม่ดีเท่า EUS; จะเป็นคำตอบถ้าโจทย์บอกว่ายืนยันเป็น GIST ขนาด &gt; 2 cm แล้วถาม staging ก่อนผ่าตัด","Repeat EGD in 1 year: เป็นการ surveillance ที่ใช้หลังจาก characterize แล้วว่าเป็น lesion เล็ก (gastric GIST &lt; 2 cm ไม่มี high-risk features) หรือ SEL เล็กมาก ๆ ที่ดูไม่ร้าย — ยังไม่ควรนัดโดยไม่รู้ชนิด/ชั้น; จะเป็นคำตอบถ้าโจทย์ให้ผล EUS ว่า lesion &lt; 1–2 cm ลักษณะ benign","Surgical resection: ทำเมื่อยืนยันหรือสงสัยสูงว่าเป็น GIST ≥ 2 cm, มี high-risk features, มีอาการ (เลือดออก/อุดตัน) หรือโตขึ้นระหว่าง surveillance — การผ่าโดยยังไม่ characterize อาจผ่าตัด lipoma/ectopic pancreas โดยไม่จำเป็น; จะเป็นคำตอบถ้าโจทย์ให้ EUS-FNB เป็น GIST 4 cm ไม่มี metastasis"],
  trap:"คิดว่า \"เจอก้อน = biopsy\" เหมือน mucosal lesion — SEL อยู่ใต้ mucosa ปกติ forceps biopsy จึงมักได้ผลลบลวง; ต้อง <b>EUS ก่อน</b> แล้วเก็บชิ้นเนื้อผ่าน EUS",
  summary:["Subepithelial lesion = ก้อนนูนใต้ mucosa ปกติ DDx: GIST, leiomyoma (พบบ่อยสุดใน esophagus), schwannoma, lipoma, ectopic pancreas, NET, duplication cyst, extrinsic compression","EUS = investigation หลัก: บอก layer, echogenicity, ขนาด, high-risk features; GIST/leiomyoma = hypoechoic จากชั้นที่ 4 (muscularis propria), lipoma = hyperechoic ชั้นที่ 3","Tissue diagnosis: EUS-FNB หรือ mucosal incision-assisted biopsy สำหรับ lesion ที่สงสัย GIST ≥ 20 mm, มี high-risk features หรือต้องผ่าตัด/ให้ยา (ESGE 2022); ย้อม CD117 (KIT) บวก ~95%, DOG1 ช่วยในราย KIT ลบ","GIST: ส่วนใหญ่อยู่ที่ stomach (~60%) > small bowel; มาด้วย GI bleeding/anemia, ก้อน, หรือเจอโดยบังเอิญ; risk stratification ด้วย size, mitotic count, site","Gastric GIST &lt; 2 cm ไม่มี high-risk EUS features → endoscopic/EUS surveillance; ≥ 2 cm หรือมีอาการ/high-risk → resection (wedge resection, R0, ไม่ต้อง lymphadenectomy เพราะ GIST แทบไม่กระจายทาง LN; ระวังไม่ให้ tumor แตก)","CT ใช้ staging ก่อนผ่าตัด GIST ขนาดใหญ่; imatinib สำหรับ unresectable/metastatic, neoadjuvant ใน lesion ใหญ่ และ adjuvant 3 ปีในกลุ่ม high risk"],
  notes:"ลายมือรุ่นพี่: จากโจทย์ลากลูกศรไปว่า <b>\"GIST → Biopsy &amp; ย้อม immuno CD117 / c-KIT\"</b> · ขีด/ติ๊ก A Biopsy เป็นคำตอบ",
  mnemonic:"SEL → <b>\"EUS first, then FNB\"</b> — ดูชั้นก่อน ค่อยเจาะ",
  guide:"ESGE Guideline: Diagnosis and management of subepithelial lesions (2022) / NCCN Gastrointestinal Stromal Tumors v.2025",
  opinion:"⚠ ไม่เห็นด้วยกับคีย์ A (มั่นใจปานกลาง–สูง) — รุ่นพี่คิดไปที่ GIST แล้วเน้นการย้อม CD117 ซึ่งถูกในแง่เป้าหมาย แต่ขั้นต่อไปหลังเจอ SEL ใน EGD ตาม ESGE 2022 คือ EUS เพื่อ characterize แล้วเก็บชิ้นเนื้อผ่าน EUS (FNB) — forceps biopsy ธรรมดา yield ต่ำมากเพราะไม่ถึงชั้นที่ก้อนอยู่ ถ้าข้อสอบจริงตั้งใจให้ \"Biopsy\" หมายถึง EUS-guided biopsy คำตอบ A ก็พอรับได้ แต่ในช้อยแยก EUS ไว้ชัดเจน จึงตอบ C",
  variants:["EUS เห็น lesion hyperechoic จากชั้น submucosa นุ่ม กดยุบได้ (pillow sign) → lipoma → ไม่ต้องทำอะไรเพิ่ม","EUS-FNB ยืนยัน gastric GIST 5 cm ไม่มี metastasis → wedge resection R0 ไม่ต้อง lymphadenectomy","GIST resect แล้ว high risk (ขนาด &gt; 10 cm หรือ mitosis สูง) → adjuvant imatinib 3 ปี"]}),

A({page:12, page2:12, orig:"60", kimg:KI("61"),
  stem:"A patient presents with new-onset diabetes mellitus, perineal dermatitis, and deep vein thrombosis. What is the most likely diagnosis?",
  gray:"60. New onset DM. perineal dermatitis. DVT. diagnosis? — A. Insulinoma B. VIPoma C. Glucagonoma D. Gastrinoma E. Pancreatic adenocarcinoma",
  opts:["Insulinoma","VIPoma","Glucagonoma","Gastrinoma","Pancreatic adenocarcinoma"],
  ans:2, key:"C Glucagonoma"+KS,
  interp:"กลุ่มอาการของ functional pancreatic NET — DM + ผื่นบริเวณ perineum + thrombosis",
  why:"<b>Glucagonoma</b> (alpha-cell tumor) ให้กลุ่มอาการ <b>4D</b>: <b>D</b>iabetes (glucagon ↑ → glycogenolysis/gluconeogenesis ↑ → hyperglycemia, glucose intolerance), <b>D</b>ermatitis = <b>necrolytic migratory erythema</b> (ผื่นแดงลอก เป็นตุ่มน้ำ ขอบลาม ชอบที่ perineum, groin, ขา, รอบปาก; พบราว 70%; สัมพันธ์กับ hypoaminoacidemia/zinc ต่ำ), <b>D</b>VT/thromboembolism และ <b>D</b>epression ร่วมกับน้ำหนักลด glossitis anemia · วินิจฉัยด้วย fasting glucagon สูงมาก (มัก &gt; 500 pg/mL) + CT/MRI + somatostatin receptor imaging (Ga-68 DOTATATE PET)",
  wrong:["Insulinoma: functional PNET ที่พบบ่อยที่สุด ทำให้ <b>hypoglycemia</b> (Whipple triad: อาการ hypoglycemia, glucose &lt; 55 mg/dL, อาการหายเมื่อให้ glucose) ตรงข้ามกับ DM; จะเป็นคำตอบถ้าโจทย์ให้ใจสั่น เหงื่อแตก สับสนตอนอดอาหาร + insulin/C-peptide สูงขณะ glucose ต่ำ","VIPoma: Verner-Morrison syndrome = <b>WDHA</b> (watery diarrhea ปริมาณมาก &gt; 3 L/วัน, hypokalemia, achlorhydria) อาจมี hyperglycemia และ flushing ได้ แต่ไม่มี necrolytic migratory erythema; จะเป็นคำตอบถ้าโจทย์ให้ท้องเสียเป็นน้ำปริมาณมากที่ไม่หยุดแม้อดอาหาร + K ต่ำ","Gastrinoma: Zollinger-Ellison syndrome — peptic ulcer หลายตำแหน่ง/ที่ผิดที่ (jejunum) ดื้อยา, diarrhea ที่ดีขึ้นด้วย PPI, gastrin สูง &gt; 1000 pg/mL ขณะ gastric pH &lt; 2; ส่วนใหญ่อยู่ใน gastrinoma triangle; จะเป็นคำตอบถ้าโจทย์ให้ refractory ulcer + diarrhea","Pancreatic adenocarcinoma: ก็ทำให้ <b>new-onset DM</b> (โดยเฉพาะอายุ &gt; 50 ปี) และ thrombosis (Trousseau syndrome = migratory thrombophlebitis) ได้ แต่ไม่ทำให้ perineal dermatitis; จะเป็นคำตอบถ้าโจทย์ให้ painless jaundice, weight loss, ปวดทะลุหลัง + DM ใหม่"],
  trap:"เห็น <b>new-onset DM + DVT</b> แล้วตอบ pancreatic adenocarcinoma (Trousseau) — คำที่ตัดสินคือ <b>perineal dermatitis</b> = necrolytic migratory erythema ซึ่งจำเพาะกับ glucagonoma",
  summary:["Glucagonoma: alpha-cell PNET พบน้อย ส่วนใหญ่อยู่ body/tail ของตับอ่อน ก้อนมักใหญ่และมากกว่าครึ่งมี metastasis (ตับ) ตอนวินิจฉัย","อาการ 4D: Diabetes, Dermatitis (necrolytic migratory erythema), DVT/thromboembolism, Depression + weight loss, glossitis/angular cheilitis, normocytic anemia","วินิจฉัย: fasting glucagon สูงมาก (มัก &gt; 500 pg/mL), CT/MRI ตับอ่อน, Ga-68 DOTATATE PET หรือ somatostatin receptor scintigraphy หาตำแหน่ง/metastasis","รักษา: somatostatin analog (octreotide/lanreotide) คุมอาการ ผื่นดีขึ้นเร็ว; ให้ amino acid, zinc, โภชนาการ; anticoagulant prophylaxis; ผ่าตัด resection (distal pancreatectomy ± splenectomy) ถ้า resectable รวมถึง debulking liver metastasis","Functional PNET อื่น: insulinoma (Whipple triad, 90% benign, 90% solitary, กระจายทั่วตับอ่อน), gastrinoma (ZES, gastrinoma triangle, สัมพันธ์ MEN1), VIPoma (WDHA), somatostatinoma (DM + gallstones + steatorrhea)","PNET ร่วมกับ MEN1 (3P: parathyroid, pituitary, pancreas) — ควรตรวจ Ca/PTH ร่วม"],
  notes:"ลายมือรุ่นพี่: ขีดเส้นใต้ \"New onset DM\", \"perineal dermatitis\", \"DVT\" · ลูกศรจาก perineal dermatitis เขียนว่า <b>\"Necrolytic migratory edema ★★\"</b> (หมายถึง necrolytic migratory erythema) · ที่ C Glucagonoma เขียน <b>\"glucagon↑ → glucose↑ → glucose intol. &amp; DM\"</b> · ขีดติ๊ก C เป็นคำตอบ",
  mnemonic:"Glucagonoma = <b>4D</b>: Diabetes, Dermatitis, DVT, Depression",
  guide:"NCCN Neuroendocrine and Adrenal Tumors v.2025 / ENETS Guidance Paper for functioning pancreatic NET (2023)",
  opinion:"",
  variants:["หญิงอายุ 45 ปี ใจสั่น เหงื่อแตก สับสนตอนเช้าก่อนอาหาร glucose 40 mg/dL ดีขึ้นหลังกินน้ำหวาน → insulinoma → 72-hour fast","ท้องเสียเป็นน้ำ 5 L/วัน K 2.5 mmol/L achlorhydria → VIPoma","Refractory peptic ulcer ที่ jejunum + diarrhea + hypercalcemia → gastrinoma ใน MEN1"]}),

A({page:12, page2:12, orig:"61", kimg:KI("62"), flag:"⚠ เติมข้อมูล \"fit, low-risk 2-cm well-differentiated mid-thoracic\" ให้เหลือคำตอบเดียว",
  stem:"A medically fit patient has a 2-cm well-differentiated squamous cell carcinoma of the mid-thoracic esophagus, staged T2N0M0. What is the most appropriate treatment?",
  gray:"61. Esophageal cancer (SCC). T2N0M0. Treatment — A. Esophagectomy B. Definite chemotherapy",
  opts:["Esophagectomy","Definitive chemotherapy","Endoscopic mucosal resection","Esophageal stent","Radiotherapy alone"],
  ans:0, key:"A Esophagectomy"+KS,
  interp:"มะเร็งหลอดอาหาร SCC ระยะ cT2N0M0 (stage II) ในผู้ป่วยที่ผ่าตัดได้ — ถามการรักษาหลัก",
  why:"T2 = ลุกลามถึง <b>muscularis propria</b> แล้ว (เกิน T1a ที่ทำ endoscopic resection ได้) · ตาม NCCN สำหรับ cT2N0 ที่เป็น <b>low-risk lesion</b> (&lt; 3 cm, well differentiated) ในผู้ป่วยที่ fit และ tumor ไม่ใช่ cervical esophagus → <b>esophagectomy</b> (primary surgery) เป็นการรักษาเพื่อหายขาด · ถ้า high-risk (ขนาด ≥ 3 cm, poorly differentiated, LVI) หรือมี node → neoadjuvant chemoradiotherapy (CROSS: carboplatin/paclitaxel + 41.4 Gy) แล้วผ่าตัด หรือ definitive chemoradiotherapy (โดยเฉพาะ SCC/cervical หรือไม่ fit)",
  wrong:["Definitive chemotherapy: chemotherapy เดี่ยว ๆ ไม่ใช่การรักษาเพื่อหายขาดของ localized esophageal cancer — ที่ใช้ได้คือ <b>definitive chemoradiotherapy</b> (RTOG 85-01: CRT ดีกว่า RT เดี่ยว) สำหรับ SCC ที่ไม่ fit ผ่าตัด, cervical esophagus หรือเลือก organ preservation; chemotherapy อย่างเดียวจะเป็นคำตอบเมื่อเป็น stage IV (metastatic)","Endoscopic mucosal resection: ใช้กับ <b>T1a</b> (จำกัดใน mucosa) หรือ high-grade dysplasia เพราะความเสี่ยง LN ต่ำมาก — T2 ลุกลามถึง muscularis propria และเสี่ยงกระจาย LN จึงไม่พอ; จะเป็นคำตอบถ้าโจทย์ให้ T1a N0 ขนาดเล็ก","Esophageal stent: เป็นการ palliate dysphagia ใน unresectable/metastatic disease หรือ tracheoesophageal fistula ไม่ใช่การรักษาหายขาด; จะเป็นคำตอบถ้าโจทย์ให้ stage IV กลืนไม่ได้","Radiotherapy alone: ด้อยกว่า chemoradiotherapy ชัดเจน (RTOG 85-01: 5-year survival 0% กับ RT เดี่ยว เทียบกับ 26% ใน CRT) ใช้เฉพาะ palliation หรือผู้ป่วยที่รับ chemotherapy ไม่ได้"],
  trap:"จำว่า \"SCC ไวต่อรังสี → ฉายแสงอย่างเดียว\" หรือเลือก \"definitive\" เพราะคิดว่าคือ chemoradiation — ช้อยเขียน chemotherapy เดี่ยว ๆ; ในผู้ป่วย fit ที่ T2N0 low-risk การผ่าตัดคือคำตอบมาตรฐาน",
  summary:["Staging: EGD + biopsy → CT chest/abdomen + PET/CT (หา metastasis) → EUS (T/N staging); SCC ส่วนต้น/กลางต้องทำ bronchoscopy ดู airway invasion","T1a (mucosa) → endoscopic resection (EMR/ESD) · T1b → esophagectomy (หรือ ER ในบางรายที่ผิวตื้น)","cT2N0 low-risk (&lt; 3 cm, well differentiated) → esophagectomy; high-risk → neoadjuvant CRT + esophagectomy หรือ definitive CRT","cT3–T4a หรือ N+ → neoadjuvant CRT (CROSS) แล้วผ่าตัด; SCC มี pCR หลัง CRT ~49% จึง definitive CRT เป็นทางเลือก (โดยเฉพาะ cervical esophagus)","Esophagectomy: Ivor Lewis (laparotomy + right thoracotomy, anastomosis ในทรวงอก) สำหรับ mid–lower, McKeown 3-field (anastomosis ที่คอ) สำหรับ upper–mid, transhiatal; ภาวะแทรกซ้อน anastomotic leak, pneumonia, chylothorax, recurrent laryngeal nerve injury","Metastatic → systemic therapy (chemotherapy ± immunotherapy) + palliation dysphagia ด้วย stent/RT"],
  notes:"ลายมือรุ่นพี่: ติ๊ก A Esophagectomy แล้วลากลูกศรเขียนว่า <b>\"in healthy / fit patient\"</b>",
  mnemonic:"",
  guide:"NCCN Esophageal and Esophagogastric Junction Cancers v.2025 / CROSS trial (van Hagen, NEJM 2012)",
  opinion:"⚠ ต้นฉบับให้แค่ \"SCC T2N0M0\" — ถ้าไม่บอกความเสี่ยงของ tumor/ผู้ป่วย definitive chemoradiotherapy ก็เป็นทางเลือกที่ถูกตาม guideline (และ neoadjuvant CRT + surgery ใน high-risk) จึงเติม fit, 2 cm, well differentiated, mid-thoracic เพื่อให้ esophagectomy เป็นคำตอบเดียว สอดคล้องกับที่รุ่นพี่เขียน \"in healthy/fit patient\" · ช้อย B แปลตามต้นฉบับ \"Definite chemotherapy\" = definitive chemotherapy (ไม่มีรังสี) ซึ่งไม่ใช่มาตรฐาน",
  variants:["SCC esophagus ส่วน cervical T3N1 → definitive chemoradiotherapy","Adenocarcinoma GEJ cT3N1 ผู้ป่วยแข็งแรง → neoadjuvant CRT (CROSS) หรือ perioperative FLOT แล้ว esophagectomy","Barrett esophagus with HGD/T1a nodule → endoscopic resection + ablation"]}),

A({page:12, page2:12, orig:"62", kimg:KI("63"),
  stem:"A woman at 20 weeks of gestation presents with fever and abdominal pain that migrates to the right lower quadrant with RLQ tenderness, leukocytosis, nausea, vomiting, and anorexia. What should be done next?",
  gray:"62. หญิงท้อง 20 สัปดาห์ มีไข้ ปวดท้อง migrate tender rlq leukocytosis n/v+anorexiaทำไร — A. US B. MRI C. CT D. Lap dx+- appendectomy",
  opts:["Ultrasound","MRI","CT","Diagnostic laparoscopy with possible appendectomy","Observation"],
  ans:0, key:"A Ultrasound"+KS,
  interp:"สงสัย acute appendicitis ในหญิงตั้งครรภ์ไตรมาสที่ 2 — เลือก imaging แรกที่เหมาะสม",
  why:"Appendicitis เป็น <b>non-obstetric surgical emergency ที่พบบ่อยที่สุดในหญิงตั้งครรภ์</b> (ราว 1:1,500–2,000) อาการ/lab แปลผลยาก (WBC สูงได้ปกติในครรภ์, ไส้ติ่งถูกมดลูกดันขึ้นบนและออกด้านข้าง) · imaging แรกที่แนะนำคือ <b>graded-compression ultrasound</b> เพราะไม่มีรังสี หาได้ทันที และช่วยดู DDx ทางสูติ (ovarian torsion, placental abruption) · ถ้า US ไม่เห็นไส้ติ่ง/ไม่สรุป → <b>MRI</b> (non-contrast) · CT ใช้เมื่อไม่มี MRI · ทำ imaging เพื่อลด negative appendectomy เพราะการผ่าตัดเองก็เพิ่ม fetal loss/preterm labor",
  wrong:["MRI: sensitivity/specificity สูงและไม่มีรังสี แต่เป็น <b>second-line</b> เมื่อ US ไม่สรุป (ใช้เวลา ต้องมีเครื่อง/รังสีแพทย์ ไม่ควรให้ gadolinium); จะเป็นคำตอบถ้าโจทย์บอกว่าทำ US แล้วไม่เห็นไส้ติ่ง","CT: แม่นยำแต่มีรังสีต่อทารก (CT ท้องให้ dose &lt; 50 mGy ซึ่ง ACOG ถือว่าไม่เพิ่ม anomaly แต่ยังควรเลี่ยงถ้ามีทางเลือก) — ใช้เมื่อ US ไม่สรุปและไม่มี MRI; จะเป็นคำตอบในหญิงไม่ตั้งครรภ์ที่อาการไม่ชัด","Diagnostic laparoscopy with possible appendectomy: เหมาะเมื่อ imaging ยืนยันหรือ clinical สงสัยสูงมากโดยไม่มี imaging ที่หาได้ (ไม่ควรเลื่อนผ่าตัดจนไส้ติ่งแตก) — laparoscopic appendectomy ทำได้อย่างปลอดภัยทุกไตรมาส (SAGES 2017); จะเป็นคำตอบถ้าโจทย์บอกว่า US/MRI ยืนยัน appendicitis แล้ว","Observation: ไม่เหมาะ เพราะ perforation ในครรภ์เพิ่ม fetal loss และ preterm delivery อย่างมาก และการวินิจฉัยช้าพบบ่อยในครรภ์; จะพิจารณาเฝ้าดูเฉพาะเมื่อ imaging ไม่พบ appendicitis และอาการไม่ชัด"],
  trap:"รีบเลือก CT เพราะเป็น imaging ที่แม่นที่สุดในคนทั่วไป หรือข้ามไปผ่าตัดทันที — ในครรภ์ <b>US ก่อน → MRI → CT</b>; และอย่าเชื่อว่าคนท้องห้ามทำ laparoscopy",
  summary:["Appendicitis ในครรภ์: พบบ่อยสุดใน non-obstetric surgical disease; ไตรมาส 2 บ่อยสุด; ไส้ติ่งถูกดันขึ้นบน/ด้านข้างตามมดลูก → จุดปวดอาจสูงกว่า McBurney","WBC สูงได้ปกติในครรภ์ (ถึงราว 15,000/mm³) → อาศัย clinical + imaging","Imaging: graded-compression US ก่อน → non-contrast MRI ถ้าไม่สรุป → CT ถ้าไม่มี MRI (ACOG: dose &lt; 50 mGy ไม่สัมพันธ์กับ anomaly/fetal loss)","รักษา: appendectomy ทันทีเมื่อวินิจฉัย; laparoscopy ทำได้ทุกไตรมาส (SAGES 2017) — open Hasson/ปรับตำแหน่ง port ตาม fundal height, CO₂ 10–15 mmHg, จัดท่า left lateral tilt ลด aortocaval compression","Perforation ↑ fetal loss และ preterm labor อย่างชัดเจน — ไม่ควรรอดูอาการนาน; negative appendectomy ก็เพิ่ม fetal loss เล็กน้อย จึงพยายามยืนยันด้วย imaging","Peri-op: fetal heart monitoring ก่อน–หลังผ่าตัด, VTE prophylaxis, tocolytics ไม่ใช้ prophylactic routine"],
  notes:"ลายมือรุ่นพี่: ขีดเส้นใต้ \"หญิงท้อง 20 สัปดาห์\" · ติ๊ก A US · เขียนมุมขวาว่า <b>\"highly suspicious → ผ่าก่อน\"</b> · กากบาท D Lap dx ± appendectomy แล้วเขียน <b>\"คนท้อง prefer แบบ open มากกว่า\"</b> · แปะสไลด์ <b>Appendicitis in the young / elderly / pregnancy / AIDS</b>: pregnancy — most common extrauterine surgical disease 1:2000, 1st–2nd trimester, appendix displaced lateral and superior, new-onset nausea and vomiting, ultrasonography, rupture → fetal mortality; young — difficult to diagnose, delayed diagnosis, 1–5 years old rupture ~65%, ultrasonography; elderly — atypical, age &gt; 80 rupture 49% mortality 21%; AIDS — opportunistic infection, colonoscopy, CT scan",
  mnemonic:"ท้อง + ปวด RLQ: <b>\"Sound → Magnet → Scanner\"</b> (US → MRI → CT)",
  guide:"SAGES Guidelines for the Use of Laparoscopy During Pregnancy (2017) / ACOG Committee Opinion No. 723 (2017) / WSES Jerusalem Guidelines for Acute Appendicitis (2020)",
  opinion:"เห็นด้วยกับคีย์ (มั่นใจสูง) · ข้อสังเกตต่อโน้ตรุ่นพี่ \"คนท้อง prefer แบบ open มากกว่า\" — เป็นแนวคิดเก่า ปัจจุบัน SAGES 2017 และ WSES 2020 ระบุว่า laparoscopic appendectomy ทำได้ปลอดภัยทุกไตรมาส (ทางเลือกขึ้นกับความชำนาญ) · ส่วน \"highly suspicious → ผ่าก่อน\" ใช้ได้ในบริบทที่ imaging หาไม่ได้หรือจะทำให้ผ่าตัดล่าช้า",
  variants:["คนท้อง 24 สัปดาห์ สงสัย appendicitis US ไม่เห็นไส้ติ่ง → MRI abdomen without contrast","คนท้องไตรมาส 3 ยืนยัน appendicitis → laparoscopic หรือ open appendectomy ทันที จัดท่า left lateral tilt","ชายอายุ 25 ปี Alvarado 9 → appendectomy ได้เลย (imaging ไม่จำเป็นเสมอ)"]}),

A({page:13, page2:13, orig:"63", kimg:KI("64"),
  stem:"An elderly man with a reducible inguinal hernia is scheduled for elective repair. Which operation is most appropriate?",
  gray:"63. แก่ๆ reducible herniaนัดมาผ่า — A. Hernirhapphy mesh B. Herniorhapphy tissue repair",
  opts:["Lichtenstein mesh repair","Bassini tissue repair","Shouldice tissue repair","Herniotomy alone","Truss"],
  ans:0, key:"A Lichtenstein mesh repair"+KS,
  interp:"เลือกวิธีผ่าตัด elective inguinal hernia ในผู้ใหญ่ — mesh vs tissue repair",
  why:"HerniaSurge 2018 แนะนำ <b>mesh repair</b> สำหรับ inguinal hernia ในผู้ใหญ่ที่มีอาการทุกราย เพราะ recurrence ต่ำกว่า tissue repair อย่างชัดเจน — <b>Lichtenstein</b> (open tension-free mesh) และ laparo-endoscopic (TEP/TAPP) เป็นวิธีที่มีหลักฐานดีที่สุด · ในผู้สูงอายุ Lichtenstein ทำได้ภายใต้ <b>local anesthesia</b> เหมาะกับคนที่มี comorbidity (HerniaSurge แนะนำ local anesthesia สำหรับ open repair ในผู้ป่วย ASA III–IV)",
  wrong:["Bassini tissue repair: เย็บ conjoint tendon เข้ากับ inguinal ligament แบบมีแรงดึง (tension) → recurrence สูงกว่า mesh; ปัจจุบันแทบไม่ใช้ในผู้ใหญ่ ยกเว้นในแผลปนเปื้อนที่ไม่ควรใช้ mesh","Shouldice tissue repair: เป็น tissue repair ที่ดีที่สุด (เย็บ 4 ชั้นต่อเนื่อง) recurrence ต่ำในมือผู้ชำนาญ — HerniaSurge แนะนำเป็นทางเลือกเมื่อผู้ป่วยไม่ต้องการ mesh, ไม่มี mesh หรือแผลปนเปื้อน; จะเป็นคำตอบถ้าถาม non-mesh repair ที่ดีที่สุด","Herniotomy alone: คือ high ligation ของ hernia sac อย่างเดียว ใช้ใน <b>indirect inguinal hernia ในเด็ก</b> (patent processus vaginalis) ซึ่ง posterior wall ปกติ; ในผู้ใหญ่ต้องซ่อม posterior wall ด้วย; จะเป็นคำตอบถ้าโจทย์เป็นเด็ก","Truss: เครื่องพยุงจากภายนอก ไม่รักษาหาย อาจทำให้ผิวหนังเสียดสี/ไส้เลื่อนติด ไม่แนะนำ; ใช้ชั่วคราวในผู้ที่ผ่าตัดไม่ได้หรือปฏิเสธผ่าตัด"],
  trap:"คิดว่า \"คนแก่ = ผ่าแบบง่าย tissue repair\" — ผู้สูงอายุยิ่งเหมาะกับ Lichtenstein ภายใต้ local anesthesia และ mesh ลด recurrence",
  summary:["Adult inguinal hernia ที่มีอาการ → mesh repair: Lichtenstein (open) หรือ TEP/TAPP (laparo-endoscopic) — HerniaSurge 2018","Laparo-endoscopic เหมาะ: bilateral hernia, recurrent หลัง open repair, ผู้หญิง (หา femoral hernia ร่วม), ต้องการกลับไปทำงานเร็ว/ปวดเรื้อรังน้อย; open Lichtenstein เหมาะ: recurrent หลัง posterior repair, ทำ GA ไม่ได้ (ใช้ local anesthesia)","Shouldice = tissue repair ที่ดีที่สุดเมื่อไม่ใช้ mesh; Bassini/McVay เก่า recurrence สูง (McVay ใช้ Cooper ligament → ซ่อม femoral hernia ได้)","ผู้ชาย asymptomatic/minimally symptomatic → watchful waiting ได้ แต่ส่วนใหญ่จะต้องผ่าในระยะยาวเพราะอาการมากขึ้น; ผู้หญิง → ผ่าตัดเพราะ femoral hernia เสี่ยง strangulation สูง","เด็ก: indirect hernia → herniotomy (high ligation) อย่างเดียว ผ่าเร็วหลังวินิจฉัย","ภาวะแทรกซ้อน: chronic postoperative inguinal pain (ระวัง ilioinguinal, iliohypogastric, genital branch of genitofemoral n.), seroma, hematoma, SSI, recurrence, ischemic orchitis","ดูข้อ 1, 3, 37, 65, 66 (hernia/bowel obstruction)"],
  notes:"ลายมือรุ่นพี่: ติ๊ก A Herniorrhaphy mesh แล้วเขียน <b>\"ปจบ. prefer Tension-free op. (Lichtenstein)\"</b>",
  mnemonic:"",
  guide:"HerniaSurge Group: International guidelines for groin hernia management (2018) / Sabiston Textbook of Surgery 21st ed.",
  opinion:"เห็นด้วยกับคีย์ (มั่นใจสูง) — ต้นฉบับเขียนแค่ \"hernia\" จึงเติมว่า inguinal (Lichtenstein ใช้กับ inguinal hernia) และแตกช้อย tissue repair ออกเป็น Bassini/Shouldice + herniotomy + truss",
  variants:["ชายอายุ 45 ปี bilateral inguinal hernia ต้องการกลับไปทำงานเร็ว → laparoscopic TEP/TAPP","เด็กชายอายุ 2 ปี indirect inguinal hernia reducible → elective herniotomy","Recurrent inguinal hernia หลัง Lichtenstein → laparo-endoscopic (posterior) repair"]}),

A({page:13, page2:13, orig:"64", kimg:KI("65"), flag:"⚠ เติม \"hemodynamically stable, no peritoneal signs\" ให้ถามเป็นขั้นแรกของการวินิจฉัย",
  stem:"A patient with a history of appendectomy has had abdominal pain for more than 6 hours and has not passed flatus. Digital rectal examination reveals no stool. He is hemodynamically stable without peritoneal signs. What should be done first?",
  gray:"64.เกิน6ชมเคยผ่าไส้ติ่ง ปวดท้อง prไม่เจออึ ไม่ตด — A. Conservative B. Emer lap C. Abdominal series",
  opts:["Conservative treatment","Emergency laparotomy","Acute abdominal series","Colonoscopy","Barium enema"],
  ans:2, key:"C Acute abdominal series"+KS,
  interp:"เคยผ่าตัดช่องท้อง + ปวดท้อง + ไม่ผายลม + PR ไม่มีอุจจาระ → สงสัย adhesive small bowel obstruction — ถามสิ่งที่ต้องทำก่อนเพื่อยืนยันการวินิจฉัย",
  why:"ต้อง <b>ยืนยันการวินิจฉัยและระดับการอุดตัน</b> ก่อนตัดสินใจรักษา — <b>acute abdominal series</b> (supine + upright/left lateral decubitus abdomen + upright CXR) หาได้ทันทีและราคาถูก: เห็น dilated small bowel loops (&gt; 3 cm), <b>multiple air-fluid levels</b> แบบ step-ladder, ไม่มีลมใน colon/rectum (complete) และดู free air ใต้กระบังลม · ระหว่างนั้นเริ่ม NPO, NG decompression, IV fluid ไปพร้อมกัน · CT abdomen (contrast) แม่นยำกว่า บอกจุดอุดตัน closed-loop และ strangulation — WSES แนะนำ CT เมื่อทำได้",
  wrong:["Conservative treatment: (NG tube, NPO, IV fluid, ± water-soluble contrast) เป็นการรักษาหลักของ adhesive SBO ที่ไม่มี strangulation สำเร็จ &gt; 70–80% แต่ต้องยืนยันการวินิจฉัยด้วย imaging ก่อน; จะเป็นคำตอบถ้าโจทย์ให้ผล film/CT เป็น partial adhesive SBO ไม่มีสัญญาณ ischemia แล้วถามการรักษา","Emergency laparotomy: ทำเมื่อมี <b>peritonitis, สัญญาณ strangulation</b> (ไข้ ชีพจรเร็ว ปวดต่อเนื่อง WBC/lactate สูง), CT เห็น closed-loop/ischemia หรือ conservative ล้มเหลวเกิน 48–72 ชม.; จะเป็นคำตอบถ้าโจทย์ให้ tenderness/guarding ชัด หรือ shock","Colonoscopy: ใช้ในการวินิจฉัย/decompress large bowel obstruction (sigmoid volvulus) หรือหาสาเหตุมะเร็งลำไส้ใหญ่ — ไม่มีบทบาทใน SBO และห้ามเป่าลมในภาวะลำไส้อุดตันโดยไม่จำเป็น; จะเป็นคำตอบถ้าโจทย์ให้ coffee-bean sign ของ sigmoid volvulus","Barium enema: ดู large bowel; barium ห้ามใช้เมื่อสงสัย perforation และไม่ช่วยใน SBO (ถ้าจะใช้ contrast ใน SBO ใช้ water-soluble ทางปาก/NG); จะเป็นคำตอบเชิงประวัติศาสตร์สำหรับ intussusception/volvulus ของ large bowel"],
  trap:"เห็นคำว่า \"ไม่ผายลม + PR ว่าง = complete obstruction\" แล้วข้ามไปผ่าตัดทันที — ถ้ายังไม่มี peritonitis/strangulation ต้อง <b>imaging ก่อน</b> และผู้ป่วย adhesive SBO ส่วนใหญ่หายด้วย conservative",
  summary:["Adhesion = สาเหตุอันดับ 1 ของ SBO ในผู้ใหญ่ที่เคยผ่าตัดช่องท้อง; hernia = อันดับ 1 ถ้าไม่เคยผ่าตัด (ต้องตรวจ groin เสมอ)","อาการ: ปวดบิดเป็นพัก ๆ, อาเจียน, ท้องอืด, ไม่ผายลม/ไม่ถ่าย (obstipation = complete)","Investigation: acute abdominal series (dilated SB &gt; 3 cm, air-fluid levels, ไม่มีลมใน colon) → CT abdomen ดีที่สุดในการบอก transition point, closed-loop (whirl sign, C/U-shaped loop), strangulation (wall enhancement ลด, mesenteric edema, free fluid, pneumatosis)","Lab: CBC, electrolytes (hypoK, metabolic alkalosis จากอาเจียน), BUN/Cr, lactate","Non-operative management (NPO, NG decompression, IV fluid/electrolytes) ใน adhesive SBO ที่ไม่มี strangulation; water-soluble contrast (Gastrografin) — ถ้าถึง colon ภายใน 24 ชม. ทำนายว่าหายโดยไม่ต้องผ่า","ผ่าตัดเมื่อ: peritonitis, strangulation/closed-loop, conservative ล้มเหลว (WSES: ไม่ควรเกิน 72 ชม.; ตำราไทย ~48 ชม.)","ดูข้อ 66 (incarcerated/strangulated hernia)"],
  notes:"ลายมือรุ่นพี่: เขียนเหนือโจทย์ว่า <b>\"Acute abdomen\"</b> ลากจาก \"เกิน 6 ชม.\" (ปวดท้อง &gt; 6 ชม. = acute abdomen) · ขีดเส้นใต้ \"ปวดท้อง pr ไม่เจออึ ไม่ตด\" · ติ๊ก C Abdominal series แล้วเขียน <b>\"for diagnosis\"</b> · แปะข้อความจากตำราไทยเรื่องลำไส้อุดตันจาก adhesion (ไฮไลต์): การอุดตันแบบ partial รักษาแบบ conservative สำเร็จ &gt; 80% สามารถหายได้โดยไม่ต้องผ่าตัด; complete obstruction เดิมแนะนำผ่าตัดเร็ว (\"the sun should never rise and set on a complete bowel obstruction\") แต่ปัจจุบัน CT scan ช่วยวินิจฉัย closed-loop obstruction หรือ strangulation ได้ดีขึ้น ถ้าไม่มีภาวะดังกล่าวสามารถให้ conservative treatment ก่อนได้ราว 48 ชม. ถ้าไม่ดีขึ้นหรือมีสัญญาณ strangulation จึงผ่าตัด",
  mnemonic:"SBO: <b>\"Drip and Suck\"</b> (IV fluid + NG) หลัง imaging — ผ่าเมื่อ \"Peritonitis, Pain ต่อเนื่อง, Pulse เร็ว, Pyrexia\"",
  guide:"WSES Bologna guidelines for adhesive small bowel obstruction (2017 update, publ. 2018) / Sabiston Textbook of Surgery 21st ed.",
  opinion:"เห็นด้วยกับคีย์ (มั่นใจปานกลาง–สูง) — ⚠ ต้นฉบับไม่ได้บอกว่ามี/ไม่มี peritonitis ถ้าโจทย์จริงมีสัญญาณ strangulation คำตอบจะเป็น emergency laparotomy จึงเติม \"stable without peritoneal signs\" · ในทางปฏิบัติ NG + IV fluid (conservative) เริ่มพร้อมกับส่ง film ได้เลย แต่คำถาม \"ทำอะไรก่อน\" เพื่อวินิจฉัย คำตอบคือ imaging; ปัจจุบัน CT มีบทบาทมากกว่า plain film แต่ไม่อยู่ในช้อย",
  variants:["Adhesive SBO 3 วัน NG ยังออกมาก Gastrografin ไม่ถึง colon ใน 24 ชม. → operative management","SBO + ไข้ ชีพจร 120 lactate สูง CT เห็น whirl sign → emergency laparotomy","ผู้สูงอายุไม่เคยผ่าตัด SBO → ตรวจหา incarcerated femoral/inguinal hernia ก่อน"]}),

A({page:13, page2:13, orig:"65", kimg:KI("66"),
  stem:"A patient with a previously reducible hernia suddenly develops a hernia that can no longer be reduced, with abdominal pain and fever. What is the most appropriate management?",
  gray:"65. ปกติreducible herniaแต่อยูๆ่ ก่ไม่reduce มีปวดท้อง เป็นไข้ — A. Emer hernio B. Elective hernio",
  opts:["Emergency herniorrhaphy","Elective herniorrhaphy","Manual reduction then discharge","Observation with analgesics","Truss application"],
  ans:0, key:"A Emergency herniorrhaphy"+KS,
  interp:"ไส้เลื่อนที่เคยดันกลับได้ กลายเป็นดันไม่กลับ + ปวดท้อง + ไข้ → สงสัย strangulation",
  why:"Irreducible hernia (incarceration) ที่มี <b>ปวดมาก ไข้ (systemic signs)</b> หรืออาการ bowel obstruction บ่งว่าเลือดไปเลี้ยงลำไส้ที่ติดอยู่ลดลง = <b>strangulated hernia</b> → ลำไส้ ischemia/necrosis/perforation ได้ภายในไม่กี่ชั่วโมง → ต้อง <b>emergency herniorrhaphy</b> พร้อมประเมิน bowel viability (resect ถ้าเน่า) หลัง resuscitation (IV fluid, antibiotics) · <b>ห้าม manual reduction (taxis)</b> เมื่อสงสัย strangulation เพราะอาจดันลำไส้ที่เน่ากลับเข้าท้องหรือเกิด reduction en masse",
  wrong:["Elective herniorrhaphy: สำหรับไส้เลื่อนที่ reducible ไม่มีภาวะแทรกซ้อน — การรอนัดในกรณีนี้เสี่ยงลำไส้เน่า; จะเป็นคำตอบถ้าโจทย์ให้ไส้เลื่อนดันกลับได้ ไม่มีอาการ","Manual reduction then discharge: (taxis ภายใต้ sedation/analgesia + Trendelenburg) ทำได้ใน incarceration ที่ <b>ไม่มีสัญญาณ strangulation</b> และเป็นมาไม่นาน แล้วนัดผ่าตัดเร็ว — แต่โจทย์มีไข้และปวด จึงห้าม; จะเป็นคำตอบถ้าเป็น incarcerated hernia ไม่เจ็บมาก ไม่มีไข้ ไม่มี obstruction","Observation with analgesics: ทำให้การผ่าตัดล่าช้า เพิ่ม bowel resection และ mortality; ไม่มีบทบาทใน irreducible hernia ที่มีอาการ","Truss application: ใส่บนไส้เลื่อนที่ดันไม่กลับเป็นข้อห้าม (กดลำไส้ที่ติดอยู่ยิ่ง ischemia); ใช้เฉพาะ reducible hernia ในผู้ที่ผ่าตัดไม่ได้"],
  trap:"คิดว่าต้องลองดันกลับ (taxis) ก่อนเสมอ — เมื่อมี <b>ไข้ ปวดมาก ผิวหนังแดง/เขียว หรือ peritonitis</b> = strangulation ห้ามดัน ไปผ่าตัดเลย",
  summary:["Reducible → incarcerated (ดันไม่กลับ แต่เลือดยังเลี้ยง) → strangulated (blood supply ถูกตัด → ischemia/necrosis)","สัญญาณ strangulation: ปวดมากต่อเนื่อง เจ็บที่ก้อน ผิวหนังแดง/คล้ำ ไข้ tachycardia leukocytosis lactate สูง อาการ obstruction peritonitis","Strangulated → resuscitation + IV antibiotics + emergency repair, ประเมิน bowel viability (สี, peristalsis, pulsation) → resect ถ้าเน่า; mesh ใช้ได้ถ้าไม่มี gross contamination (HerniaSurge 2018)","Incarcerated ไม่มีสัญญาณ strangulation, เป็นมาไม่นาน → ลอง taxis ภายใต้ sedation/analgesia + Trendelenburg; ถ้าสำเร็จนัดผ่าตัดเร็ว ถ้าไม่สำเร็จ (รุ่นพี่: เกิน 6 ชม. ยังไม่กลับ) → ผ่าตัดฉุกเฉิน","หลัง taxis สังเกตอาการ peritonitis (ระวัง reduction en masse = ดันทั้ง sac กลับเข้าไปพร้อมลำไส้ที่ยังรัดอยู่)","Femoral hernia เสี่ยง strangulation สูงสุด (คอแคบ) → ควรผ่าตัดทุกรายแม้ไม่มีอาการ","ดูข้อ 1, 3, 37, 64 (hernia)"],
  notes:"ลายมือรุ่นพี่: ขีดเส้นใต้ \"แต่อยู่ ๆ ก็ไม่ reduce มีปวดท้อง เป็นไข้\" แล้วเขียน <b>\"strangulation (&amp; Obstruction) — ต้องผ่าแล้ว\"</b> · ติ๊ก A Emer hernio · ลูกศรลงมาเขียนว่า <b>\"ถ้า incarcerate เฉย ๆ → ลอง sedative + manual reduction ดู → ถ้าดันกลับก็ค่อยนัดมา OPD\"</b> และ <b>\"ถ้าเกิน 6 ชม. แล้วยังไม่กลับเข้าท้อง → ควร emer lap.\"</b> (ข้อความส่วนหลังต่อไปที่หน้าข้อ 66)",
  mnemonic:"",
  guide:"HerniaSurge Group: International guidelines for groin hernia management (2018) / WSES guidelines for emergency repair of complicated abdominal wall hernias (2017)",
  opinion:"เห็นด้วยกับคีย์ (มั่นใจสูง) · โน้ตรุ่นพี่ \"ดันกลับได้ค่อยนัด OPD\" — ในทางปฏิบัติหลัง taxis สำเร็จควรนัดผ่าตัดเร็ว (ภายในไม่กี่วัน/ช่วงเดียวกัน) ไม่ควรปล่อยนาน",
  variants:["Incarcerated inguinal hernia 3 ชม. ไม่ปวดมาก ไม่มีไข้ → taxis ภายใต้ sedation แล้วนัด early repair","หญิงสูงอายุ ก้อนใต้ inguinal ligament ดันไม่กลับ + อาเจียน → strangulated femoral hernia → emergency repair","หลังดันไส้เลื่อนกลับแล้วยังปวดท้อง มีอาการ obstruction → reduction en masse → explore"]}),

A({page:13, page2:13, orig:"66", kimg:KI("67"),
  stem:"A 28-year-old woman palpates a breast lump that feels cystic. What is the most appropriate initial imaging?",
  gray:"66. อายุ 28 คลำก้อนที่นม รสว่าcystic lesion — A. US B. US+mammogram C. Mammogram",
  opts:["Ultrasound","Ultrasound and mammogram","Mammogram","Breast MRI","Core needle biopsy"],
  ans:0, key:"A Ultrasound"+KS,
  interp:"ก้อนเต้านมคลำได้ในหญิงอายุน้อย &lt; 30 ปี ลักษณะ cystic — ถาม imaging แรก",
  why:"หญิงอายุ <b>&lt; 30 ปี</b> ที่คลำก้อนได้ → <b>targeted breast ultrasound</b> เป็น imaging แรก (ACR, NCCN) เพราะเนื้อเต้านมหนาแน่น mammogram sensitivity ต่ำ, ความเสี่ยงมะเร็งต่ำ และไม่มีรังสี · US แยก simple cyst (anechoic, ขอบเรียบ, posterior acoustic enhancement → BI-RADS 2) จาก complicated/complex cystic-solid mass และ solid mass ได้ดี · mammogram เพิ่มเมื่อ US สงสัยมะเร็ง (BI-RADS 4–5)",
  wrong:["Ultrasound and mammogram: เป็น imaging แรกของหญิง <b>อายุ ≥ 40 ปี</b> (และเลือกได้ในช่วง 30–39 ปี); ในอายุ &lt; 30 ปีเพิ่ม mammogram เฉพาะเมื่อ US พบลักษณะน่าสงสัย; จะเป็นคำตอบถ้าโจทย์อายุ 45 ปี","Mammogram: เดี่ยว ๆ ไม่เหมาะในหญิงอายุน้อย (dense breast ซ่อนก้อน + รังสี) และแยก cyst จาก solid ไม่ได้; จะเป็นคำตอบสำหรับ screening หญิงอายุ ≥ 40 ปีที่ไม่มีอาการ","Breast MRI: ไม่ใช่ imaging แรกของ palpable mass; ใช้ใน high-risk screening (BRCA, lifetime risk ≥ 20%), ประเมิน extent ก่อนผ่าตัดบางราย, หา occult primary ใน axillary metastasis, หรือดู implant rupture","Core needle biopsy: ทำหลัง imaging เมื่อพบ solid mass ที่ไม่ใช่ BI-RADS 2 หรือ complex cystic-solid mass (BI-RADS 4) — ไม่ทำก่อน imaging; ถ้าเป็น simple cyst ไม่ต้อง biopsy (aspirate ถ้ามีอาการ)"],
  trap:"\"ก้อนเต้านม = mammogram\" — ต้องดู <b>อายุ</b>: &lt; 30 ปี US, ≥ 40 ปี mammogram + US",
  summary:["Palpable breast mass: อายุ &lt; 30 ปี → US ก่อน; 30–39 ปี → US หรือ mammogram/DBT (ส่วนมากทำทั้งคู่); ≥ 40 ปี → diagnostic mammogram + US (ACR/NCCN)","Triple assessment: clinical exam + imaging + tissue (core needle biopsy) — ถ้าทั้ง 3 ไม่สอดคล้องกันต้องตรวจเพิ่ม/excision","Simple cyst (anechoic, ขอบเรียบ, posterior enhancement) → BI-RADS 2 → ไม่ต้องทำอะไร หรือ aspirate ถ้าเจ็บ; ถ้าเลือดปนหรือก้อนไม่ยุบ/กลับมาซ้ำ → ตรวจเพิ่ม","Complicated cyst (มี internal echo) → BI-RADS 3 → short-interval follow-up หรือ aspiration; complex cystic-solid → BI-RADS 4 → core biopsy","ก้อน solid ในหญิงอายุน้อย ส่วนใหญ่ = fibroadenoma (ขอบเรียบ เคลื่อนได้ ovoid wider-than-tall) → BI-RADS 3 follow-up หรือ biopsy ตามขนาด/การโต","Mammogram ในหญิงอายุน้อยมี sensitivity ต่ำเพราะเนื้อเยื่อ dense","ดูข้อ 19, 26, 74 (breast)"],
  notes:"ลายมือรุ่นพี่: ติ๊ก A US เขียนว่า <b>\"อายุ &lt; 35\"</b> · B US + mammogram เขียนว่า <b>\"อายุ &gt; 35\"</b>",
  mnemonic:"เต้านม: <b>\"30 ลงมา ใช้เสียง (US) — 40 ขึ้นไป ใช้แสง (mammogram)\"</b>",
  guide:"ACR Appropriateness Criteria: Palpable Breast Masses (2022 update) / NCCN Breast Cancer Screening and Diagnosis v.2024",
  opinion:"เห็นด้วยกับคีย์ (มั่นใจสูง) · จุดตัดอายุที่รุ่นพี่เขียน (35 ปี) เป็นแนวที่บางสถาบันในไทยใช้ แต่ guideline สากล (ACR, NCCN) ใช้ &lt; 30 ปี = US อย่างเดียว, 30–39 ปี เลือก US หรือ mammogram, ≥ 40 ปี = mammogram + US — อายุ 28 ปีจึงเป็น US ทุกแนวทาง",
  variants:["หญิงอายุ 45 ปี คลำก้อนเต้านม 2 cm → diagnostic mammogram + US","หญิงอายุ 25 ปี US เห็น oval circumscribed solid mass 1.5 cm → fibroadenoma (BI-RADS 3) → follow-up หรือ core biopsy","US เห็น simple cyst เจ็บมาก → aspiration; ถ้า aspirate เป็นเลือดหรือก้อนไม่ยุบ → ตรวจเพิ่ม/biopsy"]}),

A({page:13, page2:13, orig:"67", kimg:KI("68"), flag:"⚠ ต้นฉบับโจทย์ไม่ชัด (\"เพิ่งผ่าตัดมาดูระดับของ\") — ตีความเป็นการเปรียบเทียบ metabolism หลังผ่าตัดกับ simple starvation",
  stem:"Compared with simple starvation, which metabolic process is decreased in a patient who has just undergone major surgery?",
  gray:"67. เพิ่งผ่าตัดมาดูระดับของ — a. Proteolysis b. Gluconeogenesis c. Ketogenesis d. Cytokine",
  opts:["Proteolysis","Gluconeogenesis","Ketogenesis","Cytokine release","Lipolysis"],
  ans:2, key:NK,
  interp:"ถามความต่างของ metabolic response ต่อการบาดเจ็บ/ผ่าตัด (stress) เทียบกับการอดอาหารธรรมดา",
  why:"Simple starvation: insulin ต่ำ → lipolysis ↑ → ตับเปลี่ยน fatty acid เป็น <b>ketone bodies</b> ให้สมองใช้แทน glucose → <b>ลด gluconeogenesis จาก amino acid (protein sparing)</b> · Surgery/injury: catecholamines, cortisol, glucagon, cytokines (IL-1, IL-6, TNF-α) ↑ + <b>insulin resistance แต่ insulin ในเลือดสูง (hyperinsulinemia)</b> → insulin ยับยั้ง hepatic ketogenesis → <b>ketogenesis ลดลง/ถูกกด</b> ร่างกายจึงไม่ปรับไปใช้ ketone ทำให้ต้องสลาย protein (proteolysis ↑) มาทำ gluconeogenesis ต่อเนื่อง → negative nitrogen balance และ hyperglycemia",
  wrong:["Proteolysis: <b>เพิ่มขึ้น</b>หลังผ่าตัด (กล้ามเนื้อสลายเป็น alanine/glutamine ไปทำ gluconeogenesis และสร้าง acute-phase proteins) ต่างจาก starvation ระยะยาวที่ proteolysis ลดลงเมื่อปรับไปใช้ ketone; จะเป็นคำตอบถ้าถามว่ากระบวนการใดลดลงใน prolonged starvation","Gluconeogenesis: <b>เพิ่มขึ้น</b>ใน injury จาก glucagon/cortisol/catecholamine และไม่ถูกกดด้วย glucose/insulin ภายนอก (ทำให้เกิด stress hyperglycemia); ใน prolonged starvation gluconeogenesis จาก protein กลับลดลง","Cytokine release: <b>เพิ่มขึ้น</b>อย่างมาก (IL-6 สูงสัมพันธ์กับขนาดการบาดเจ็บ) เป็นตัวขับ acute-phase response, ไข้ และ catabolism; ไม่ใช่สิ่งที่ลดลง","Lipolysis: <b>เพิ่มขึ้น</b>ทั้งใน starvation และ injury (catecholamine กระตุ้น hormone-sensitive lipase) — fat เป็นแหล่งพลังงานหลักในทั้งสองภาวะ; ที่ต่างกันคือ fatty acids ไม่ถูกแปลงเป็น ketone มากใน injury"],
  trap:"เหมาเอาว่า \"stress = catabolism ทุกอย่างเพิ่ม\" — ketogenesis คือกระบวนการเดียวที่ <b>ถูกกด</b>ใน injury เพราะ insulin สูง ซึ่งต่างจาก starvation",
  summary:["Metabolic response to injury: ebb phase (24–48 ชม. แรก: hypometabolism, ลด cardiac output/O₂ consumption) → flow phase (catabolic → anabolic: hypermetabolism, ↑ REE, ↑ O₂ consumption)","ฮอร์โมน: catecholamine, cortisol, glucagon, GH, ADH, aldosterone ↑; insulin สูงแต่ทำงานไม่ได้ (insulin resistance) → stress hyperglycemia","Injury: proteolysis ↑, gluconeogenesis ↑ (ไม่ถูกกดด้วย glucose), lipolysis ↑, ketogenesis ↓, acute-phase proteins ↑ (CRP), albumin ↓, negative nitrogen balance","Simple starvation: ระยะแรกใช้ glycogen (หมดใน ~24 ชม.) → gluconeogenesis จาก protein → หลายวันต่อมาสมองปรับใช้ ketone → protein sparing, REE ลดลง","ผลทางคลินิก: ผู้ป่วยหลังผ่าตัด/sepsis สูญเสียกล้ามเนื้อเร็ว → early enteral nutrition, protein 1.2–2.0 g/kg/วัน, ควบคุม glucose","ERAS ลด stress response: carbohydrate loading ก่อนผ่าตัด, ลดการอดอาหาร, epidural/opioid-sparing analgesia, early feeding","ดูข้อ 52, 54 (nutrition/ERAS)"],
  notes:"รุ่นพี่<b>ขีดฆ่าทั้งข้อ</b> (กากบาทใหญ่ทับโจทย์และช้อย a–d) ไม่ได้วงคำตอบ → ไม่มีเฉลยในไฟล์ · ช้อยต้นฉบับมี 4 ข้อ (Proteolysis, Gluconeogenesis, Ketogenesis, Cytokine) แต่งเพิ่ม Lipolysis",
  mnemonic:"Injury vs starvation: <b>\"ทุกอย่างขึ้น ยกเว้น Keto\"</b> — insulin สูงกด ketone",
  guide:"Schwartz's Principles of Surgery 11th ed. (Systemic Response to Injury and Metabolic Support) / Sabiston Textbook of Surgery 21st ed.",
  opinion:"⚠ ไม่มีคีย์ (รุ่นพี่ขีดฆ่าทั้งข้อ) — โจทย์ต้นฉบับขาดหาย จึงตีความจากช้อยว่าน่าจะถามความต่างระหว่าง injury กับ starvation; ช้อยที่ \"ลดลง\" หลังผ่าตัดมีข้อเดียวคือ ketogenesis (มั่นใจปานกลาง ในแง่ที่โจทย์จริงอาจถามอย่างอื่น เช่น \"อะไรเพิ่มขึ้น\" ซึ่งจะมีหลายคำตอบ)",
  variants:["ผู้ป่วย sepsis นอน ICU 7 วัน urine urea nitrogen สูง → negative nitrogen balance จาก proteolysis","ผู้ป่วยอดอาหาร 3 สัปดาห์ สมองใช้พลังงานหลักจาก → ketone bodies","Insulin resistance หลังผ่าตัดลดได้ด้วย → preoperative carbohydrate loading (ERAS)"]}),

A({page:13, page2:13, orig:"68", kimg:KI("69"), flag:"⚠ คีย์ตอบ Elective open repair — symptomatic AAA ต้อง urgent repair จึงแต่งช้อยถูกเพิ่ม และเติม \"no rupture on CT\"",
  stem:"A 55-year-old patient presents with back pain and a pulsatile abdominal mass. CT shows a saccular abdominal aortic aneurysm without evidence of rupture. What is the most appropriate management?",
  gray:"68 อายุ55 CT เจอ?? Saccular aneurysm? ปวดหลัง เจอ pulsatile mass — A. Elective Open repair B. Endo vascular repair ถ้าขนาดใหญ่ขึ้น C. ติดตามขนาด ใหญ่ขึ้นให้ผ่า",
  opts:["Urgent repair during this admission","Elective open repair","Endovascular repair if it enlarges","Surveillance and repair if it enlarges","Beta-blocker therapy alone"],
  ans:0, key:"B Elective open repair"+KS,
  interp:"AAA ที่ <b>มีอาการ</b> (ปวดหลัง/ท้อง) แต่ยังไม่แตก + รูปร่าง saccular — ถามจังหวะการซ่อม",
  why:"<b>Symptomatic intact AAA</b> (ปวดหลัง/ท้อง/กดเจ็บที่ก้อนโดยไม่มีสาเหตุอื่น) เสี่ยงแตกในระยะสั้นสูง → SVS 2018 และ ESVS 2024 แนะนำ <b>urgent repair</b> (ภายในการนอนโรงพยาบาลครั้งนี้ หลังเตรียมผู้ป่วย/ภาพ CTA ให้พร้อม) <b>โดยไม่ขึ้นกับขนาด</b> · นอกจากนี้ <b>saccular morphology</b> ถือว่าเสี่ยงแตกสูงกว่า fusiform จึงพิจารณาซ่อมแม้ขนาดยังไม่ถึงเกณฑ์ (5.5 cm ในชาย / 5.0 cm ในหญิง) — saccular ในคนอายุ 55 ปีต้องนึกถึง <b>infective (mycotic) aneurysm</b> หรือ penetrating aortic ulcer ด้วย (ส่ง blood culture) · วิธีซ่อม EVAR หรือ open ขึ้นกับ anatomy/ความเสี่ยงผู้ป่วย",
  wrong:["Elective open repair (คีย์ของรุ่นพี่): หลักการ \"ต้องซ่อม ไม่ต้องรอให้ขยาย\" ถูก แต่การนัดผ่าตัดแบบ elective ปล่อยให้ผู้ป่วยที่ <b>มีอาการ</b> กลับบ้านไปรอ เสี่ยงแตกระหว่างรอ — จะเป็นคำตอบถ้าเป็น saccular AAA หรือ fusiform ≥ 5.5 cm ที่ <b>ไม่มีอาการ</b> และผู้ป่วยเหมาะกับ open repair","Endovascular repair if it enlarges: การรอให้ขยายก่อนใช้กับ fusiform AAA ขนาดเล็กที่ไม่มีอาการ; ในที่นี้มีอาการ + saccular ไม่ควรรอ; EVAR เป็นวิธีที่ใช้ได้ (ถ้า anatomy เหมาะ) แต่ควรทำ urgent ไม่ใช่รอขยาย","Surveillance and repair if it enlarges: เหมาะกับ asymptomatic fusiform AAA &lt; 5.5 cm (ชาย) — US/CT ทุก 1–3 ปีตามขนาด, ซ่อมเมื่อถึงเกณฑ์ หรือโต &gt; 1 cm/ปี หรือเกิดอาการ","Beta-blocker therapy alone: ไม่ลดอัตราการขยาย/แตกของ AAA (RCT ไม่พบประโยชน์); การรักษา medical ของ AAA คือหยุดบุหรี่ (สำคัญสุด), statin, antiplatelet, คุมความดัน — ใช้ร่วมกับ surveillance ไม่ใช่แทนการซ่อม"],
  trap:"ดูแต่ขนาดแล้วตอบ surveillance — <b>อาการ</b> (symptomatic) และ <b>saccular shape</b> คือข้อบ่งชี้ให้ซ่อมโดยไม่ต้องรอถึงเกณฑ์ขนาด; และ symptomatic ต้อง urgent ไม่ใช่ elective",
  summary:["ข้อบ่งชี้ซ่อม AAA: ruptured (emergency), symptomatic (urgent), asymptomatic fusiform ≥ 5.5 cm ในชาย / ≥ 5.0 cm ในหญิง, โต ≥ 1 cm/ปี, saccular (พิจารณาซ่อมที่ขนาดเล็กกว่า)","Ruptured AAA: triad ปวดหลัง/ท้อง + hypotension + pulsatile mass → ไม่ต้อง CT ถ้า unstable → OR (EVAR ถ้า anatomy เหมาะ), permissive hypotension","Symptomatic intact AAA: CTA → urgent repair ภายใน admission เดียวกัน","Surveillance asymptomatic AAA (ESVS 2024): 3.0–3.9 cm ทุก 3 ปี, 4.0–4.9 cm ทุกปี, ≥ 5.0 cm ทุก 3–6 เดือน","Screening: US ครั้งเดียวในชายอายุ 65–75 ปีที่เคยสูบบุหรี่ (USPSTF)","EVAR: perioperative mortality ต่ำกว่า open แต่ต้อง surveillance ตลอดชีวิต (endoleak type I–V); open: durable, เหมาะคนอายุน้อย fit ที่ anatomy ไม่เหมาะ EVAR","Saccular aneurysm: นึกถึง mycotic aneurysm (Salmonella, Staphylococcus), penetrating aortic ulcer, pseudoaneurysm"],
  notes:"ลายมือรุ่นพี่: วงคำว่า \"เจอ??\" กับ \"Saccular aneurysm?\" เขียน <b>\"(Not fusiform)\"</b> · ขีดเส้นใต้ \"ปวดหลัง เจอ pulsatile mass\" เขียน <b>\"symptomatic\"</b> · ลากลูกศรไปเขียน <b>\"ยังไงก็ควรผ่า, ไม่ต้องรอขยาย\"</b> · ติ๊ก A Elective Open repair",
  mnemonic:"AAA ซ่อมเมื่อ <b>\"Rupture-Symptom-Size-Speed-Saccular\"</b> (แตก, มีอาการ, ≥ 5.5, โต ≥ 1 cm/ปี, saccular)",
  guide:"ESVS 2024 Clinical Practice Guidelines on the Management of Abdominal Aorto-iliac Artery Aneurysms / SVS Practice Guidelines on AAA (2018)",
